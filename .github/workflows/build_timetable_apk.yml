name: Build School Timetable APK

on:
  push:
    paths:
      - "school_timetable/**"
      - ".github/workflows/build_timetable_apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school_timetable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: school-timetable-apk
          path: school_timetable/app/build/outputs/apk/release/*.apk
