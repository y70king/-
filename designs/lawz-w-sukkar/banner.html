<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url(fonts/lalezar.ttf)}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo700.ttf)}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo900.ttf)}
@font-face{font-family:Lemonada;font-weight:700;src:url(fonts/lemonada.ttf)}
@page{size:90cm 15cm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1800px;height:300px;overflow:hidden;background:#7a0012}
:root{--red:#d1001f;--deep:#5c000e;--ink:#3b0009;--yel:#ffc400;--org:#ff6a00;--cream:#fff6e5}

.banner{position:relative;width:1800px;height:300px;display:flex;align-items:stretch;
  background:
   radial-gradient(ellipse 380px 240px at 38% 55%, rgba(255,110,0,.45), transparent 70%),
   radial-gradient(ellipse 300px 240px at 73% 55%, rgba(255,110,0,.40), transparent 70%),
   linear-gradient(100deg,#8e0016 0%,#c4001d 45%,#9a0018 100%);
  overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.09) 1.3px,transparent 1.6px);background-size:14px 14px}
/* sun rays behind food clusters */
.rays{position:absolute;z-index:1;width:520px;height:520px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,210,0,.16) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%)}
.edge{position:absolute;left:0;right:0;height:10px;z-index:6;
  background:repeating-linear-gradient(90deg,var(--yel) 0 20px,var(--deep) 20px 40px)}
.edge.t{top:0}.edge.b{bottom:0}

/* sticker look for every illustration */
.st{position:absolute;z-index:4;
  filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
         drop-shadow(0 9px 8px rgba(40,0,5,.45))}

/* ---------- BRAND ---------- */
.brand{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px 0 0}
.emblem{width:130px;height:130px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.names{display:flex;flex-direction:column;align-items:center;line-height:1}
.tag{font:900 25px Cairo;color:var(--deep);background:var(--yel);padding:0 24px 4px;border-radius:40px;
  transform:rotate(-3deg);box-shadow:0 4px 0 var(--deep)}
.logo{font:90px/1.15 Lalezar;white-space:nowrap;
  background:linear-gradient(180deg,#fff3a6 0%,#ffd000 45%,#ff9500 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 5px 0 var(--deep)) drop-shadow(0 0 1px var(--deep))}
.logo .and{font-size:62px}
.sub{font:700 20px Lemonada;color:#fff;margin-top:-4px;text-shadow:2px 2px 0 var(--deep)}

.clusterA{position:relative;flex:none;width:205px}
.clusterB{position:relative;flex:none;width:235px;margin-left:-75px}

/* ---------- MENU ---------- */
.menu{position:relative;z-index:3;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head span{font:34px/1 Lalezar;white-space:nowrap;color:#fff;text-shadow:3px 3px 0 var(--deep)}
.head i{display:block;width:60px;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--yel))}
.head i:last-child{background:linear-gradient(270deg,transparent,var(--yel))}
.grid{display:flex;flex-wrap:wrap;gap:10px 8px;justify-content:center;max-width:520px}
.chip{font:30px/1 Lalezar;padding:9px 15px 11px;border-radius:13px;text-align:center;white-space:nowrap;
  background:var(--cream);color:var(--red);box-shadow:0 4px 0 var(--deep),0 7px 12px rgba(0,0,0,.25);position:relative}
.chip:nth-child(odd){background:var(--yel);color:var(--deep)}
.chip::after{content:"";position:absolute;top:6px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--org)}


/* ---------- CONTACT ---------- */
.contact{position:relative;z-index:2;width:425px;flex:none;display:flex;align-items:center;justify-content:center;
  padding:0 70px 0 24px;
  background:linear-gradient(160deg,#ffd31a,#ffb000 60%,#ff8a00);
  clip-path:polygon(0 0,100% 0,calc(100% - 70px) 100%,0 100%)}
.contact::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(-55deg,rgba(255,255,255,.14) 0 14px,transparent 14px 34px)}
.cinner{position:relative;display:flex;flex-direction:column;align-items:center}
.scooter{width:140px;height:90px;margin-bottom:-4px}
.deliv{font:44px/1.1 Lalezar;color:var(--red);text-shadow:2px 2px 0 #fff}
.phone{margin-top:8px;display:flex;align-items:center;gap:10px;direction:ltr;
  background:var(--deep);color:#fff;border-radius:60px;padding:6px 22px 9px 8px;box-shadow:0 6px 0 #2b0006}
.phone .ic{width:46px;height:46px;border-radius:50%;background:var(--red);display:grid;place-items:center;border:3px solid var(--yel)}
.phone b{font:900 38px/1 Cairo;letter-spacing:1px}

/* starburst */
.burst{position:absolute;z-index:5;width:118px;height:118px;display:grid;place-items:center;transform:rotate(-12deg)}
.burst svg{position:absolute;inset:0;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))}
.burst span{position:relative;font:26px/1 Lalezar;color:#fff;text-align:center;text-shadow:2px 2px 0 var(--deep)}
</style>
</head>
