plugins { id 'com.android.application' }

android {
    namespace 'com.examseating.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.examseating.app'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
