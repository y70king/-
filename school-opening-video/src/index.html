<script type="module">

// ---------------------------------------------------------------- timeline
const TL = JSON.parse(new URLSearchParams(location.search).get('tl') || 'null') || {
  T2: 12.3, T3: 23.2, T4: 35.2, T5: 47.6, T6: 64.0,

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// ---------------------------------------------------------------- textures & materials

const glowTex = radialTex([[0, 'rgba(255,250,235,1)'], [0.12, 'rgba(255,220,150,.85)'], [0.35, 'rgba(230,160,60,.35)'], [0.7, 'rgba(120,70,10,.08)'], [1, 'rgba(0,0,0,0)']]);

})();

const GOLD = 0xd9a441;
const M = {

}

// group fading: multiply every material's opacity by w
function prepFade(group) {

    if (!o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => { if (m.userData.base0 === undefined) { m.userData.base0 = m.opacity; m.transparent = true; } });
  });
}

    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => { m.opacity = (m.userData.base0 ?? 1) * (m.userData.k ?? 1) * w; m.depthWrite = w > 0.98 && !m.userData.noDepth; });

// ---------------------------------------------------------------- global dust (wraps around camera)
const dust = (() => {
  const N = 3500, r = rng(7), pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = (r() - .5) * 70; pos[i * 3 + 1] = (r() - .5) * 40; pos[i * 3 + 2] = (r() - .5) * 70; seed[i] = r(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uT: { value: 0 }, uCam: { value: new THREE.Vector3() }, uOp: { value: 1 }, uTex: { value: dotTex } },
    vertexShader: `uniform float uT; uniform vec3 uCam; attribute float seed; varying float vA; varying float vS;
      void main(){ vec3 box=vec3(70.,40.,70.); vec3 p=position+vec3(sin(uT*.2+seed*40.)*1.5, uT*.25*(seed-.3), cos(uT*.17+seed*30.)*1.5);

        float d=-mv.z; vA=smoothstep(60.,20.,d)*smoothstep(.5,3.,d)*(.45+.55*sin(uT*2.3+seed*90.)); vS=seed;
        gl_PointSize=(0.8+seed*seed*seed*4.5)*(160./d); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform sampler2D uTex; uniform float uOp; varying float vA; varying float vS;
      void main(){ vec4 c=texture2D(uTex,gl_PointCoord); vec3 col=mix(vec3(1.,.72,.3),vec3(1.,.92,.7),vS); gl_FragColor=vec4(col*.9,c.a*vA*uOp*.75); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const p = new THREE.Points(g, mat); p.frustumCulled = false; scene.add(p); return p;
})();

// converge particle cloud (positions computed on CPU per frame)
function makeSwarm(N, seedN, color = 0xffd98a, size = 0.12) {
  const r = rng(seedN), a = new Float32Array(N * 3), b = new Float32Array(N * 3), cur = new Float32Array(N * 3), d = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, rad = 8 + r() * 14, s = Math.sqrt(1 - u * u);
    a[i * 3] = s * Math.cos(th) * rad; a[i * 3 + 1] = u * rad * .6; a[i * 3 + 2] = s * Math.sin(th) * rad;
    d[i] = r();
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(cur, 3));
  const m = new THREE.PointsMaterial({ map: dotTex, color: new THREE.Color(color).multiplyScalar(1.8), size, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });

  pts.userData.update = (k, t, swirl = 1) => {
    for (let i = 0; i < N; i++) {
      const kk = easeInOut(clamp((k - d[i] * .35) / .65));
      const ang = swirl * (1 - kk) * (1.5 + d[i]) + t * .05 * swirl;
      const ax = a[i * 3], az = a[i * 3 + 2];
      const rx = ax * Math.cos(ang) - az * Math.sin(ang), rz = ax * Math.sin(ang) + az * Math.cos(ang);
      cur[i * 3] = lerp(rx, b[i * 3], kk); cur[i * 3 + 1] = lerp(a[i * 3 + 1], b[i * 3 + 1], kk); cur[i * 3 + 2] = lerp(rz, b[i * 3 + 2], kk);
    }

}

// tube "light thread" that can be drawn progressively
function thread(curve, radius, color, k = 2.4, seg = 260) {

  const m = M.goldGlow(color, k); m.blending = THREE.AdditiveBlending;
  const mesh = new THREE.Mesh(geo, m); mesh.userData = { seg, curve, per: 5 * 6 };
  mesh.userData.draw = (from, to) => { const s = Math.floor(clamp(from) * seg), e = Math.floor(clamp(to) * seg); geo.setDrawRange(s * 30, Math.max(0, e - s) * 30); };
  return mesh;
}
function edgeTubes(geometry, radius, mat) {

  for (let i = 0; i < p.count; i += 2) {
    const A = V(p.getX(i), p.getY(i), p.getZ(i)), B = V(p.getX(i + 1), p.getY(i + 1), p.getZ(i + 1));
    const len = A.distanceTo(B); const c = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 6, 1, true), mat);
    c.position.copy(A).add(B).multiplyScalar(.5); c.quaternion.setFromUnitVectors(V(0, 1, 0), B.clone().sub(A).normalize());

function ring(r, tube, mat, radial = 128, tubular = 8) { return new THREE.Mesh(new THREE.TorusGeometry(r, tube, tubular, radial), mat); }

// ================================================================= SCENE 1 : threads of light
const R1 = V(0, 0, 0);
const S1 = new THREE.Group(); S1.position.copy(R1); scene.add(S1);
const threads1 = [];
{
  const r = rng(11);
  for (let i = 0; i < 16; i++) {
    const pts = []; const a0 = r() * Math.PI * 2, tilt = (r() - .5) * 1.6, dir = r() < .5 ? 1 : -1;
    for (let j = 0; j <= 7; j++) {
      const k = j / 7, rad = lerp(16 + r() * 6, 1.6, Math.pow(k, .8)), a = a0 + dir * k * 3.4;

}
const geo1 = new THREE.Group(); S1.add(geo1);
const icoEdges = edgeTubes(new THREE.IcosahedronGeometry(2.4, 0), 0.025, M.goldGlow(0xffcf70, 2.0)); geo1.add(icoEdges);
const octEdges = edgeTubes(new THREE.OctahedronGeometry(3.6, 0), 0.02, M.goldGlow(0xffb84a, 1.6)); geo1.add(octEdges);
const rings1 = [3.0, 4.4, 5.6].map((rr, i) => { const m = ring(rr, 0.018, M.goldGlow(0xffd27a, 1.8), 160); m.rotation.set(i * 1.1 + .4, i * .7, 0); geo1.add(m); return m; });

const core1 = sprite(glowTex, 0xffe2a8, 1); core1.material.opacity = .6; S1.add(core1);
const swarm1 = makeSwarm(1400, 21, 0xffd98a, 0.05); S1.add(swarm1);
swarm1.userData.set((i, d) => { const u = (i * 0.618034) % 1, th = i * 2.39996; const rr = 2.4 + d * .25; const y = 1 - 2 * u, s = Math.sqrt(1 - y * y); return V(Math.cos(th) * s * rr, y * rr, Math.sin(th) * s * rr); });
prepFade(S1);

function cam1(t) {
  const k = t / TL.T2;
  const ang = lerp(-0.5, 0.35, easeInOut(k)), rad = lerp(22, 9.5, easeInOut(k)) - ss(TL.T2 - 1.4, TL.T2, t) * 6;
  return { pos: V(Math.sin(ang) * rad, lerp(3.5, 1.2, k), Math.cos(ang) * rad), look: V(0, 0, 0), fov: 42 };
}
function upd1(t) {

    th.userData.draw(tail, p);

  });

  octEdges.children.forEach((c, i) => { const kk = ss(6.0 + i * .12, 7.2 + i * .12, t); c.scale.set(1, Math.max(kk, 1e-3), 1); });
  icoEdges.rotation.set(t * .21, t * .3, 0); octEdges.rotation.set(-t * .12, t * .18, t * .07);
  rings1.forEach((m, i) => { m.scale.setScalar(Math.max(ss(5.5 + i * .5, 7.5 + i * .5, t), 1e-3)); m.rotation.z = t * (.25 + i * .1) * (i % 2 ? -1 : 1); m.rotation.y += 0; });

}

// ================================================================= SCENE 2 : knowledge
const R2 = V(0, 0, -220);
const S2 = new THREE.Group(); S2.position.copy(R2); scene.add(S2);
function makeBook(cover = 0x0c1d44, open = false) {
  const g = new THREE.Group(); const cm = new THREE.MeshStandardMaterial({ color: cover, metalness: .55, roughness: .3 });
  if (!open) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(1.6, .24, 1.15), cm); g.add(c);
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.5, .2, 1.07), M.pages()); p.position.x = .06; g.add(p);
    const sp = new THREE.Mesh(new THREE.BoxGeometry(.08, .26, 1.17), M.gold()); sp.position.x = -.8; g.add(sp);
    [-.35, .35].forEach(z => { const b = new THREE.Mesh(new THREE.BoxGeometry(1.55, .245, .03), M.gold()); b.position.set(.02, 0, z); g.add(b); });
    const em = ring(.18, .02, M.gold(), 32, 6); em.rotation.x = Math.PI / 2; em.position.set(.15, .125, 0); g.add(em);

      const half = new THREE.Group();
      const c = new THREE.Mesh(new THREE.BoxGeometry(1.2, .04, 1.5), cm); c.position.x = s * .6; half.add(c);
      const p = new THREE.Mesh(new THREE.BoxGeometry(1.12, .12, 1.42), M.pages()); p.position.set(s * .58, .08, 0); half.add(p);
      for (let l = 0; l < 5; l++) { const ln = new THREE.Mesh(new THREE.BoxGeometry(.8, .005, .02), M.goldGlow(0xffc76a, 1.2)); ln.position.set(s * .6, .145, -.45 + l * .22); half.add(ln); }
      half.rotation.z = s * -.22; g.add(half);
    });
  }
  return g;
}
function makePen() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, 1.4, 24), M.gold()); g.add(b);

  const cl = (1 - easeOut(rv)) * 50;
  st($('name'), { opacity: nameOn ? 1 : 0, top: y + 'px', transform: `scale(${sc})`, clipPath: `inset(-40% ${cl}% -60% ${cl}%)`, filter: `drop-shadow(0 0 ${18 + 30 * Math.exp(-Math.max(0, t - TL.V4 - 3) * 1.5) + (t > TL.HIT ? 40 * Math.exp(-(t - TL.HIT) * 1.2) : 0)}px rgba(255,190,80,.55))` });
  // shine sweeps right -> left (reading direction) — background-position 150% is right side for this gradient
  let sp = -1;
  const sweeps = [[TL.V4 + 3.4, 1.8], [TL.V5 + 7.6, 1.8], [TL.T6 + 1.4, 2.4], [TL.HIT - .3, 1.6], [TL.END - 2.6, 2.2]];
  sweeps.forEach(([s0, d]) => { if (t >= s0 && t <= s0 + d) sp = (t - s0) / d; });
  $('name').querySelector('.shine').style.backgroundPosition = sp < 0 ? '-200% 0' : `${lerp(-50, 150, 1 - easeInOut(sp))}% 0`;
  $('name').querySelector('.depth').style.opacity = .6 + .4 * fin;

  // words (S5)
  const wIn = [TL.V5 + 1.0, TL.V5 + 4.4, TL.V5 + 8.4];
  const merge = ss(TL.V5 + 11.3, TL.V5 + 12.8, t);
  const out = 1 - ss(TL.T6 - .4, TL.T6 + .8, t);
  ['w1', 'w2', 'w3'].forEach((id, i) => {
    const k = ss(wIn[i], wIn[i] + 1.1, t);
    const glow = Math.exp(-Math.max(0, t - wIn[i] - .6) * 1.4) * (t > wIn[i] ? 1 : 0) + merge * .6;
    st($(id), {
      opacity: k * out, margin: `0 ${lerp(70, 28, merge)}px`,
      transform: `translateY(${(1 - easeOut(k)) * 40}px) scale(${lerp(1.5, 1, easeOut(k))})`, filter: `blur(${(1 - k) * 18}px)`,
      color: '#ffe7b0', textShadow: `0 0 ${16 + glow * 40}px rgba(255,190,80,${.5 + glow * .5}), 0 0 4px rgba(255,240,200,.9), 0 4px 10px rgba(0,0,0,.9)`,
    });
  });
  ['s1', 's2'].forEach((id, i) => st($(id), { opacity: ss(wIn[i + 1] - .3, wIn[i + 1] + .4, t) * out, transform: `rotate(45deg) scale(${.4 + .6 * ss(wIn[i + 1] - .3, wIn[i + 1] + .4, t)})` }));
  st($('wline'), { transform: `scaleX(${merge * out})`, opacity: merge * out });

  // tagline (S6)
  const pIn = [TL.V6 + 3.45, TL.V6 + 5.1, TL.V6 + 6.45];
  ['p1', 'p2', 'p3'].forEach((id, i) => { const k = ss(pIn[i], pIn[i] + .9, t); st($(id), { opacity: k * (1 - ss(TL.HIT + .8, TL.END - 1, t) * .25), transform: `translateY(${(1 - easeOut(k)) * 22}px)`, filter: `blur(${(1 - k) * 10}px)` }); });

  // flashes at scene cuts and hits
  const fl = [[TL.T2, .55, 1.0], [TL.T3, .55, 1.0], [TL.T4, .55, 1.0], [TL.V4 + 2.95, .12, .75], [TL.HIT, .05, .6], [2.3, .05, .35]];
  let f = 0; fl.forEach(([c, a, m]) => { if (t > c - a && t < c + 1.4) f = Math.max(f, t < c ? ss(c - a, c, t) * m : m * Math.exp(-(t - c) * 3.2)); });
  $('flash').style.opacity = f;
  $('fade').style.opacity = 1 - ss(0, 1.2, t);
}

// ================================================================= frame
function blendCam(a, b, k) { return { pos: a.pos.clone().lerp(b.pos, k), look: a.look.clone().lerp(b.look, k), fov: lerp(a.fov, b.fov, k) }; }
function renderFrame(t) {
  // scene visibility (hard cuts are hidden under the flash)
  setFade(S1, t < TL.T2 ? 1 : 0);
  setFade(S2, t >= TL.T2 && t < TL.T3 ? 1 : 0);
  setFade(S3, t >= TL.T3 && t < TL.T4 ? 1 : 0);
  setFade(S4, t >= TL.T4 ? 1 : 0);
  if (t >= TL.T4) {
    gates4.forEach(g => setFade(g, 1 - ss(TL.V4 + 1.4, TL.V4 + 2.6, t)));
    setFade(orbit5, ss(TL.T5 - .5, TL.T5 + 2, t) * (1 - ss(TL.T6 + .5, TL.T6 + 3, t)));
    setFade(fin, ss(TL.T6 - .5, TL.T6 + 2.5, t) * (1 - ss(TL.HIT + .6, TL.END - .6, t) * .55));
    setFade(swarm4, 1); swarm4.material.opacity *= 1;
  }
  let c;
  if (t < TL.T2) { c = cam1(t); upd1(t); }
  else if (t < TL.T3) { c = cam2(t); upd2(t); }
  else if (t < TL.T4) { c = cam3(t); upd3(t); }
  else {
    upd4(t);
    const t45 = TL.V4 + 2.4;
    if (t < t45) c = cam4(t);
    else if (t < TL.T6) c = blendCam(cam4(t45), cam5(t), ss(t45, t45 + 1.5, t));
    else c = blendCam(cam5(TL.T6), cam6(t), ss(TL.T6, TL.T6 + 1, t));
  }
  // re-apply fades now that k values were updated
  [S1, S2, S3].forEach((g, i) => { if (g.visible) setFade(g, 1); });
  if (t >= TL.T4) {
    setFade(S4, 1);
    gates4.forEach(g => setFade(g, 1 - ss(TL.V4 + 1.4, TL.V4 + 2.6, t)));
    setFade(orbit5, ss(TL.T5 - .5, TL.T5 + 2, t) * (1 - ss(TL.T6 + .5, TL.T6 + 3, t)));
    setFade(fin, ss(TL.T6 - .5, TL.T6 + 2.5, t) * (1 - ss(TL.HIT + .6, TL.END - .6, t) * .55));
  }
  camera.position.copy(c.pos); camera.lookAt(c.look); camera.fov = c.fov; camera.updateProjectionMatrix();
  dust.material.uniforms.uT.value = t; dust.material.uniforms.uCam.value.copy(camera.position);
  dust.material.uniforms.uOp.value = (t < TL.T4 ? 1 : .8) * (1 - ss(TL.HIT + .5, TL.END, t) * .6) * ss(.2, 2.5, t);
  // bloom per beat
  const hit = t > TL.HIT ? Math.exp(-(t - TL.HIT) * 1.6) : 0;
  const cut = [TL.T2, TL.T3, TL.T4].reduce((m, c0) => Math.max(m, Math.exp(-Math.abs(t - c0) * 3)), 0);
  bloom.strength = .55 + cut * .9 + hit * .7 + (t >= TL.T3 && t < TL.T4 ? -.2 : 0);
  renderer.toneMappingExposure = .9 + cut * .3 - ss(TL.HIT + .5, TL.END, t) * .15;
  updText(t);
  composer.render();
}
window.renderFrame = renderFrame;
window.TL = TL;
await document.fonts.load('700 100px Amiri'); await document.fonts.load('700 100px Ruqaa'); await document.fonts.load('700 100px Kufi');
await document.fonts.ready;
renderFrame(0);
window.READY = true;
</script>
