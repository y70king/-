<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url(fonts/lalezar.ttf)}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo900.ttf)}
@page{size:90cm 15cm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1800px;height:300px;overflow:hidden;background:#07080b}
.banner{position:relative;width:1800px;height:300px;overflow:hidden;
  background:radial-gradient(ellipse 260px 200px at 12% 35%,#25262b,transparent 70%),
             radial-gradient(ellipse 260px 200px at 88% 35%,#25262b,transparent 70%),#07080b}
.tex{position:absolute;inset:0;opacity:.5;mix-blend-mode:screen}
.deco{position:absolute;inset:0}
.ph{position:absolute;display:block;--l:0%;--r:0%;--t:0%;--b:0%;
  -webkit-mask:linear-gradient(90deg,transparent,#000 var(--l),#000 calc(100% - var(--r)),transparent),linear-gradient(180deg,transparent,#000 var(--t),#000 calc(100% - var(--b)),transparent);
  -webkit-mask-composite:source-in}
.ref{position:absolute;left:450px;top:0;height:300px;width:900px;z-index:3;
  -webkit-mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}

.block{position:absolute;z-index:4;top:30px;width:400px;display:flex;flex-direction:column;align-items:center;gap:10px}
.deliv{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#ffe600,#ffc800);border-radius:30px;
  padding:4px 22px 7px 16px;box-shadow:0 4px 0 #8a6a00,0 8px 12px rgba(0,0,0,.6)}
.deliv span{font:32px/1 Lalezar;color:#111}
.deliv svg{width:58px;height:40px}
.phone{display:flex;align-items:center;gap:10px;direction:ltr;background:linear-gradient(180deg,#ff1f1f,#c80010);
  border:3px solid #fff;border-radius:40px;padding:4px 24px 6px 6px;box-shadow:0 0 0 3px #ffd400,0 8px 12px rgba(0,0,0,.6)}
.phone .ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center}
.phone b{font:900 40px/1 Cairo;color:#fff;letter-spacing:1px}
</style>
</head>
<body>
<div class="banner">
  <svg class="tex" width="1800" height="300"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .55 0 0 0 1.1 -.55"/></filter><rect width="1800" height="300" filter="url(#n)"/></svg>

  <svg class="deco" viewBox="0 0 1800 300" preserveAspectRatio="none">
    <!-- left extension decor (same red / yellow slashes as the original) -->
    <path d="M0 0 H120 L0 95Z" fill="#c80010"/>
    <path d="M130 0 H150 L0 118 V102Z" fill="#ffd400"/>
    <!-- right extension decor -->
    <path d="M1800 0 H1680 L1800 95Z" fill="#c80010"/>
    <path d="M1670 0 H1650 L1800 118 V102Z" fill="#ffd400"/>
    <path d="M60 22 Q225 -8 390 22" stroke="#ffd400" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M1410 22 Q1575 -8 1740 22" stroke="#ffd400" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- bottom band continuing the original's yellow / red edge -->
    <path d="M0 238 Q225 248 470 244 V300 H0Z" fill="#ffd400"/>
    <path d="M0 250 Q225 260 470 254 V300 H0Z" fill="#f50000"/>
    <path d="M0 258 Q225 268 470 262 V300 H0Z" fill="#6b0101"/>
    <path d="M1800 238 Q1575 248 1330 240 V300 H1800Z" fill="#ffd400"/>
    <path d="M1800 250 Q1575 260 1330 250 V300 H1800Z" fill="#f50000"/>
    <path d="M1800 258 Q1575 268 1330 259 V300 H1800Z" fill="#6b0101"/>
  </svg>

  <!-- left extension food -->
  <img class="ph" src="img/pizza.jpg" style="--l:10%;--r:18%;--t:22%;--b:8%;left:6px;top:128px;height:122px;z-index:2">
  <img class="ph" src="img/chick2.jpg" style="--l:20%;--r:14%;--t:22%;--b:8%;left:208px;top:118px;height:134px;z-index:2">

  <!-- right extension food -->
  <img class="ph" src="img/manak.jpg" style="--l:14%;--r:12%;--t:20%;--b:14%;left:1360px;top:146px;height:100px;z-index:2">
  <img class="ph" src="img/hummus.jpg" style="--l:16%;--r:12%;--t:22%;--b:10%;left:1600px;top:140px;height:106px;z-index:2">

  <!-- the original design, untouched, in the centre -->
  <img class="ref" src="img/ref-full.jpg">

  <!-- phone repeated on both ends so it reads from any side of a 9 m sign -->
  <div class="block" style="left:20px">
    <div class="deliv"><span>للجلب والتوصيل</span>
      <svg viewBox="0 0 60 42"><g fill="#111"><rect x="2" y="6" width="16" height="14" rx="2"/><circle cx="34" cy="7" r="5"/><path d="M28 13 h10 l4 12 h8 l4 6 H24 l-4 -8 h10z"/><circle cx="16" cy="34" r="7"/><circle cx="48" cy="34" r="7"/></g><g fill="#ffd400"><circle cx="16" cy="34" r="3"/><circle cx="48" cy="34" r="3"/></g></svg></div>
    <div class="phone"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="#e3061b" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div><b>07849690565</b></div>
  </div>
  <div class="block" style="left:1380px">
    <div class="deliv"><span>للجلب والتوصيل</span>
      <svg viewBox="0 0 60 42"><g fill="#111"><rect x="2" y="6" width="16" height="14" rx="2"/><circle cx="34" cy="7" r="5"/><path d="M28 13 h10 l4 12 h8 l4 6 H24 l-4 -8 h10z"/><circle cx="16" cy="34" r="7"/><circle cx="48" cy="34" r="7"/></g><g fill="#ffd400"><circle cx="16" cy="34" r="3"/><circle cx="48" cy="34" r="3"/></g></svg></div>
    <div class="phone"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="#e3061b" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div><b>07849690565</b></div>
  </div>
</div>
</body>
</html>
