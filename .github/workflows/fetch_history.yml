name: Fetch Gold History

# ينزل تاريخ الذهب القديم (10 سنين) من Dukascopy على دفعات ويحفظه بالريبو.
# إذا ما خلص بمرة وحدة، شغّله مرة ثانية ويكمل من وين وقف.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "أقصى مدة للتنزيل بالدقائق"
        default: "320"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: fetch-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download gold history
        run: python -m evolution.data XAUUSD --max-minutes "${{ github.event.inputs.minutes }}"

      - name: Save data to repo
        if: always()
        run: |
          git config user.name "history-fetcher"
          git config user.email "actions@github.com"
          git add evolution/data/XAUUSD_5m_dukascopy.csv.gz
          if git diff --cached --quiet; then echo "لا يوجد تغيير"; exit 0; fi
          git commit -m "data: gold history [skip ci]"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep 5; done
