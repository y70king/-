<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>مطبعة ألوان — إعلان موشن جرافيك</title>
<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000;}
@font-face{font-family:Reem;src:url(fonts/ReemKufi.ttf);font-weight:400 700;}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =====================================================================
//  «مطبعة ألوان» — deterministic motion-graphics engine.
//  render(t) draws the frame at time t (seconds). Logical canvas 1080x1920,
//  rendered at S× (S=2 → 2160x3840 / 4K UHD vertical).
// =====================================================================
const W = 1080, H = 1920;
const S = +(new URLSearchParams(location.search).get('s') || 2);
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
cv.style.width = (W * S) + 'px'; cv.style.height = (H * S) + 'px';
const ctx = cv.getContext('2d');
const DURATION = 38.0;

// ---------- palette ----------
const C = '#00AEEF', M = '#EC008C', Y = '#FFE11A', K = '#1a1c24';
const VIO = '#6C4DFF', NAVY = '#060814', INK = '#0b0e1c', PAPER = '#f5f4f0';
const CMYK = [C, M, Y, K];

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo3 = t => 1 - Math.pow(1 - t, 3);
const ei3 = t => t * t * t;
const eo5 = t => 1 - Math.pow(1 - t, 5);
const eoE = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eiE = t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
const eioE = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const eoB = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const eoEl = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1;
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hx(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgba(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixc(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// CA = colour amount for products (0 = grey mock-up, 1 = full colour)
let CA = 1;
function col(h, a = 1) {
  const c = hx(h); const l = .3 * c[0] + .59 * c[1] + .11 * c[2];
  const g = 62 + l * .44;
  return `rgba(${lerp(g, c[0], CA) | 0},${lerp(g, c[1], CA) | 0},${lerp(g, c[2], CA) | 0},${a})`;
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(x, y, r, c, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  const cc = typeof c === 'string' ? hx(c) : c;
  g.addColorStop(0, rgba(cc, a)); g.addColorStop(.4, rgba(cc, a * .35)); g.addColorStop(1, rgba(cc, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function softShadow(x, y, rx, ry, a = .45) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore();
}
function font(size, weight = 800, fam = 'Cairo') { return `${weight} ${size}px ${fam}`; }
function txt(s, x, y, size, weight, fill, align = 'center', fam = 'Cairo') {
  ctx.font = font(size, weight, fam); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.direction = 'rtl'; ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function bars(x, y, ws, gap, h, c) { ctx.fillStyle = c; ws.forEach((w, i) => { rr(x - w, y + i * gap, w, h, h / 2); ctx.fill(); }); }

// Ink-drop brand mark (four CMYK quadrants)
function dropPath(r) {
  ctx.beginPath();
  ctx.moveTo(0, -1.55 * r);
  ctx.bezierCurveTo(.48 * r, -.95 * r, r, -.42 * r, r, .15 * r);
  ctx.arc(0, .15 * r, r, 0, Math.PI, false);
  ctx.bezierCurveTo(-r, -.42 * r, -.48 * r, -.95 * r, 0, -1.55 * r);
  ctx.closePath();
}
function drawMark(r, rot = 0, opts = {}) {
  ctx.save();
  dropPath(r); ctx.save(); ctx.clip();
  const cg = ctx.createConicGradient(-Math.PI / 2 + rot, 0, .15 * r);
  const cs = [col(C), col(M), col(Y), col('#23252f')];
  for (let i = 0; i < 4; i++) { cg.addColorStop(i / 4, cs[i]); cg.addColorStop((i + 1) / 4 - .0001, cs[i]); }
  ctx.fillStyle = cg; ctx.fillRect(-2 * r, -2 * r, 4 * r, 4 * r);
  // separators
  ctx.strokeStyle = opts.sep || 'rgba(255,255,255,.95)'; ctx.lineWidth = r * .07;
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + rot + i * TAU / 4;
    ctx.beginPath(); ctx.moveTo(0, .15 * r); ctx.lineTo(Math.cos(a) * 3 * r, .15 * r + Math.sin(a) * 3 * r); ctx.stroke();
  }
  // gloss
  const gg = ctx.createLinearGradient(-r, -1.5 * r, r, r);
  gg.addColorStop(0, 'rgba(255,255,255,.45)'); gg.addColorStop(.45, 'rgba(255,255,255,0)');
  gg.addColorStop(1, 'rgba(0,0,0,.25)');
  ctx.fillStyle = gg; ctx.fillRect(-2 * r, -2 * r, 4 * r, 4 * r);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(-.42 * r, -.25 * r, .13 * r, .3 * r, .5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

// ---------- products (drawn centred at origin) ----------
const OUT = {}; // outline paths for clipping (sheen / rim light)
OUT.logo = () => rr(-80, -80, 160, 160, 34);
function pLogo() {
  softShadow(0, 95, 95, 18);
  OUT.logo(); const g = ctx.createLinearGradient(0, -80, 0, 80);
  g.addColorStop(0, col('#ffffff')); g.addColorStop(1, col('#e4e6ee')); ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.translate(0, 10); drawMark(36); ctx.restore();
}
OUT.card = () => rr(-125, -75, 250, 150, 14);
function pCard() {
  softShadow(0, 92, 135, 16);
  ctx.save(); OUT.card(); ctx.clip();
  const g = ctx.createLinearGradient(-125, -75, 125, 75); g.addColorStop(0, col('#1d2130')); g.addColorStop(1, col('#0c0e16'));
  ctx.fillStyle = g; ctx.fillRect(-130, -80, 260, 160);
  const s = ctx.createLinearGradient(-125, 0, 125, 0); s.addColorStop(0, col(C)); s.addColorStop(.5, col(M)); s.addColorStop(1, col(Y));
  ctx.fillStyle = s; ctx.fillRect(-130, 58, 260, 20);
  ctx.save(); ctx.translate(78, -14); drawMark(24); ctx.restore();
  bars(28, -38, [120, 84, 58], 24, 10, col('#ffffff', .9));
  ctx.fillStyle = col(C, .9); rr(-100, 22, 46, 6, 3); ctx.fill();
  ctx.restore();
}
OUT.brochure = (o = 1) => { ctx.beginPath(); ctx.rect(-48 - 96 * o, -110, 96 + 192 * o, 220); };
function pBrochure(o = 1) {
  const pw = 96, ph = 220, k = -.13 * o;
  softShadow(0, 128, 60 + 110 * o, 18);
  // left panel
  ctx.save(); ctx.transform(o, -k, 0, 1, -pw / 2 - pw * o, k * pw);
  if (o > .02) {
    ctx.fillStyle = col(C); ctx.fillRect(0, -ph / 2, pw, ph);
    ctx.fillStyle = col('#ffffff', .9); ctx.beginPath(); ctx.arc(pw / 2, -30, 26, 0, TAU); ctx.fill();
    bars(pw - 14, 30, [64, 50, 58, 40], 18, 7, col('#ffffff', .85));
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, -ph / 2, pw, ph);
  }
  ctx.restore();
  // right panel
  ctx.save(); ctx.transform(o, k, 0, 1, pw / 2, 0);
  if (o > .02) {
    ctx.fillStyle = col(PAPER); ctx.fillRect(0, -ph / 2, pw, ph);
    ctx.fillStyle = col(Y); ctx.fillRect(0, -ph / 2, pw, 80);
    ctx.fillStyle = col(M); ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(pw, -60); ctx.lineTo(pw, -30); ctx.fill();
    bars(pw - 14, 0, [66, 50, 62, 44, 56], 16, 6, col('#2a2d38', .8));
    ctx.fillStyle = 'rgba(0,0,0,.1)'; ctx.fillRect(0, -ph / 2, pw, ph);
  }
  ctx.restore();
  // centre panel
  ctx.fillStyle = col(PAPER); ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
  ctx.save(); ctx.beginPath(); ctx.rect(-pw / 2, -ph / 2, pw, ph); ctx.clip();
  ctx.fillStyle = col(M); ctx.beginPath(); ctx.arc(0, -60, 70, 0, TAU); ctx.fill();
  ctx.fillStyle = col(C, .85); ctx.beginPath(); ctx.arc(30, -20, 40, 0, TAU); ctx.fill();
  ctx.restore();
  bars(36, 40, [72, 56, 64, 40], 16, 7, col('#2a2d38', .85));
  ctx.save(); ctx.translate(0, 98); ctx.scale(.35, .35); drawMark(24); ctx.restore();
}
OUT.sticker = () => { ctx.beginPath(); ctx.arc(0, 0, 88, 0, TAU); };
function pSticker() {
  softShadow(0, 100, 85, 14);
  OUT.sticker(); ctx.fillStyle = col('#ffffff'); ctx.fill();
  const g = ctx.createLinearGradient(-70, -70, 70, 70); g.addColorStop(0, col(Y)); g.addColorStop(1, col(M));
  ctx.beginPath(); ctx.arc(0, 0, 77, 0, TAU); ctx.fillStyle = g; ctx.fill();
  // spark
  ctx.fillStyle = col('#ffffff'); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8 - Math.PI / 2, rad = i % 2 ? 18 : 46; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col('#ffffff', .6); ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(0, 0, 64, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  // peeled corner
  ctx.fillStyle = col('#dfe2ea'); ctx.beginPath(); ctx.moveTo(52, 68); ctx.quadraticCurveTo(70, 50, 68, 52); ctx.lineTo(80, 36); ctx.quadraticCurveTo(58, 46, 52, 68); ctx.fill();
}
OUT.bag = () => { ctx.beginPath(); ctx.rect(-92, -100, 184, 215); };
function pBag(open = 0) {
  softShadow(8, 128, 120, 16);
  // handles
  ctx.lineCap = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = col('#2a2d38');
  const hs = 1 + open * .25;
  ctx.beginPath(); ctx.moveTo(-42 * hs, -96); ctx.bezierCurveTo(-42 * hs, -175, 42 * hs, -175, 42 * hs, -96); ctx.stroke();
  // gusset
  ctx.fillStyle = col('#8c0054'); ctx.beginPath(); ctx.moveTo(92, -100); ctx.lineTo(122, -88); ctx.lineTo(122, 125); ctx.lineTo(92, 115); ctx.fill();
  if (open > 0) { // dark opening
    ctx.fillStyle = 'rgba(10,8,16,.95)'; ctx.beginPath(); ctx.ellipse(10, -100, 102, 18 * open, 0, 0, TAU); ctx.fill();
  }
  const g = ctx.createLinearGradient(-92, 0, 92, 0); g.addColorStop(0, col('#ff2aa6')); g.addColorStop(1, col(M));
  OUT.bag(); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(-92, -100, 184, 20);
  ctx.fillStyle = col('#ffffff'); ctx.beginPath(); ctx.arc(0, 12, 44, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(0, 18); drawMark(20); ctx.restore();
  bars(40, 76, [80], 0, 8, col('#ffffff', .85));
  ctx.lineWidth = 7; ctx.strokeStyle = col('#2a2d38');
  ctx.beginPath(); ctx.moveTo(-34 * hs, -98); ctx.bezierCurveTo(-34 * hs, -160, 50 * hs, -160, 50 * hs, -98); ctx.stroke();
}
OUT.notebook = () => rr(-88, -116, 176, 232, 10);
function pNotebook() {
  softShadow(0, 135, 100, 15);
  ctx.fillStyle = col('#e9e9ef'); rr(-80, -110, 176, 230, 10); ctx.fill();
  const g = ctx.createLinearGradient(-88, -116, 88, 116); g.addColorStop(0, col(C)); g.addColorStop(1, col(VIO));
  OUT.notebook(); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = col(K, .9); ctx.fillRect(56, -116, 12, 232);
  ctx.save(); ctx.translate(-10, -10); drawMark(30); ctx.restore();
  bars(30, 60, [80, 56], 18, 8, col('#ffffff', .85));
  // spiral rings
  ctx.strokeStyle = col('#c9ccd6'); ctx.lineWidth = 4;
  for (let i = 0; i < 9; i++) { const x = -68 + i * 17; rr(x - 4, -128, 8, 24, 4); ctx.stroke(); }
}
OUT.poster = () => { ctx.beginPath(); ctx.rect(-98, -138, 196, 276); };
function pPoster() {
  softShadow(0, 156, 115, 16);
  OUT.poster(); ctx.fillStyle = col(Y); ctx.fill();
  ctx.save(); OUT.poster(); ctx.clip();
  ctx.fillStyle = col(M); ctx.beginPath(); ctx.arc(-10, -50, 72, 0, TAU); ctx.fill();
  ctx.fillStyle = col(C, .92); ctx.beginPath(); ctx.moveTo(-98, 60); ctx.lineTo(60, -20); ctx.lineTo(98, 120); ctx.lineTo(-98, 140); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = col(K); ctx.fillRect(-98, 104, 196, 40);
  bars(80, 116, [110, 70], 12, 6, col('#ffffff', .9));
  ctx.restore();
  ctx.strokeStyle = col('#ffffff', .9); ctx.lineWidth = 6; ctx.strokeRect(-95, -135, 190, 270);
}
OUT.banner = () => { ctx.beginPath(); ctx.rect(-80, -190, 160, 340); };
function pBanner() {
  softShadow(0, 178, 110, 14);
  ctx.fillStyle = col('#3a3f4e'); rr(-92, 158, 184, 18, 6); ctx.fill();
  ctx.fillStyle = col('#596075'); ctx.fillRect(-3, -196, 6, 360);
  ctx.save(); OUT.banner(); ctx.clip();
  const g = ctx.createLinearGradient(0, -190, 0, 150); g.addColorStop(0, col('#151a2e')); g.addColorStop(1, col('#07080f'));
  ctx.fillStyle = g; ctx.fillRect(-80, -190, 160, 340);
  ctx.fillStyle = col(M); ctx.beginPath(); ctx.moveTo(-80, 30); ctx.lineTo(80, -60); ctx.lineTo(80, 10); ctx.lineTo(-80, 100); ctx.fill();
  ctx.fillStyle = col(C); ctx.beginPath(); ctx.moveTo(-80, 100); ctx.lineTo(80, 10); ctx.lineTo(80, 40); ctx.lineTo(-80, 130); ctx.fill();
  ctx.fillStyle = col(Y); ctx.beginPath(); ctx.arc(50, 120, 22, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(0, -110); drawMark(30); ctx.restore();
  bars(55, -40, [110, 76], 18, 9, col('#ffffff', .9));
  ctx.restore();
  ctx.fillStyle = col('#596075'); rr(-84, -196, 168, 10, 5); ctx.fill();
}
const PROD = { logo: pLogo, card: pCard, brochure: pBrochure, sticker: pSticker, bag: pBag, notebook: pNotebook, poster: pPoster, banner: pBanner };
const ITEMS = ['logo', 'card', 'brochure', 'poster', 'bag', 'notebook', 'sticker', 'banner'];

// draw a product with transform, colour amount, sheen
function product(type, x, y, s, rot = 0, ca = 1, o = {}) {
  if (s <= 0.001 || (o.alpha ?? 1) <= 0.001) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s * (o.sx ?? 1), s * (o.sy ?? 1));
  ctx.globalAlpha = o.alpha ?? 1; CA = ca;
  PROD[type](o.arg);
  if (o.sheen != null && o.sheen > 0 && o.sheen < 1) { // light sweep
    ctx.save(); OUT[type](o.arg); ctx.clip();
    const sx = lerp(-320, 320, o.sheen);
    const g = ctx.createLinearGradient(sx - 90, -200, sx + 90, 200);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(-300, -300, 600, 600); ctx.restore();
  }
  if (o.rim) { ctx.save(); OUT[type](o.arg); ctx.lineWidth = 3 / s; ctx.strokeStyle = `rgba(255,255,255,${o.rim})`; ctx.stroke(); ctx.restore(); }
  if (o.dim) { ctx.save(); OUT[type](o.arg); ctx.fillStyle = `rgba(6,8,20,${o.dim})`; ctx.fill(); ctx.restore(); }
  ctx.restore(); CA = 1;
}

// ---------- textures (built once) ----------
let grainCv, halftoneCv, wordCv, pieces = [], P1 = [], confetti = [], textPts = [], mapDots = [], sheetStages = [];
const AR = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
const SHAPES = ['circle', 'tri', 'square', 'ring', 'line', 'plus'];

function buildGrain() {
  grainCv = document.createElement('canvas'); grainCv.width = 540; grainCv.height = 960;
  const g = grainCv.getContext('2d'); const id = g.createImageData(540, 960); const r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
function buildHalftone() {
  halftoneCv = document.createElement('canvas'); halftoneCv.width = W * S; halftoneCv.height = H * S;
  const g = halftoneCv.getContext('2d'); g.scale(S, S);
  const step = 22; g.fillStyle = '#fff';
  for (let y = 0; y < H + step; y += step) for (let x = 0; x < W + step; x += step) {
    const ox = (Math.floor(y / step) % 2) * step / 2;
    const d = Math.hypot(x + ox - W * .5, y - H * .45) / 1100;
    const r = clamp(1 - d) * 4.2 + .6;
    g.beginPath(); g.arc(x + ox, y, r, 0, TAU); g.fill();
  }
}
// word «فكرة» → pieces
const WORD = { x: 540, y: 900, size: 250 };
function buildWord() {
  wordCv = document.createElement('canvas'); wordCv.width = W * S; wordCv.height = H * S;
  const g = wordCv.getContext('2d'); g.scale(S, S);
  g.font = font(WORD.size, 900); g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
  g.fillStyle = '#ffffff'; g.fillText('فكرة', WORD.x, WORD.y);
  const m = g.measureText('فكرة'); WORD.w = m.width;
  const x0 = WORD.x - m.width / 2 - 10, x1 = WORD.x + m.width / 2 + 10, y0 = WORD.y - 210, y1 = WORD.y + 190;
  WORD.box = [x0, y0, x1, y1];
  const cols = 20, rows = 12, cw = (x1 - x0) / cols, ch = (y1 - y0) / rows;
  const data = g.getImageData(0, 0, wordCv.width, wordCv.height).data;
  const r = rng(11);
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const px = x0 + i * cw, py = y0 + j * ch; let cnt = 0;
    for (let a = 0; a < 6; a++) for (let b = 0; b < 6; b++) {
      const sx = Math.floor((px + cw * (a + .5) / 6) * S), sy = Math.floor((py + ch * (b + .5) / 6) * S);
      if (data[(sy * wordCv.width + sx) * 4 + 3] > 40) cnt++;
    }
    if (cnt > 1) {
      const ang = Math.atan2(py + ch / 2 - WORD.y, px + cw / 2 - WORD.x) + (r() - .5) * .8;
      pieces.push({ x: px, y: py, w: cw, h: ch, delay: (x1 - px) / (x1 - x0) * .7 + r() * .25, ang, sp: 40 + r() * 70, vr: (r() - .5) * 1.6, z: .7 + r() * .8, ph: r() * TAU });
    }
  }
  // floating letters & geometric shapes born from the pieces
  for (let i = 0; i < 72; i++) {
    const pc = pieces[Math.floor(r() * pieces.length)];
    P1.push({
      x0: pc.x + pc.w / 2, y0: pc.y + pc.h / 2, delay: pc.delay + .25 + r() * .3,
      ang: Math.atan2(pc.y - WORD.y, pc.x - WORD.x) + (r() - .5) * 1.2, sp: 30 + r() * 80,
      kind: r() < .55 ? 'letter' : SHAPES[Math.floor(r() * SHAPES.length)], ch: AR[Math.floor(r() * AR.length)],
      size: 18 + r() * 30, rot: r() * TAU, vr: (r() - .5) * 1.2, d: .6 + r() * .9, ph: r() * TAU, item: i % 8,
      c: [C, M, Y, '#ffffff'][i % 4]
    });
  }
}
function drawShape(kind, size, ch) {
  const s = size / 2;
  ctx.beginPath();
  switch (kind) {
    case 'letter': ctx.font = font(size * 1.2, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, 0, 0); return;
    case 'circle': ctx.arc(0, 0, s * .7, 0, TAU); ctx.fill(); return;
    case 'tri': ctx.moveTo(0, -s); ctx.lineTo(s * .9, s * .6); ctx.lineTo(-s * .9, s * .6); ctx.closePath(); ctx.fill(); return;
    case 'square': ctx.rect(-s * .6, -s * .6, s * 1.2, s * 1.2); ctx.fill(); return;

    case 'line': ctx.rect(-s, -s * .1, s * 2, s * .2); ctx.fill(); return;

    }
  }
  // crisp text
  const ta = eo3(P(t, 26.2, 26.6));
  if (ta > 0) {
    const out = P(t, 26.95, 27.25);
    ctx.save(); ctx.globalAlpha = ta * (1 - out);
    const g = ctx.createLinearGradient(260, 0, 820, 0); g.addColorStop(0, Y); g.addColorStop(.5, M); g.addColorStop(1, C);
    glow(540, 900, 520, '#ffffff', .08);
    txt(DETAIL_LINES[0].s, 540, DETAIL_LINES[0].y, DETAIL_LINES[0].size, 900, g);
    txt(DETAIL_LINES[1].s, 540, DETAIL_LINES[1].y, DETAIL_LINES[1].size, 900, '#ffffff');

}

// =====================================================================
//  SCENE 6  27 – 31   stylised map of Iraq → Baiji → «عمارة وطبان»
// =====================================================================
function mapCam(t) {
  const z = lerp(1, 3.4, eioE(P(t, 28.15, 29.0)));
  const b = geo(BAIJI);
  const fx = lerp(540, b[0], eio(P(t, 28.1, 28.9))), fy = lerp(980, b[1], eio(P(t, 28.1, 28.9)));
  const zOut = 1 + 2 * eiE(P(t, 30.75, 31.25));
  return { z: z * zOut, fx, fy, tx: 540, ty: lerp(980, 1010, P(t, 28.1, 28.9)) };
}
function polyline(pts) { ctx.beginPath(); pts.forEach((p, i) => { const q = geo(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); }
function scene6(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#070a1c'); g.addColorStop(1, '#03040a');

  for (let la = 26; la <= 40; la++) { const a = geo([35, la]), b = geo([52, la]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  // halftone dots country fill
  const bp = geo(BAIJI);
  const appear = P(t, 26.95, 27.7);
  for (const d of mapDots) {
    const dist = Math.hypot(d.x - 540, d.y - 980);
    const k = clamp((appear * 900 - dist * .9 + 60) / 120); if (k <= 0) continue;

  polyline(TIGRIS); ctx.stroke(); polyline(EUPHR); ctx.stroke(); ctx.restore();
  // outline
  const ol = eio(P(t, 27.1, 28.0));
  ctx.save(); ctx.setLineDash([4200 * ol, 6000]); ctx.lineJoin = 'round';
  const og = ctx.createLinearGradient(100, 400, 1000, 1500); og.addColorStop(0, C); og.addColorStop(.35, M); og.addColorStop(.7, Y); og.addColorStop(1, C);
  ctx.strokeStyle = og; ctx.lineWidth = 4 / Math.sqrt(cam.z);
  ctx.beginPath(); IRAQ_XY.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); ctx.restore();
  // city blocks near Baiji (visible when zoomed)
  const cb = P(t, 28.6, 29.2);
  if (cb > 0) {
    const r = rng(91); ctx.save(); ctx.globalAlpha = cb * .5;
    for (let i = 0; i < 46; i++) { const a = r() * TAU, d = 14 + r() * 70, w = 4 + r() * 9, h = 4 + r() * 9; ctx.fillStyle = r() < .5 ? 'rgba(160,190,255,.5)' : 'rgba(255,255,255,.35)'; ctx.fillRect(bp[0] + Math.cos(a) * d * 1.1, bp[1] + Math.sin(a) * d * .8, w, h); }
    ctx.strokeStyle = 'rgba(200,220,255,.4)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(bp[0] - 120, bp[1] - 60 + i * 24 + i * 3); ctx.lineTo(bp[0] + 120, bp[1] - 80 + i * 26); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
  // Baiji point of light & labels (screen space)
  const sp = [(bp[0] - cam.fx) * cam.z + cam.tx, (bp[1] - cam.fy) * cam.z + cam.ty];
  const la = P(t, 27.6, 27.9) * (1 - P(t, 30.75, 31.0));
  if (la > 0) {
    ctx.save(); ctx.globalAlpha = la;
    ctx.globalCompositeOperation = 'screen'; glow(sp[0], sp[1], 160 + 30 * Math.sin(t * 8), '#ffffff', .6); ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 3; i++) { const rr2 = ((t - 27.6) * 120 + i * 50) % 150; ctx.strokeStyle = `rgba(255,255,255,${.6 * (1 - rr2 / 150)})`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(sp[0], sp[1], rr2, 0, TAU); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sp[0], sp[1], 7, 0, TAU); ctx.fill();
    ctx.restore();
    // governorate tag before the zoom

    if (ga > 0) {
      ctx.save(); ctx.globalAlpha = ga; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sp[0] - 10, sp[1] - 10); ctx.lineTo(sp[0] - 90, sp[1] - 90); ctx.lineTo(sp[0] - 170, sp[1] - 90); ctx.stroke();
      txt('صلاح الدين', sp[0] - 180, sp[1] - 120, 46, 800, '#ffffff', 'right'); ctx.restore();
    }
  }
  const bd = P(t, 28.7, 29.2) * (1 - P(t, 30.8, 31.05));
  if (bd > 0) { ctx.save(); ctx.globalAlpha = bd * .75; const bg2 = ctx.createLinearGradient(0, 380, 0, 1320); bg2.addColorStop(0, 'rgba(4,5,14,0)'); bg2.addColorStop(.2, 'rgba(4,5,14,.85)'); bg2.addColorStop(.4, 'rgba(4,5,14,.2)'); bg2.addColorStop(.7, 'rgba(4,5,14,.2)'); bg2.addColorStop(.8, 'rgba(4,5,14,.85)'); bg2.addColorStop(1, 'rgba(4,5,14,0)'); ctx.fillStyle = bg2; ctx.fillRect(0, 380, W, 940); ctx.restore(); }
  // «بيجي»
  const ba = eo5(P(t, 28.85, 29.3)) * (1 - P(t, 30.8, 31.05));
  if (ba > 0) {
    ctx.save(); ctx.globalAlpha = ba; ctx.translate(540, 560 + (1 - ba) * 40);
    glow(0, 0, 420, M, .18);
    const tg = ctx.createLinearGradient(-200, 0, 200, 0); tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#d9f3ff');
    txt('بيجي', 0, 0, 170, 900, tg);
    ctx.fillStyle = M; ctx.fillRect(-60, 110, 40, 8); ctx.fillStyle = C; ctx.fillRect(-20, 110, 40, 8); ctx.fillStyle = Y; ctx.fillRect(20, 110, 40, 8);
    ctx.restore();
  }
  // 3-D pin
  const pk = P(t, 29.1, 29.6);

    const out = P(t, 30.8, 31.05);

    const px = sp[0], py = sp[1] - drop * 300;

    for (let i = 0; i < 2; i++) { const rr2 = clamp((t - 29.35 - i * .2) / .8) * 160; if (rr2 > 0) { ctx.strokeStyle = `rgba(255,255,255,${.6 * (1 - rr2 / 160)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(sp[0], sp[1], rr2, rr2 * .35, 0, 0, TAU); ctx.stroke(); } }

    ctx.restore();

  // «عمارة وطبان» glass pill
  const wa = eoB(P(t, 29.55, 29.95)) * (1 - P(t, 30.8, 31.05));
  if (wa > 0) {
    ctx.save(); ctx.globalAlpha = clamp(wa); ctx.translate(540, 1170); ctx.scale(lerp(.8, 1, wa), lerp(.8, 1, wa));
    rr(-300, -66, 600, 132, 66); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
    const sg = ctx.createLinearGradient(-300, 0, 300, 0); sg.addColorStop(0, C); sg.addColorStop(.5, M); sg.addColorStop(1, Y);
    ctx.lineWidth = 3; ctx.strokeStyle = sg; ctx.stroke();

    ctx.restore();
  }
}
function drawPin(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-20, -40, -62, -70, -62, -118); ctx.arc(0, -118, 62, Math.PI, 0, false); ctx.bezierCurveTo(62, -70, 20, -40, 0, 0); ctx.closePath();
  const g = ctx.createLinearGradient(-62, -180, 62, 0); g.addColorStop(0, '#ff4fb5'); g.addColorStop(.55, M); g.addColorStop(1, '#7a0049');
  ctx.fillStyle = g; ctx.fill();
  // side shading for depth
  ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(40, -100, 40, 120, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(0, -118, 28, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -118, 14, 0, TAU); ctx.fillStyle = C; ctx.fill();
  ctx.beginPath(); ctx.ellipse(-30, -146, 10, 22, .6, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();

// =====================================================================
//  SCENE 7  31 – 38   everything returns → logo «مطبعة ألوان»
// =====================================================================
const RET = (() => {
  const r = rng(303), a = [];
  ITEMS.forEach((type, i) => a.push({ type, ring: 0, ph: i * TAU / 8, rad: 430 + r() * 40, s: .55 }));
  for (let i = 0; i < 26; i++) a.push({ kind: r() < .6 ? 'letter' : SHAPES[i % 6], ch: AR[Math.floor(r() * AR.length)], ring: 1, ph: r() * TAU, rad: 250 + r() * 420, s: 22 + r() * 26, c: [C, M, Y, '#ffffff'][i % 4] });
  for (let i = 0; i < 16; i++) a.push({ blob: CMYK[i % 4], ring: 2, ph: r() * TAU, rad: 300 + r() * 380, s: 10 + r() * 20 });
  return a;
})();
const LOGO = { mx: 540, my: 640, nameY: 905 };
function scene7(t) {
  // clean luxurious background
  const g = ctx.createRadialGradient(540, 860, 0, 540, 860, 1400); g.addColorStop(0, '#141a3a'); g.addColorStop(.55, '#090c1f'); g.addColorStop(1, '#030409');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  glow(540 + Math.sin(t * .6) * 80, 700, 700, VIO, .25); glow(200, 1500, 600, C, .14); glow(900, 1500, 600, M, .14);
  ctx.restore();
  halftoneOverlay(.04);
  // orbiting returning elements
  const conv = eiE(P(t, 32.55, 33.45)); // spiral into the centre
  const inK = eo3(P(t, 31.0, 31.6));
  if (conv < 1) {
    const list = RET.map((e, i) => {
      const spd = (e.ring === 0 ? 1.6 : e.ring === 1 ? 2.1 : 2.6) * (1 + conv * 3);
      const an = e.ph + (t - 31) * spd + conv * 2;
      const rad = e.rad * (1 - conv) * lerp(1.8, 1, inK);
      const tilt = e.ring === 1 ? .55 : e.ring === 2 ? .8 : .7;
      const x = 540 + Math.cos(an) * rad, y = 800 + Math.sin(an) * rad * (1.25 - tilt * .3) + Math.cos(an) * rad * .15 * (e.ring - 1);
      return { e, x, y, z: Math.sin(an), i };
    }).sort((a, b) => a.z - b.z);
    for (const o of list) {
      const { e } = o; const sc = (1 - conv * .85) * (.8 + .25 * (o.z + 1) / 2);
      ctx.save(); ctx.globalAlpha = inK * (1 - P(t, 33.2, 33.45));
      if (e.type) product(e.type, o.x, o.y, e.s * sc, Math.sin(t * 3 + o.i) * .2, 1, {});
      else if (e.blob) { ctx.fillStyle = e.blob === K ? '#2a2e3a' : e.blob; ctx.beginPath(); ctx.arc(o.x, o.y, e.s * sc, 0, TAU); ctx.fill(); }
      else { ctx.translate(o.x, o.y); ctx.rotate(t * 2 + o.i); ctx.scale(sc, sc); ctx.fillStyle = e.c; drawShape(e.kind, e.s, e.ch); }
      ctx.restore();
    }
  }

  if (lk > 0) {
    const s = eoB(lk, 2.2);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(LOGO.mx, LOGO.my, 420 + 60 * Math.sin(t * 2), '#ffffff', .16 + .3 * (1 - P(t, 33.4, 34.2))); ctx.restore();
    inkStrokes(t);
    ctx.save(); ctx.translate(LOGO.mx, LOGO.my + 40); ctx.scale(s, s); ctx.rotate((1 - eo3(lk)) * -1.2);
    drawMark(92, 0);
    ctx.restore();
    // shockwave
    const sw = P(t, 33.4, 34.2);
    if (sw < 1) { ctx.strokeStyle = `rgba(255,255,255,${.7 * (1 - sw)})`; ctx.lineWidth = 6 * (1 - sw) + 1; ctx.beginPath(); ctx.arc(LOGO.mx, LOGO.my, 120 + 700 * eo3(sw), 0, TAU); ctx.stroke(); }
  }
  // name «مطبعة ألوان»
  const nk = eo5(P(t, 33.7, 34.3));
  if (nk > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, LOGO.nameY - 140 + (1 - nk) * 260, W, 280); ctx.clip();
    ctx.translate(0, (1 - nk) * 70);
    const ng = ctx.createLinearGradient(140, 0, 940, 0); ng.addColorStop(0, '#ffffff'); ng.addColorStop(.5, '#f1f5ff'); ng.addColorStop(1, '#ffffff');
    txt('مطبعة ألوان', 540, LOGO.nameY, 168, 700, ng, 'center', 'Reem');
    ctx.restore();
    // shimmer pass
    const sh = P(t, 34.4, 35.2);
    if (sh > 0 && sh < 1) {
      ctx.save(); ctx.font = font(168, 700, 'Reem'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
      const x = lerp(1000, 80, sh); const sg = ctx.createLinearGradient(x - 120, 0, x + 120, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(0,174,239,.9)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = sg; ctx.fillText('مطبعة ألوان', 540, LOGO.nameY); ctx.restore();
    }
    // CMYK underline
    const ul = eio(P(t, 34.0, 34.5));
    CMYK.forEach((c, i) => { ctx.fillStyle = c === K ? '#e9ecf4' : c; ctx.fillRect(540 + 150 - (i + 1) * 75 * ul, LOGO.nameY + 112, 75 * ul - 6, 8); });
  }
  // tagline
  const tk = eo5(P(t, 34.15, 34.65));
  if (tk > 0) { ctx.save(); ctx.globalAlpha = tk; ctx.translate(0, (1 - tk) * 30); txt('نحوّل أفكارك إلى شيء يستحق أن يُرى.', 540, 1105, 50, 700, 'rgba(235,240,255,.92)'); ctx.restore(); }
  // location
  const lo = eo5(P(t, 34.6, 35.1));
  if (lo > 0) {
    ctx.save(); ctx.globalAlpha = lo; ctx.translate(0, (1 - lo) * 30);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(340, 1250, 400, 2);
    ctx.font = font(58, 800); const tw = ctx.measureText('بيجي — عمارة وطبان').width;
    txt('بيجي — عمارة وطبان', 540 - 30, 1355, 58, 800, '#ffffff');
    drawPin(540 + tw / 2 + 12, 1385, .42);
    ctx.restore();
  }
  // phone
  const ph = eoB(P(t, 35.0, 35.45));
  if (ph > 0) {
    ctx.save(); ctx.globalAlpha = clamp(ph); ctx.translate(540, 1505); ctx.scale(lerp(.85, 1, ph), lerp(.85, 1, ph));
    rr(-330, -62, 660, 124, 62);
    const pg = ctx.createLinearGradient(-330, 0, 330, 0); pg.addColorStop(0, '#00AEEF'); pg.addColorStop(1, '#EC008C');
    ctx.fillStyle = pg; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(-326, -58, 652, 56, 56); ctx.fill();
    ctx.font = font(76, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr'; ctx.fillStyle = '#ffffff';
    ctx.fillText('07719287567', 30, 4);

    ctx.restore();
  }
  // final hit glow
  const fh = P(t, 36.7, 37.3);
  if (fh > 0 && fh < 1) { ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(540, 760, 700 * eo3(fh) + 200, '#ffffff', .35 * (1 - fh)); ctx.restore(); }
  flash(.38 * (1 - P(t, 33.35, 33.7)) * P(t, 33.3, 33.35));
  flash(.25 * (1 - P(t, 36.7, 37.1)) * P(t, 36.66, 36.7));
}
function phoneIcon(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.rotate(-.6);
  rr(-9, -22, 18, 44, 8); ctx.fill();
  ctx.fillStyle = pgFill(); rr(-5, -14, 10, 26, 2); ctx.fill();
  ctx.restore();
}
function pgFill() { return 'rgba(10,20,60,.65)'; }
// four CMYK ink strokes sweeping around the logo
function inkStrokes(t) {
  const k = P(t, 35.4, 36.7); if (k <= 0 || k >= 1) return;
  CMYK.forEach((c, i) => {
    const kk = clamp((k - i * .06) / .76); if (kk <= 0 || kk >= 1) return;
    const head = eio(clamp(kk * 1.4)), tail = eio(clamp((kk - .35) * 1.6));
    const r0 = 165 + i * 20, a0 = -Math.PI * .9 + i * .55, span = Math.PI * 1.7;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 16 - i * 2; ctx.strokeStyle = c === K ? '#e6e9f2' : c;
    ctx.beginPath(); ctx.ellipse(LOGO.mx, LOGO.my + 40, r0 * 1.45, r0 * .72, -.18 + i * .05, a0 + span * tail, a0 + span * head); ctx.stroke();
    ctx.restore();
  });
}

// =====================================================================
//  MASTER
// =====================================================================
function render(t) {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = NAVY; ctx.fillRect(0, 0, W, H);
  const swap34 = 16.05;
  if (t < 5.8) scene1(t);
  if (t >= 4.8 && t < swap34) scene23(t);
  if (t >= swap34 && t < 22.15) scene4(t);
  if (t >= 21.95 && t < 27.4) {
    ctx.save(); ctx.globalAlpha = P(t, 21.95, 22.15); scene5(t); ctx.restore();
  }
  if (t >= 26.95 && t < 31.3) {
    ctx.save(); ctx.globalAlpha = P(t, 26.95, 27.3) * (1 - P(t, 31.0, 31.3)); scene6(t); ctx.restore();
  }
  if (t >= 31.0) { ctx.save(); ctx.globalAlpha = P(t, 31.0, 31.3); scene7(t); ctx.restore(); }
  paperWipe(t, 15.65, .8);
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1;

}

window.ready = (async () => {
  await Promise.all([document.fonts.load('900 100px Cairo'), document.fonts.load('700 100px Cairo'), document.fonts.load('800 100px Cairo'), document.fonts.load('700 100px Reem')]);
  buildGrain(); buildHalftone(); buildWord(); buildConfetti(); buildMap(); buildSheet(); buildMachine();
  window.render = render;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) render(+q.get('t'));
  else if (q.has('play')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
  return true;
})();
