<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>الدولار الخارق — فيديو ساخر</title>
<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000;}
@font-face{font-family:Reem;src:url(fonts/ReemKufi.ttf);font-weight:400 700;}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =====================================================================
//  «مطبعة ألوان» — deterministic motion-graphics engine.
//  render(t) draws the frame at time t (seconds). Logical canvas 1080x1920,
//  rendered at S× (S=2 → 2160x3840 / 4K UHD vertical).
// =====================================================================
const W = 1080, H = 1920;
const S = +(new URLSearchParams(location.search).get('s') || 2);
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
cv.style.width = (W * S) + 'px'; cv.style.height = (H * S) + 'px';
const ctx = cv.getContext('2d');
const DURATION = 64.0;

// ---------- palette ----------
const C = '#00AEEF', M = '#EC008C', Y = '#FFE11A', K = '#1a1c24';
const VIO = '#6C4DFF', NAVY = '#060814', INK = '#0b0e1c', PAPER = '#f5f4f0';
const CMYK = [C, M, Y, K];

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo3 = t => 1 - Math.pow(1 - t, 3);
const ei3 = t => t * t * t;
const eo5 = t => 1 - Math.pow(1 - t, 5);
const eoE = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eiE = t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
const eioE = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const eoB = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const eoEl = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1;
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hx(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgba(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixc(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// CA = colour amount for products (0 = grey mock-up, 1 = full colour)
let CA = 1;
function col(h, a = 1) {
  const c = hx(h); const l = .3 * c[0] + .59 * c[1] + .11 * c[2];
  const g = 62 + l * .44;
  return `rgba(${lerp(g, c[0], CA) | 0},${lerp(g, c[1], CA) | 0},${lerp(g, c[2], CA) | 0},${a})`;
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(x, y, r, c, a) {
  r = Math.max(r, .01);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  const cc = typeof c === 'string' ? hx(c) : c;
  g.addColorStop(0, rgba(cc, a)); g.addColorStop(.4, rgba(cc, a * .35)); g.addColorStop(1, rgba(cc, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function softShadow(x, y, rx, ry, a = .45) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore();
}
function font(size, weight = 800, fam = 'Cairo') { return `${weight} ${size}px ${fam}`; }
function txt(s, x, y, size, weight, fill, align = 'center', fam = 'Cairo') {
  ctx.font = font(size, weight, fam); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.direction = 'rtl'; ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function bars(x, y, ws, gap, h, c) { ctx.fillStyle = c; ws.forEach((w, i) => { rr(x - w, y + i * gap, w, h, h / 2); ctx.fill(); }); }

// Ink-drop brand mark (four CMYK quadrants)
function dropPath(r) {
  ctx.beginPath();
  ctx.moveTo(0, -1.55 * r);
  ctx.bezierCurveTo(.48 * r, -.95 * r, r, -.42 * r, r, .15 * r);
  ctx.arc(0, .15 * r, r, 0, Math.PI, false);
  ctx.bezierCurveTo(-r, -.42 * r, -.48 * r, -.95 * r, 0, -1.55 * r);
  ctx.closePath();
}
function drawMark(r, rot = 0, opts = {}) {
  ctx.save();
  dropPath(r); ctx.save(); ctx.clip();
  const cg = ctx.createConicGradient(-Math.PI / 2 + rot, 0, .15 * r);
  const cs = [col(C), col(M), col(Y), col('#23252f')];
  for (let i = 0; i < 4; i++) { cg.addColorStop(i / 4, cs[i]); cg.addColorStop((i + 1) / 4 - .0001, cs[i]); }
  ctx.fillStyle = cg; ctx.fillRect(-2 * r, -2 * r, 4 * r, 4 * r);
  // separators
  ctx.strokeStyle = opts.sep || 'rgba(255,255,255,.95)'; ctx.lineWidth = r * .07;
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + rot + i * TAU / 4;
    ctx.beginPath(); ctx.moveTo(0, .15 * r); ctx.lineTo(Math.cos(a) * 3 * r, .15 * r + Math.sin(a) * 3 * r); ctx.stroke();
  }
  // gloss
  const gg = ctx.createLinearGradient(-r, -1.5 * r, r, r);
  gg.addColorStop(0, 'rgba(255,255,255,.45)'); gg.addColorStop(.45, 'rgba(255,255,255,0)');
  gg.addColorStop(1, 'rgba(0,0,0,.25)');
  ctx.fillStyle = gg; ctx.fillRect(-2 * r, -2 * r, 4 * r, 4 * r);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(-.42 * r, -.25 * r, .13 * r, .3 * r, .5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

let grainCv, halftoneCv;
function buildGrain() {
  grainCv = document.createElement('canvas'); grainCv.width = 540; grainCv.height = 960;
  const g = grainCv.getContext('2d'); const id = g.createImageData(540, 960); const r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
function buildHalftone() {
  halftoneCv = document.createElement('canvas'); halftoneCv.width = W * S; halftoneCv.height = H * S;
  const g = halftoneCv.getContext('2d'); g.scale(S, S);
  const step = 22; g.fillStyle = '#fff';
  for (let y = 0; y < H + step; y += step) for (let x = 0; x < W + step; x += step) {
    const ox = (Math.floor(y / step) % 2) * step / 2;
    const d = Math.hypot(x + ox - W * .5, y - H * .45) / 1100;
    const r = clamp(1 - d) * 4.2 + .6;
    g.beginPath(); g.arc(x + ox, y, r, 0, TAU); g.fill();
  }
}
function halftoneOverlay(a, ox = 0, oy = 0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.setTransform(1, 0, 0, 1, ox * S, oy * S); ctx.drawImage(halftoneCv, 0, 0); ctx.restore(); }
function overlays(t) {
  // paper grain
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  const f = Math.floor(t * 24), ox = (f * 137) % 400, oy = (f * 251) % 700;
  ctx.drawImage(grainCv, ox / 2, oy / 2, 540 - ox / 2, 960 - oy / 2, 0, 0, cv.width * (1 - ox / 1080), cv.height * (1 - oy / 1920));
  ctx.drawImage(grainCv, 0, 0, 540, 960, 0, 0, cv.width, cv.height);
  ctx.restore();
  // vignette
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  const g = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function flash(a, c = '#ffffff') { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); ctx.restore(); }


// =====================================================================
//  «الدولار الخارق» — satirical motion graphics. render(t) is deterministic.
// =====================================================================
const NAVY2 = '#0b1026', INKL = '#0d1330', GOLD = '#ffc94a', RED = '#ff4757', GREEN = '#2ecc71', BLUE = '#3aa0ff';
const OFFICIAL = 132000, MARKET = 189000;
const fmt = n => Math.round(n).toLocaleString('en-US');
function outline(w = 4) { ctx.lineWidth = w; ctx.strokeStyle = INKL; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function limb(x0, y0, x1, y1, w, c) { ctx.lineCap = 'round'; ctx.strokeStyle = INKL; ctx.lineWidth = w + 6; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
function leg(hx, hy, a, len, c, shoe = '#1b1f33', dir = -1) {
  const kx = hx + Math.sin(a) * len, ky = hy + Math.cos(a) * len;
  const b = a - Math.max(0, -Math.sin(a)) * 1.2 * -dir - .25;
  const fx = kx + Math.sin(b + .6 * Math.max(0, Math.sin(a + 1))) * len, fy = ky + Math.cos(b) * len;
  limb(hx, hy, kx, ky, 9, c); limb(kx, ky, fx, fy, 9, c);
  ctx.fillStyle = shoe; outline(3); ctx.beginPath(); ctx.ellipse(fx + dir * 9, fy + 4, 16, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
}
function eyeball(x, y, rx, ry, px = 0, py = 0, lid = 0) {
  outline(3); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INKL; ctx.beginPath(); ctx.arc(x + px * rx * .45, y + py * ry * .45, Math.min(rx, ry) * .5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + px * rx * .45 - 2, y + py * ry * .45 - 3, Math.min(rx, ry) * .16, 0, TAU); ctx.fill();
  if (lid > 0) { ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rx + 1, ry + 1, 0, 0, TAU); ctx.clip(); ctx.fillStyle = '#c9ccd8'; ctx.fillRect(x - rx - 2, y - ry - 2, 2 * rx + 4, 2 * ry * lid + 2); ctx.restore(); outline(3); ctx.beginPath(); ctx.moveTo(x - rx, y - ry + 2 * ry * lid); ctx.lineTo(x + rx, y - ry + 2 * ry * lid); ctx.stroke(); }
}
function sweat(x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#7fd3ff'; outline(2.5); ctx.beginPath(); ctx.moveTo(0, -14); ctx.quadraticCurveTo(10, 0, 0, 8); ctx.quadraticCurveTo(-10, 0, 0, -14); ctx.fill(); ctx.stroke(); ctx.restore(); }
function bubble(x, y, w, h, tailX, tailY, lines, size, a = 1, col = '#ffffff') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(a); const s = lerp(.6, 1, eoB(clamp(a)));
  ctx.translate(tailX, tailY); ctx.scale(s, s); ctx.translate(-tailX, -tailY);
  outline(5); ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 40); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 30, y + h / 2 - 3); ctx.lineTo(tailX, tailY); ctx.lineTo(x + 30, y + h / 2 - 3); ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 30, y + h / 2); ctx.lineTo(tailX, tailY); ctx.lineTo(x + 30, y + h / 2); ctx.stroke();
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * size * 1.25, size, 800, INKL));
  ctx.restore();
}

// ---------- the superhero dollar ----------
function drawDollar(x, y, s, o = {}) {
  const ph = o.ph || 0, pose = o.pose || 'run';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(o.lean || 0);
  // cape
  if (o.cape !== false) {
    const fl = o.capeFlow ?? 1;
    ctx.fillStyle = '#e63946'; outline(4);
    ctx.beginPath(); ctx.moveTo(60, -50);
    for (let i = 0; i <= 8; i++) { const u = i / 8; ctx.lineTo(60 + u * 230 * fl, -50 + u * 40 + Math.sin(ph * 2 + u * 6) * 18 * u - (1 - fl) * u * -80); }
    for (let i = 8; i >= 0; i--) { const u = i / 8; ctx.lineTo(60 + u * 210 * fl, -50 + u * 140 * (1 - .4 * fl) + Math.sin(ph * 2 + u * 6 + 1) * 18 * u); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // legs
  if (pose === 'run') { const a = Math.sin(ph) * .9; leg(-28, 52, a, 46, '#2a7d4f'); leg(28, 52, -a, 46, '#2a7d4f'); }
  else if (pose === 'fly') { leg(-20, 52, .9, 44, '#2a7d4f'); leg(20, 52, 1.2, 44, '#2a7d4f'); }
  else { leg(-30, 52, .05, 46, '#2a7d4f'); leg(30, 52, -.05, 46, '#2a7d4f'); }
  // back arm
  const sw = Math.sin(ph);
  if (pose === 'run') limb(100, -5, 100 + 50 * sw, 40 - 30 * Math.abs(sw), 9, '#2a7d4f');
  // note body
  const g = ctx.createLinearGradient(0, -55, 0, 55); g.addColorStop(0, '#58d68d'); g.addColorStop(1, '#1e9e5a');
  outline(5); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-110, -56, 220, 112, 14); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.roundRect(-98, -44, 196, 88, 8); ctx.stroke();
  ctx.font = font(26, 900); ctx.fillStyle = '#c9f7dc'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr';
  ctx.fillText('$', -80, -26); ctx.fillText('$', 80, 26);
  ctx.fillStyle = '#9ff0c2'; ctx.beginPath(); ctx.ellipse(0, 0, 54, 46, 0, 0, TAU); ctx.fill(); outline(3); ctx.stroke();
  // face (superhero mask)
  eyeball(-17, -8, 11, 12, o.lx ?? -.6, o.ly ?? 0);
  eyeball(17, -8, 11, 12, o.lx ?? -.6, o.ly ?? 0);
  if (o.shades) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(-40, -22, 34, 24, 8); ctx.roundRect(6, -22, 34, 24, 8); ctx.fill(); ctx.fillRect(-8, -16, 16, 5); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-34, -18, 10, 4); ctx.fillRect(12, -18, 10, 4); }
  else { ctx.fillStyle = '#14213d'; ctx.beginPath(); ctx.moveTo(-46, -14); ctx.quadraticCurveTo(0, -30, 46, -14); ctx.lineTo(42, 2); ctx.quadraticCurveTo(0, -6, -42, 2); ctx.closePath(); ctx.fill();
    eyeball(-17, -8, 9, 9, o.lx ?? -.6, 0); eyeball(17, -8, 9, 9, o.lx ?? -.6, 0); }
  ctx.strokeStyle = INKL; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-28, -30); ctx.lineTo(-8, -24); ctx.moveTo(28, -30); ctx.lineTo(8, -24); ctx.stroke();
  ctx.fillStyle = '#ffffff'; outline(3); ctx.beginPath(); ctx.moveTo(-20, 14); ctx.quadraticCurveTo(0, 34, 22, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
  // front arm
  if (pose === 'run') limb(-100, -5, -100 - 50 * sw, 40 - 30 * Math.abs(sw), 9, '#2a7d4f');
  else if (pose === 'fly') { limb(-100, -10, -170, -60, 9, '#2a7d4f'); ctx.fillStyle = '#ffffff'; outline(3); ctx.beginPath(); ctx.arc(-176, -66, 14, 0, TAU); ctx.fill(); ctx.stroke(); }
  else if (pose === 'wave') { const w = Math.sin(ph * 3) * .4; limb(-100, -10, -130, -80, 9, '#2a7d4f'); ctx.save(); ctx.translate(-130, -80); ctx.rotate(w); ctx.fillStyle = '#ffffff'; outline(3); ctx.beginPath(); ctx.arc(0, -10, 14, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore(); limb(100, -5, 120, 50, 9, '#2a7d4f'); }
  else { limb(-100, -5, -125, 50, 9, '#2a7d4f'); limb(100, -5, 125, 50, 9, '#2a7d4f'); }
  ctx.restore();
}
// ---------- the out-of-breath dinar ----------
function palm(x, y, s, c) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = c; ctx.lineCap = 'round';
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 20); ctx.quadraticCurveTo(3, 0, 0, -16); ctx.stroke();
  ctx.lineWidth = 3; [[-1, -.2], [-1, .4], [1, -.2], [1, .4], [0, -1]].forEach(([d, k]) => { ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(d * 10, -26 + k * 8, d * 20 + (d === 0 ? 0 : 0), -12 + k * 14 + (d === 0 ? -14 : 0)); ctx.stroke(); });
  ctx.restore();
}
function drawDinar(x, y, s, o = {}) {
  const ph = o.ph || 0, pose = o.pose || 'run';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(o.lean || 0);
  if (pose === 'run') { const a = Math.sin(ph) * .75; leg(-28, 52, a, 44, '#b5522c'); leg(28, 52, -a, 44, '#b5522c'); }
  else if (pose === 'climb') { const a = Math.sin(ph) * .5; leg(-24, 52, .2 + a, 42, '#b5522c', '#1b1f33', 1); leg(24, 52, .2 - a, 42, '#b5522c', '#1b1f33', 1); }
  else { leg(-28, 52, .05, 44, '#b5522c'); leg(28, 52, -.05, 44, '#b5522c'); }
  const sw = Math.sin(ph);
  if (pose === 'run') limb(100, -5, 120 + 30 * sw, -40 + 50 * sw, 9, '#b5522c');
  const g = ctx.createLinearGradient(0, -55, 0, 55); g.addColorStop(0, '#f6c28b'); g.addColorStop(1, '#d9784a');
  outline(5); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-110, -56, 220, 112, 14); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.roundRect(-98, -44, 196, 88, 8); ctx.stroke();
  txt('دينار', 72, 30, 20, 900, '#7a3418');
  palm(-78, 6, .9, '#7a3418');
  ctx.fillStyle = '#ffe2c4'; ctx.beginPath(); ctx.ellipse(0, 0, 54, 46, 0, 0, TAU); ctx.fill(); outline(3); ctx.stroke();
  // worried face
  eyeball(-17, -6, 12, 14, o.lx ?? .3, o.ly ?? .2, o.tired ? .35 : 0);
  eyeball(17, -6, 12, 14, o.lx ?? .3, o.ly ?? .2, o.tired ? .35 : 0);
  ctx.strokeStyle = INKL; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-30, -26); ctx.lineTo(-8, -32); ctx.moveTo(30, -26); ctx.lineTo(8, -32); ctx.stroke();
  const mo = .6 + .4 * Math.abs(Math.sin(ph * 1.7));
  ctx.fillStyle = '#5a1a1a'; outline(3); ctx.beginPath(); ctx.ellipse(0, 22, 12, 9 * mo + 3, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff7b8a'; ctx.beginPath(); ctx.ellipse(2, 27, 7, 4 * mo, 0, 0, TAU); ctx.fill();
  if (pose === 'run') limb(-100, -5, -120 - 30 * sw, -40 - 50 * sw, 9, '#b5522c');
  else if (pose === 'climb') { limb(-100, -5, -118, 45, 9, '#b5522c'); limb(100, -5, 118, 45, 9, '#b5522c'); }
  else { limb(-100, -5, -125, 50, 9, '#b5522c'); limb(100, -5, 125, 50, 9, '#b5522c'); }
  if (o.sweat) { const k = (ph * .3) % 1; sweat(70 + k * 30, -60 - k * 20, 1, 1 - k); sweat(-75 - k * 25, -55 - k * 30, .8, 1 - ((k + .5) % 1)); }
  ctx.restore();
}

// ---------- shared economic background ----------
const CANDLES = (() => { const r = rng(12), a = []; let v = 0; for (let i = 0; i < 80; i++) { const d = (r() - .42) * 60; a.push([v, v + d, Math.min(v, v + d) - r() * 30, Math.max(v, v + d) + r() * 30]); v += d; } return a; })();
function econBg(t, a = 1, warm = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1638'); g.addColorStop(1, '#05070f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(200, 300, 700, BLUE, .18); glow(900, 1500, 700, warm ? RED : '#7b5cff', .16 + .2 * warm); ctx.restore();
  ctx.save(); ctx.globalAlpha *= .09 * a; ctx.strokeStyle = '#8fb3ff'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // scrolling candlesticks
  ctx.save(); ctx.globalAlpha *= .22 * a; const off = (t * 40) % 30;
  CANDLES.forEach(([o, c, lo, hi], i) => {
    const x = i * 30 - off - 300, base = 1250;
    ctx.strokeStyle = ctx.fillStyle = c >= o ? GREEN : RED;

function scene4(t) {

  ctx.fillStyle = '#b9d7a6'; ctx.fillRect(-62, -84, 124, 44); ctx.fillStyle = '#a4b0be'; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) ctx.fillRect(-58 + c * 42, -24 + r * 38, 32, 28); ctx.restore();
  // hands + pencil

  limb(400, 1180, hx, hy, 34, '#4f7fe0'); ctx.fillStyle = '#e8b089'; outline(4); ctx.beginPath(); ctx.arc(hx, hy, 24, 0, TAU); ctx.fill(); ctx.stroke();

// =====================================================================
//  SCENE 5  36.3 – 42.3   official vs market: two numbers, one reality
// =====================================================================
function roadPt(u) { return [540 + 400 * Math.sin(u * Math.PI * 3.5), 760 + 400 * u]; }
function scene5(t) {

  // middle landscape
  const mg = ctx.createLinearGradient(0, 700, 0, 1220); mg.addColorStop(0, '#16224a'); mg.addColorStop(1, '#2a1630'); ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1d2b55'; ctx.beginPath(); ctx.moveTo(0, 1000); for (let x = 0; x <= W; x += 60) ctx.lineTo(x, 900 + Math.sin(x * .012) * 60 + Math.sin(x * .031) * 25); ctx.lineTo(W, 1220); ctx.lineTo(0, 1220); ctx.fill();

    ctx.save(); ctx.translate(x, y - 14); ctx.rotate(Math.atan2(y2 - y, x2 - x)); outline(3); ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.roundRect(-26, -14, 52, 22, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = INKL; ctx.beginPath(); ctx.arc(-14, 10, 7, 0, TAU); ctx.arc(14, 10, 7, 0, TAU); ctx.fill(); ctx.restore();
  }

// =====================================================================
//  SCENE 6  42.3 – 51.8   stairs for the dinar, express lift for the dollar
// =====================================================================
const FLOORS = [140000, 150000, 160000, 170000, 180000, 189000];
const FL_Y = i => 1700 - i * 250;
function stairPos(s) { // s in flights (0..5)
  const f = Math.min(4, Math.floor(s)), u = s - f;
  const xa = f % 2 ? 520 : 110, xb = f % 2 ? 110 : 520;
  const steps = 10, q = Math.floor(u * steps) / steps + (u * steps % 1) * .25 / steps * 4 * 0;

}
function frozen(t) { return Math.min(t, 51.3); }
function scene6(tt) {

// =====================================================================
//  SCENE 7  51.8 – 64   elegant black ending

function miniCalc(x, y, s, rot = 0, a = 1) {

  outline(4); ctx.fillStyle = '#3a4266'; ctx.beginPath(); ctx.roundRect(-55, -75, 110, 150, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b9d7a6'; ctx.beginPath(); ctx.roundRect(-42, -62, 84, 34, 6); ctx.fill();

}
function scene7(t) {

  ctx.fillStyle = 'rgba(255,201,74,.6)'; ctx.fillRect(540 - 180 * eio(P(t, 53.2, 53.9)), 900, 360 * eio(P(t, 53.2, 53.9)), 3);

  if (t > 59.4) { const ka = eoB(P(t, 59.5, 59.8), 2); ctx.save(); ctx.translate(700, 1290); ctx.scale(ka, ka); ctx.fillStyle = GOLD; outline(3); ctx.beginPath(); ctx.roundRect(-70, -22, 140, 44, 22); ctx.fill(); ctx.stroke(); txt('احتياطي', 0, 2, 28, 900, INKL); ctx.restore(); }
  const dk = P(t, 62.2, 62.7);
  if (dk > 0) { ctx.save(); ctx.globalAlpha *= dk; txt('محتوى ساخر • الأرقام للتوضيح الكوميدي', 540, 1790, 32, 700, 'rgba(200,200,215,.7)'); ctx.restore(); }
}

// =====================================================================
//  MASTER
// =====================================================================
function layer(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; fn(); ctx.restore(); }
function render(t) {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = NAVY2; ctx.fillRect(0, 0, W, H);
  if (t < 10.45) scene1(t);
  if (t >= 10.2 && t < 18.6) layer(P(t, 10.2, 10.45) * (1 - P(t, 18.3, 18.6)), () => scene2(t));
  if (t >= 18.3 && t < 27.3) layer(P(t, 18.3, 18.5), () => scene3(t));
  if (t >= 26.95 && t < 36.4) layer(P(t, 26.95, 27.15), () => scene4(t));
  if (t >= 36.2 && t < 42.4) layer(P(t, 36.2, 36.35), () => scene5(t));
  if (t >= 42.2 && t < 51.9) layer(P(t, 42.2, 42.45) * (1 - P(t, 51.6, 51.9)), () => scene6(t));
  if (t >= 51.6) layer(P(t, 51.6, 51.95), () => scene7(t));
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  overlays(t);
  if (t < .2) flash(1 - t / .2, '#000');
  if (t > DURATION - .4) flash(P(t, DURATION - .4, DURATION), '#000');
}
window.ready = (async () => {
  await Promise.all([document.fonts.load('900 100px Cairo'), document.fonts.load('700 100px Cairo'), document.fonts.load('800 100px Cairo')]);
  buildGrain(); buildHalftone();
  window.render = render;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) render(+q.get('t'));
  else if (q.has('play')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
  return true;
})();
