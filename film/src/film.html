<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,TAU=Math.PI*2;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let TL=null;
const C={
  night:'#0b1320', navy:'#13203a', deep:'#0a0f1a', teal:'#2a9d8f', amber:'#ffb703', orange:'#fb8500',
  red:'#e63946', cream:'#f1e9da', eye:'#c6f55a', skin:'#f2c6a0', hoodie:'#2a9d8f', concrete:'#3a3f52',
  wall:'#2b3044', dirt1:'#4a3527', dirt2:'#3b2a1f', dirt3:'#2d2018', grass:'#3f8f4f', ginger:'#f4a261'
};
// ---------- helpers ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*TAU/3)+1};
function rnd(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function tri(a,b,c,d,e,f){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fill()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function txt(s,x,y,size,color,o={}){
  ctx.save();ctx.font=`${o.weight||700} ${size}px ${o.font||'Cairo'}`;ctx.fillStyle=color;
  ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction='rtl';
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.blur||30}
  if(o.alpha!==undefined)ctx.globalAlpha*=o.alpha;
  ctx.fillText(s,x,y);ctx.restore();
}
function bg(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function glowBlob(x,y,r,color,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore()}
function paw(x,y,s,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;
  ctx.beginPath();ctx.ellipse(0,10,22,18,0,0,TAU);ctx.fill();
  [[-26,-14,9,11,-.4],[-10,-28,9,12,-.15],[10,-28,9,12,.15],[26,-14,9,11,.4]].forEach(([a,b,rx,ry,r])=>{ctx.beginPath();ctx.ellipse(a,b,rx,ry,r,0,TAU);ctx.fill()});
  ctx.restore()}

// ---------- characters ----------
// sitting cat, x,y = bottom centre, ~125px tall at s=1
function cat(x,y,s,o={}){
  const t=o.t||0,c=o.color||'#06080d';
  ctx.save();ctx.translate(x,y);ctx.scale(s*(o.flip?-1:1),s);
  ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineCap='round';
  const sw=Math.sin(t*2.2+(o.ph||0))*14;
  ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(22,-8);ctx.bezierCurveTo(62,-4,58+sw,-48,40+sw,-74);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-36,31,38,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(-14,-4,12,7,0,0,TAU);ctx.ellipse(14,-4,12,7,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(0,-84,26,0,TAU);ctx.fill();
  tri(-25,-90,-20,-124,-2,-106);tri(25,-90,20,-124,2,-106);
  if(o.inner){ctx.fillStyle=o.inner;tri(-20,-98,-17,-117,-7,-106);tri(20,-98,17,-117,7,-106)}
  if(o.belly){ctx.fillStyle=o.belly;ctx.beginPath();ctx.ellipse(0,-30,17,26,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(0,-74,14,10,0,0,TAU);ctx.fill()}
  if(o.stripes){ctx.fillStyle=o.stripes;[[-12,-104],[0,-108],[12,-104]].forEach(([a,b])=>{rr(a-2.5,b,5,11,2);ctx.fill()})}
  if(o.eyes!==false){
    const ph=(t*0.6+(o.ph||0)*0.37)%3.2;const bl=ph<0.12?Math.abs(ph-0.06)/0.06:1;
    const ec=o.eyeColor||C.eye;ctx.save();
    if(o.glow!==false){ctx.shadowColor=ec;ctx.shadowBlur=18}
    ctx.fillStyle=ec;ctx.beginPath();ctx.ellipse(-10,-86,6.5,7.5*bl*(o.squint||1),0,0,TAU);ctx.ellipse(10,-86,6.5,7.5*bl*(o.squint||1),0,0,TAU);ctx.fill();
    ctx.restore();
    if(bl>0.3){ctx.fillStyle='#000';const lx=(o.look||0)*2.5;rr(-11.5+lx,-92,3,12*bl,1.5);ctx.fill();rr(8.5+lx,-92,3,12*bl,1.5);ctx.fill()}
  }
  if(o.face){ctx.fillStyle='#e76f8c';tri(-4,-77,4,-77,0,-72);ctx.strokeStyle='#3a2216';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-72);ctx.quadraticCurveTo(-4,-66,-8,-69);ctx.moveTo(0,-72);ctx.quadraticCurveTo(4,-66,8,-69);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(d*12,-74);ctx.lineTo(d*34,-78);ctx.moveTo(d*12,-71);ctx.lineTo(d*34,-70);ctx.stroke()})}
  if(o.bowtie){ctx.fillStyle=o.bowtie;tri(0,-60,-14,-67,-14,-53);tri(0,-60,14,-67,14,-53);circ(0,-60,4)}
  if(o.crown){ctx.fillStyle=C.amber;ctx.beginPath();ctx.moveTo(-18,-108);ctx.lineTo(-18,-126);ctx.lineTo(-9,-116);ctx.lineTo(0,-130);ctx.lineTo(9,-116);ctx.lineTo(18,-126);ctx.lineTo(18,-108);ctx.closePath();ctx.fill()}
  ctx.restore();
}
// walking cat silhouette (side view), x,y bottom centre, facing right
function walkCat(x,y,s,t,color){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineCap='round';
  ctx.lineWidth=8;for(let i=0;i<4;i++){const ph=t*10+i*Math.PI/2+(i>1?Math.PI:0);const bx=[-28,-18,20,30][i];
    ctx.beginPath();ctx.moveTo(bx,-30);ctx.lineTo(bx+Math.sin(ph)*9,-2);ctx.stroke()}
  ctx.beginPath();ctx.ellipse(0,-38,42,17,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(44,-56,15,0,TAU);ctx.fill();tri(34,-62,36,-82,46,-68);tri(48,-66,54,-84,58,-64);
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-38,-44);ctx.quadraticCurveTo(-64,-50+Math.sin(t*5)*6,-62,-80);ctx.stroke();
  ctx.save();ctx.shadowColor=C.eye;ctx.shadowBlur=10;ctx.fillStyle=C.eye;circ(50,-58,3);ctx.restore();
  ctx.restore();
}
// Sami. x,y = bottom centre. ~230px tall at s=1
function person(x,y,s,o={}){
  const t=o.t||0,w=o.walk||0,ph=t*(o.speed||9);
  ctx.save();ctx.translate(x,y);ctx.scale(s*(o.flip?-1:1),s);ctx.lineCap='round';
  const bob=w?Math.abs(Math.sin(ph))*-6*w:0;ctx.translate(0,bob);
  if(o.bag){ctx.fillStyle='#8d5a3b';rr(-46,-160,30,70,10);ctx.fill();ctx.fillStyle='#6b412a';rr(-46,-120,30,10,3);ctx.fill()}
  // legs
  ctx.strokeStyle='#264653';ctx.lineWidth=20;
  const l1=Math.sin(ph)*28*w,l2=-Math.sin(ph)*28*w;
  ctx.beginPath();ctx.moveTo(-10,-80);ctx.lineTo(-10+l1,-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-80);ctx.lineTo(10+l2,-6);ctx.stroke();
  ctx.fillStyle='#1d1d1d';rr(-22+l1,-12,30,14,6);ctx.fill();rr(-2+l2,-12,30,14,6);ctx.fill();
  // arms back
  ctx.strokeStyle='#21867a';ctx.lineWidth=17;const a=Math.sin(ph)*30*w;
  ctx.beginPath();ctx.moveTo(-22,-150);ctx.lineTo(-24-a*.6,-95);ctx.stroke();
  // body
  ctx.fillStyle=o.hoodie||C.hoodie;rr(-34,-165,68,95,22);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.15)';rr(-20,-110,40,20,8);ctx.fill();
  // head
  ctx.fillStyle=C.skin;circ(0,-200,30);
  ctx.fillStyle='#2b1d14';ctx.beginPath();ctx.arc(0,-205,31,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  ctx.beginPath();ctx.ellipse(-8,-226,22,10,-.2,0,TAU);ctx.fill();
  // face
  const look=o.look||0;
  ctx.fillStyle='#1d1d1d';
  if(o.eyesClosed){ctx.strokeStyle='#1d1d1d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-10+look,-198,5,0.2,Math.PI-0.2);ctx.moveTo(15+look,-198);ctx.arc(10+look,-198,5,0.2,Math.PI-0.2);ctx.stroke()}
  else{circ(-10+look,-200,4);circ(10+look,-200,4)}
  ctx.strokeStyle='#7a3e2a';ctx.lineWidth=3;ctx.beginPath();
  if(o.mouth==='o'){ctx.fillStyle='#5a2a1a';circ(look,-182,5)}
  else if(o.mouth==='smile'){ctx.arc(look,-188,9,0.3,Math.PI-0.3);ctx.stroke()}
  else {ctx.moveTo(-7+look,-183);ctx.lineTo(7+look,-183);ctx.stroke()}
  // front arm
  ctx.strokeStyle=o.hoodie||C.hoodie;ctx.lineWidth=17;
  if(o.armUp){ctx.beginPath();ctx.moveTo(22,-150);ctx.lineTo(48,-180-o.armUp*20);ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(22,-150);ctx.lineTo(24+a*.6,-95);ctx.stroke()}
  ctx.restore();
}
// kitten curled sleeping
function kitten(x,y,s,t,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const br=1+Math.sin(t*2.5)*0.03;
  ctx.fillStyle='#e9a46a';ctx.beginPath();ctx.ellipse(0,0,70*br,42*br,0,0,TAU);ctx.fill();
  ctx.fillStyle='#c97d44';[-30,-5,20].forEach(a=>{rr(a,-40,9,30,4);ctx.fill()});
  ctx.strokeStyle='#e9a46a';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(60,10);ctx.quadraticCurveTo(70,50,0,46);ctx.lineTo(-40,40);ctx.stroke();
  ctx.fillStyle='#e9a46a';circ(-58,-6,38);tri(-88,-20,-92,-62,-66,-38);tri(-40,-36,-28,-70,-24,-30);
  ctx.fillStyle='#f7c6c7';tri(-84,-26,-87,-52,-72,-38);tri(-42,-38,-32,-60,-30,-36);
  ctx.fillStyle='#e76f8c';tri(-66,0,-58,0,-62,5);
  if(o.open>0){ctx.save();ctx.shadowColor=C.eye;ctx.shadowBlur=20;ctx.fillStyle=C.eye;ctx.beginPath();ctx.ellipse(-46,-12,7,8*o.open,0,0,TAU);ctx.fill();ctx.restore();ctx.fillStyle='#000';rr(-47.5,-12-7*o.open,3,14*o.open,1.5);ctx.fill()}
  else{ctx.strokeStyle='#5a3220';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-46,-12,7,0.2,Math.PI-0.2);ctx.stroke()}
  ctx.strokeStyle='#5a3220';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-76,-12,7,0.2,Math.PI-0.2);ctx.stroke();
  ctx.restore();
}

// ---------- environments ----------
function skyline(seed,baseY,n,minH,maxH,color,winA,t){
  let x=-40;for(let i=0;i<n;i++){const w=90+rnd(seed+i)*130,h=minH+rnd(seed+i*3.1)*(maxH-minH);
    ctx.fillStyle=color;ctx.fillRect(x,baseY-h,w,h+5);
    if(winA>0){for(let wy=baseY-h+22;wy<baseY-20;wy+=34)for(let wx=x+14;wx<x+w-20;wx+=28){const r=rnd(wx*0.13+wy*0.71+seed);
      if(r>0.62){ctx.fillStyle=`rgba(255,200,90,${winA*(0.4+0.6*rnd(r*99))})`;ctx.fillRect(wx,wy,12,16)}}}
    x+=w+6}
}
function stars(t,a){for(let i=0;i<120;i++){const x=rnd(i)*W,y=rnd(i+500)*H*0.6,tw=0.5+0.5*Math.sin(t*2+i);ctx.fillStyle=`rgba(255,255,255,${a*tw*0.8})`;ctx.fillRect(x,y,2,2)}}
function lamp(x,y,len,ang,on){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,len);ctx.stroke();
  if(on>0){ctx.save();ctx.globalAlpha=on*0.55;const g=ctx.createRadialGradient(0,len+10,10,0,len+300,700);g.addColorStop(0,'rgba(255,205,110,.9)');g.addColorStop(1,'rgba(255,190,90,0)');ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(-30,len+20);ctx.lineTo(-520,len+900);ctx.lineTo(520,len+900);ctx.lineTo(30,len+20);ctx.fill();ctx.restore()}
  ctx.fillStyle='#2d2d2d';ctx.beginPath();ctx.moveTo(-14,len);ctx.lineTo(14,len);ctx.lineTo(36,len+30);ctx.lineTo(-36,len+30);ctx.closePath();ctx.fill();
  ctx.save();ctx.shadowColor=C.amber;ctx.shadowBlur=40*on;ctx.fillStyle=on>0.2?'#ffe6a8':'#555';circ(0,len+32,10);ctx.restore();
  ctx.restore();
}
function bunkerRoom(t,light){
  ctx.fillStyle=C.wall;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;
  for(let y=60;y<H-180;y+=110){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    for(let x=(y/110%2)*120;x<W;x+=240){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+110);ctx.stroke()}}
  ctx.fillStyle='#1d2130';ctx.fillRect(0,H-180,W,180);
  ctx.fillStyle='#262b3d';ctx.fillRect(0,H-180,W,10);
  // pipes
  ctx.fillStyle='#4b5068';ctx.fillRect(0,40,W,18);ctx.fillStyle='#3b3f55';for(let x=100;x<W;x+=300)ctx.fillRect(x,34,20,30);
}
function shelf(x,y,t,cans){
  ctx.fillStyle='#5b4636';ctx.fillRect(x,y,380,14);ctx.fillRect(x,y+150,380,14);
  ctx.fillRect(x+10,y-160,10,330);ctx.fillRect(x+360,y-160,10,330);ctx.fillRect(x,y-160,380,14);
  const cols=['#e63946','#f4a261','#2a9d8f','#e9c46a','#8ecae6'];
  for(let r=0;r<2;r++)for(let i=0;i<cans;i++){const cx=x+40+i*62,cy=y-(r?-150:0);
    ctx.fillStyle='#9aa0b0';rr(cx,cy-80+ (r?150:0)-(r?150:0),48,80,6);ctx.fill();
    ctx.fillStyle=cols[(i+r*2)%5];ctx.fillRect(cx,cy-60,48,38);
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(cx+6,cy-78,6,74)}
}
function vaultDoor(cx,cy,r,rot,o={}){
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='#2a2f3d';circ(0,0,r+40);
  ctx.fillStyle='#596075';circ(0,0,r);
  ctx.fillStyle='#6b7390';circ(0,0,r*0.82);
  ctx.strokeStyle='#454b5e';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,r*0.82,0,TAU);ctx.stroke();
  for(let i=0;i<12;i++){const a=i/12*TAU;ctx.fillStyle='#3a3f50';circ(Math.cos(a)*r*0.92,Math.sin(a)*r*0.92,10)}
  ctx.rotate(rot);ctx.strokeStyle='#2e3342';ctx.lineWidth=22;ctx.lineCap='round';
  for(let i=0;i<3;i++){ctx.rotate(TAU/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-r*0.55);ctx.stroke();ctx.fillStyle='#2e3342';circ(0,-r*0.55,18)}
  ctx.fillStyle='#8a92ad';circ(0,0,r*0.16);ctx.fillStyle='#2e3342';circ(0,0,r*0.07);
  ctx.restore();
}

// ---------- scenes ----------
function sceneTitle(t){
  bg('#05070c','#0b1320');
  const p=inv(0.3,1.6,t);
  // pairs of eyes in the dark
  for(let i=0;i<14;i++){const x=120+rnd(i+3)*1680,y=120+rnd(i+40)*820;if(Math.abs(x-960)<520&&Math.abs(y-500)<220)continue;
    const on=inv(0.2+rnd(i)*1.8,0.5+rnd(i)*1.8,t);const bl=((t+i)*0.7%2.5)<0.12?0.1:1;
    ctx.save();ctx.globalAlpha=on;ctx.shadowColor=C.eye;ctx.shadowBlur=20;ctx.fillStyle=C.eye;const s=0.6+rnd(i+9)*0.8;
    ctx.beginPath();ctx.ellipse(x-14*s,y,7*s,9*s*bl,0,0,TAU);ctx.ellipse(x+14*s,y,7*s,9*s*bl,0,0,TAU);ctx.fill();ctx.restore()}
  const sc=lerp(1.25,1,eo(p));
  ctx.save();ctx.translate(960,480);ctx.scale(sc,sc);
  txt('الملجأ',0,0,230,C.cream,{weight:900,alpha:eo(p),glow:'rgba(255,183,3,.35)',blur:50});
  ctx.restore();
  const p2=inv(1.2,2.2,t);
  ctx.save();ctx.globalAlpha=eo(p2);ctx.fillStyle=C.amber;ctx.fillRect(960-220*eo(p2),640,440*eo(p2),4);ctx.restore();
  txt('حين حكمت القطط العالم',960,700,56,C.amber,{weight:600,alpha:eo(p2)});
}
function scene1(t,d){ // cross-section, descent to bunker
  const cp=eio(inv(0.3,5.5,t)),zp=eio(inv(5.0,7.0,t));
  const cy=lerp(540,1790,cp),cx=lerp(960,930,zp),z=lerp(1,1.6,zp);
  ctx.save();ctx.translate(960,540);ctx.scale(z,z);ctx.translate(-cx,-cy);
  // sky
  const g=ctx.createLinearGradient(0,-200,0,420);g.addColorStop(0,'#0b1320');g.addColorStop(1,'#1d2d4a');ctx.fillStyle=g;ctx.fillRect(0,-200,W,620);
  stars(t,1);
  ctx.fillStyle='#f1e9da';circ(1600,140,50);ctx.fillStyle='#1a2a44';circ(1620,128,46);
  skyline(11,420,18,120,300,'#0f1828',0.5,t);
  // patrol cats on surface
  for(let i=0;i<3;i++){const x=((t*90+i*700)%(W+300))-150;walkCat(x,420,0.9,t+i,'#05070c')}
  // ground layers
  ctx.fillStyle=C.grass;ctx.fillRect(0,420,W,26);
  ctx.fillStyle=C.dirt1;ctx.fillRect(0,446,W,520);ctx.fillStyle=C.dirt2;ctx.fillRect(0,966,W,600);ctx.fillStyle=C.dirt3;ctx.fillRect(0,1566,W,1200);
  for(let i=0;i<70;i++){ctx.fillStyle='rgba(0,0,0,.18)';const x=rnd(i)*W,y=470+rnd(i+77)*2000;ctx.beginPath();ctx.ellipse(x,y,10+rnd(i+1)*30,6+rnd(i+2)*14,0,0,TAU);ctx.fill()}
  // shaft
  ctx.fillStyle='#1a1410';ctx.fillRect(300,446,60,1500);ctx.strokeStyle='#6d5a4a';ctx.lineWidth=4;for(let y=460;y<1940;y+=40){ctx.beginPath();ctx.moveTo(306,y);ctx.lineTo(354,y);ctx.stroke()}
  // depth ruler
  ctx.strokeStyle='rgba(241,233,218,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(1760,446);ctx.lineTo(1760,1950);ctx.stroke();
  for(let i=0;i<=30;i+=5){const y=446+i*50;ctx.beginPath();ctx.moveTo(1740,y);ctx.lineTo(1780,y);ctx.stroke();txt(`${i}`,1720,y,30,'rgba(241,233,218,.7)',{weight:600,align:'right'})}
  // bunker room
  const by=1600;ctx.fillStyle='#14161f';rr(330,by-20,1200,420,24);ctx.fill();
  ctx.fillStyle=C.wall;rr(350,by,1160,380,16);ctx.fill();
  ctx.fillStyle='#1d2130';ctx.fillRect(350,by+320,1160,60);
  ctx.save();rr(350,by,1160,380,16);ctx.clip();lamp(930,by,70,Math.sin(t*1.4)*0.12,1);ctx.restore();
  // bed + Sami
  ctx.fillStyle='#5b4636';ctx.fillRect(1100,by+260,320,60);ctx.fillStyle='#8ecae6';rr(1100,by+240,320,30,10);ctx.fill();
  person(800,by+322,1,{t,look:-2});
  // tally marks
  ctx.strokeStyle='rgba(241,233,218,.6)';ctx.lineWidth=4;for(let i=0;i<8;i++){const x=420+i*44;for(let k=0;k<4;k++){ctx.beginPath();ctx.moveTo(x+k*8,by+60);ctx.lineTo(x+k*8,by+110);ctx.stroke()}ctx.beginPath();ctx.moveTo(x-4,by+100);ctx.lineTo(x+30,by+70);ctx.stroke()}
  ctx.restore();
  // depth counter overlay
  const dp=inv(0.5,5.5,t);const m=Math.round(eio(dp)*30);

  ctx.fillStyle='rgba(241,233,218,.18)';ctx.beginPath();ctx.moveTo(-90,-176);ctx.lineTo(90,-176);ctx.lineTo(10,0);ctx.lineTo(90,176);ctx.lineTo(-90,176);ctx.lineTo(-10,0);ctx.closePath();ctx.fill();
  const top=1-flow;ctx.fillStyle=C.amber;
  ctx.beginPath();const ty=-176+(176)*(1-top);ctx.moveTo(-90*(1-((ty+176)/176))-10*((ty+176)/176),ty);ctx.lineTo(90*(1-((ty+176)/176))+10*((ty+176)/176),ty);ctx.lineTo(8,-4);ctx.lineTo(-8,-4);ctx.closePath();if(top>0.02)ctx.fill();
  const bh=176*flow;ctx.beginPath();ctx.moveTo(-90,176);ctx.lineTo(90,176);ctx.lineTo(0,176-bh);ctx.closePath();ctx.fill();
  if(flow<0.98){ctx.fillRect(-2,0,4,176-bh)}
  ctx.restore();
}
function scene8(t,d){ // hope & waiting
  const warm=eio(inv(2,d-1,t));
  const c1=`rgb(${lerp(20,250,warm)|0},${lerp(30,170,warm)|0},${lerp(55,90,warm)|0})`,c2=`rgb(${lerp(10,120,warm)|0},${lerp(15,50,warm)|0},${lerp(30,60,warm)|0})`;
  bg(c1,c2);
  // rays
  ctx.save();ctx.translate(960,700);ctx.rotate(t*0.05);ctx.globalAlpha=0.12*warm;ctx.fillStyle='#fff';
  for(let i=0;i<16;i++){ctx.rotate(TAU/16);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-60,-1400);ctx.lineTo(60,-1400);ctx.fill()}ctx.restore();
  // sun rising
  ctx.fillStyle='#ffd166';circ(960,lerp(1200,760,warm),180);glowBlob(960,lerp(1200,760,warm),500,'rgba(255,209,102,.8)',warm);
  // calendar pages flying
  const T=TL.scenes[7].start;
  for(let i=0;i<14;i++){const st=1.0+i*0.35,p=inv(st,st+2.2,t);if(p<=0||p>=1)continue;
    ctx.save();ctx.translate(lerp(300,1700+rnd(i)*200,p),lerp(700,-100,p)+Math.sin(p*8+i)*40);ctx.rotate(p*6*(rnd(i)-.5));ctx.globalAlpha=1-p*0.5;
    ctx.fillStyle='#f6edd9';rr(-50,-60,100,120,8);ctx.fill();ctx.fillStyle=C.red;ctx.fillRect(-50,-60,100,26);txt(`${101+i}`,0,12,42,'#3a2a1a',{weight:900});ctx.restore()}
  // hourglass
  const hg=inv(98.9-T-0.3,98.9-T+0.3,t);
  if(hg>0){hourglass(1500,520,1.1*back(hg),t,inv(98.9-T,d,t))}
  // Sami standing determined, fist up
  person(420,1000,1.6,{t,armUp:eo(inv(0.4,1.0,t)),mouth:t>9?'smile':'',look:2});
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,1000,W,80);
  const wp=inv(98.9-T,98.9-T+0.5,t);txt('سأنتظر',1500,140,96,C.cream,{weight:900,alpha:wp,glow:'rgba(0,0,0,.4)'});
}
function scene9(t,d){ // twist
  bunkerRoom(t,1);
  const zoom=lerp(1,2.3,eio(inv(2.0,6.5,t)));
  ctx.save();ctx.translate(960,640);ctx.scale(zoom,zoom);ctx.translate(-1000,-760);
  // cot
  ctx.fillStyle='#5b4636';ctx.fillRect(560,820,900,60);ctx.fillStyle='#8ecae6';rr(560,780,900,50,16);ctx.fill();
  // Sami sitting
  person(1000,830,1.25,{t,look:0,eyesClosed:t<2,mouth:t>7.5?'o':''});
  // lap & kitten
  ctx.fillStyle='#264653';rr(900,780,200,46,20);ctx.fill();
  const op=inv(8.6,9.0,t);
  kitten(1010,770,0.7,t,{open:op});
  // Zzz
  if(op<0.5){for(let i=0;i<3;i++){const p=((t*0.6+i/3)%1);txt('z',1050+p*80,700-p*120,22+p*24,C.cream,{weight:900,alpha:1-p,font:'Cairo'})}}
  ctx.restore();
  lamp(1500,0,140,Math.sin(t*1.2)*0.08,1);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,W,H);
  // question mark punch
  const q=inv(10.0,10.4,t);if(q>0){txt('؟',1650,330,260*back(q),C.amber,{weight:900,glow:'rgba(255,183,3,.6)'})}
}
function sceneEnd(t,d){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  // paw prints walking across
  for(let i=0;i<10;i++){const at=0.1+i*0.22;const a=inv(at,at+0.2,t);if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a*0.85;paw(1800-i*170,860+(i%2?40:-40),0.9,C.amber);ctx.restore()}
  const p=inv(0.4,1.3,t);txt('النهاية...',960,420,130,C.cream,{weight:900,alpha:eo(p)});
  const p2=inv(1.5,2.2,t);txt('أم البداية؟',960,580,80,C.amber,{weight:700,alpha:eo(p2),font:'Amiri'});
  // eyes open at the very end
  const e=inv(2.6,3.0,t);if(e>0){ctx.save();ctx.shadowColor=C.eye;ctx.shadowBlur=30;ctx.fillStyle=C.eye;ctx.beginPath();ctx.ellipse(930,250,14,18*e,0,0,TAU);ctx.ellipse(990,250,14,18*e,0,0,TAU);ctx.fill();ctx.restore()}
}

// ---------- compositor ----------
const SCN=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9];
let grain=null;
function makeGrain(){grain=document.createElement('canvas');grain.width=grain.height=512;const g=grain.getContext('2d');const id=g.createImageData(512,512);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0)}
function subtitle(t){
  for(const s of TL.subs){if(t>=s.s-0.05&&t<=s.e+0.15){
    const a=Math.min(inv(s.s-0.05,s.s+0.12,t),1-inv(s.e,s.e+0.15,t));
    ctx.save();ctx.font='600 46px Cairo';ctx.direction='rtl';const w=ctx.measureText(s.t).width;ctx.globalAlpha=a;
    rr(960-w/2-34,H-128,w+68,78,18);ctx.fillStyle='rgba(5,7,12,.68)';ctx.fill();ctx.restore();
    txt(s.t,960,H-88,46,'#fff',{weight:600,alpha:a});}}
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;
  let fade=1;
  if(t<TL.title){sceneTitle(t);fade=Math.min(inv(0,0.4,t),1-inv(TL.title-0.35,TL.title,t))}
  else{
    const end=TL.scenes[8].end;
    if(t>=end){sceneEnd(t-end,TL.total-end);fade=Math.min(inv(end,end+0.35,t),1-inv(TL.total-0.6,TL.total,t))}
    else for(let i=0;i<9;i++){const s=TL.scenes[i];if(t>=s.start&&t<s.end){const u=t-s.start,d=s.end-s.start;SCN[i](u,d);
      fade=Math.min(inv(0,0.35,u),1-inv(d-0.35,d,u));break}}
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;
  // vignette
  const v=ctx.createRadialGradient(960,540,500,960,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // grain
  if(!grain)makeGrain();ctx.save();ctx.globalAlpha=0.05;ctx.globalCompositeOperation='overlay';const ox=-(rnd(t*30)*512)|0,oy=-(rnd(t*30+9)*512)|0;
  for(let x=ox;x<W;x+=512)for(let y=oy;y<H;y+=512)ctx.drawImage(grain,x,y);ctx.restore();
  if(fade<1){ctx.fillStyle=`rgba(0,0,0,${1-clamp(fade)})`;ctx.fillRect(0,0,W,H)}
  if(t>=TL.title)subtitle(t);
}
window.setup=async(tl)=>{TL=tl;await Promise.all(['900 40px Cairo','800 40px Cairo','700 40px Cairo','600 40px Cairo','700 40px Amiri'].map(f=>document.fonts.load(f,'سامي')));return true};
window.frame=(t,q)=>{render(t);return cv.toDataURL('image/jpeg',q||0.9)};
</script>
