<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Ruqaa;src:url(ruqaa.ttf)}
@font-face{font-family:Amiri;src:url(amiri.ttf)}
@font-face{font-family:Cairo;src:url(cairo.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=30;
const c=document.getElementById('c'),x=c.getContext('2d');
let ENV={mix:[],voc:[]};
const USER='@y70k';
const ROSE='255,77,109',WARM='255,241,230',BLUE='138,180,255';

function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
const easeIO=t=>t<=0?0:t>=1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const win=(t,a,b,f=.45)=>clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1);
const envAt=(arr,t)=>{const i=Math.floor(t*FPS);let s=0,n=0;for(let k=i-2;k<=i+2;k++){if(arr[k]!=null){s+=arr[k];n++}}return n?s/n:0};

// ---------- glow stroke helpers ----------
function polyline(pts,k=1){ // draw first k fraction of polyline
 if(pts.length<2||k<=0)return;
 const n=(pts.length-1)*clamp(k,0,1),ni=Math.floor(n);
 x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
 for(let i=1;i<=ni;i++)x.lineTo(pts[i][0],pts[i][1]);
 if(ni<pts.length-1){const f=n-ni,a=pts[ni],b=pts[ni+1];x.lineTo(lerp(a[0],b[0],f),lerp(a[1],b[1],f))}
}
function glow(drawFn,col,w=6,a=1,blur=34){
 x.save();x.globalAlpha=a;x.lineCap='round';x.lineJoin='round';
 x.strokeStyle=`rgba(${col},.85)`;x.lineWidth=w*1.8;x.shadowColor=`rgba(${col},1)`;x.shadowBlur=blur;drawFn();x.stroke();
 x.strokeStyle=`rgba(255,250,248,.95)`;x.lineWidth=w*.55;x.shadowBlur=8;drawFn();x.stroke();
 x.restore();
}
function tipDot(p,col,a=1){ if(!p)return;x.save();x.globalAlpha=a;x.globalCompositeOperation='lighter';
 const g=x.createRadialGradient(p[0],p[1],0,p[0],p[1],40);g.addColorStop(0,`rgba(255,255,255,1)`);g.addColorStop(.2,`rgba(${col},.8)`);g.addColorStop(1,`rgba(${col},0)`);
 x.fillStyle=g;x.beginPath();x.arc(p[0],p[1],40,0,7);x.fill();x.restore()}
function ptAt(pts,k){const n=(pts.length-1)*clamp(k,0,1),i=Math.min(Math.floor(n),pts.length-2),f=n-i;return[lerp(pts[i][0],pts[i+1][0],f),lerp(pts[i][1],pts[i+1][1],f)]}

// heart strands (left & right, from bottom tip to top dip)
function heartStrands(cx,cy,s){
 const L=[],Rr=[];const N=90;
 for(let i=0;i<=N;i++){const th=Math.PI+Math.PI*i/N; // pi->2pi left
  L.push([cx+16*Math.pow(Math.sin(th),3)*s, cy-(13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th))*s]);
  const th2=Math.PI-Math.PI*i/N;
  Rr.push([cx+16*Math.pow(Math.sin(th2),3)*s, cy-(13*Math.cos(th2)-5*Math.cos(2*th2)-2*Math.cos(3*th2)-Math.cos(4*th2))*s]);}
 return[L,Rr];
}
const shift=(pts,dx,dy,rot=0,ox=0,oy=0)=>pts.map(([a,b])=>{const X=a-ox,Y=b-oy,cs=Math.cos(rot),sn=Math.sin(rot);return[ox+X*cs-Y*sn+dx,oy+X*sn+Y*cs+dy]});

// ---------- typography ----------
function layout(words,size,font,y,gapK=.3){
 x.font=`${size}px ${font}`;const ws=words.map(w=>x.measureText(w).width);const gap=size*gapK;
 const tot=ws.reduce((a,b)=>a+b,0)+gap*(ws.length-1);let cur=W/2+tot/2;
 return words.map((w,i)=>{const cx=cur-ws[i]/2;cur-=ws[i]+gap;return{w,cx,y,width:ws[i],size,font}});
}
function word(o,{a=1,k=1,mode='wipe',col=WARM,glowCol=ROSE,active=false,dx=0,dy=0,rot=0,sc=1,blur=0}={}){
 if(a<=0||k<=0)return;
 x.save();x.globalAlpha=a;x.font=`${o.size}px ${o.font}`;x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
 if(blur>.3)x.filter=`blur(${blur.toFixed(1)}px)`;
 x.translate(o.cx+dx,o.y+dy);x.rotate(rot);x.scale(sc,sc);
 if(mode==='wipe'){ // RTL pen reveal
  x.beginPath();x.rect(o.width/2-o.width*k-30,-o.size,o.width*k+60,o.size*2);x.clip();
 }
 x.shadowColor=`rgba(${glowCol},${active?1:.55})`;x.shadowBlur=active?40:18;
 x.fillStyle=`rgb(${col})`;x.fillText(o.w,0,0);
 x.restore();
 if(mode==='wipe'&&k<1){tipDot([o.cx+dx+o.width/2-o.width*k,o.y+dy+o.size*.12],glowCol,a)}
}

// ---------- background ----------
const R=rng(11);
const dust=[];for(let i=0;i<110;i++)dust.push({x:R()*W,y:R()*H,r:.6+R()*2.4,ph:R()*6.28,sp:6+R()*22});
const gC=document.createElement('canvas');gC.width=gC.height=256;
function grain(seed){const g=gC.getContext('2d'),d=g.createImageData(256,256),r=rng(seed);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=20}g.putImageData(d,0,0);return gC}
function tint(t){ // scene mood colour
 const keys=[[0,[120,20,45]],[8.6,[120,20,45]],[9.4,[25,45,95]],[14,[25,45,95]],[14.8,[70,30,90]],[19.6,[70,30,90]],[20.3,[110,15,35]]];
 for(let i=0;i<keys.length-1;i++){const[a,ca]=keys[i],[b,cb]=keys[i+1];if(t>=a&&t<=b){const k=easeIO((t-a)/(b-a));return ca.map((v,j)=>lerp(v,cb[j],k))}}
 return keys[keys.length-1][1];
}
function background(t,m){
 x.fillStyle='#050407';x.fillRect(0,0,W,H);
 const [r,g,b]=tint(t);
 const gg=x.createRadialGradient(W/2,H*.47,40,W/2,H*.47,H*.75);
 gg.addColorStop(0,`rgba(${r|0},${g|0},${b|0},${.42+.18*m})`);gg.addColorStop(.55,`rgba(${r*.4|0},${g*.4|0},${b*.4|0},.25)`);gg.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=gg;x.fillRect(0,0,W,H);
 // concentric thin rings breathing
 x.save();x.globalCompositeOperation='lighter';
 for(let i=0;i<5;i++){const rr=((t*60+i*170)%850)+80;x.strokeStyle=`rgba(${r|0},${g|0},${b|0},${.18*(1-rr/930)})`;x.lineWidth=1.5;x.beginPath();x.arc(W/2,H*.47,rr,0,7);x.stroke()}
 for(const p of dust){const yy=(p.y-t*p.sp+H*5)%H,xx=p.x+Math.sin(t*.5+p.ph)*25;x.fillStyle=`rgba(255,220,230,${(.12+.3*m)*(.5+.5*Math.sin(t*2+p.ph))})`;x.beginPath();x.arc(xx,yy,p.r,0,7);x.fill()}
 x.restore();
}
function rainLayer(t,a){ if(a<=0)return; const r=rng(3);x.save();x.globalAlpha=a;x.lineCap='round';
 for(let i=0;i<180;i++){const z=r(),sp=900+z*1300,X0=r()*W*1.3,Y0=r()*H;const y=(Y0+t*sp)%(H+200)-100;let X=(X0-t*sp*.15)%(W*1.3);if(X<0)X+=W*1.3;
  x.strokeStyle=`rgba(${BLUE},${.05+z*.2})`;x.lineWidth=.6+z*1.5;x.beginPath();x.moveTo(X,y);x.lineTo(X-12*z,y+30+70*z);x.stroke()}
 x.restore()}


// ===== song 2 =====
const VIOLET='170,130,255',RED='255,50,70',GREY='150,150,170';
function tint(t){
 const keys=[[0,[40,40,110]],[4.3,[40,40,110]],[4.9,[80,40,120]],[6.2,[80,40,120]],[6.6,[130,15,30]],[12,[130,15,30]]];
 for(let i=0;i<keys.length-1;i++){const[a,ca]=keys[i],[b,cb]=keys[i+1];if(t>=a&&t<=b){const k=easeIO((t-a)/(b-a));return ca.map((v,j)=>lerp(v,cb[j],k))}}
 return keys[keys.length-1][1];
}
function lyricLine(list,t,Y,size,{col=WARM,glowCol=ROSE,end=99,A=1,mode='wipe'}={}){
 const o=layout(list.map(w=>w[0]),size,'Ruqaa',Y);
 o.forEach((oo,i)=>{const ts=list[i][1];const k=clamp((t-ts+.06)/.45,0,1);if(k<=0)return;const nx=i<list.length-1?list[i+1][1]:end;
  if(mode==='wipe')word(oo,{a:A,k:ease(k),mode:'wipe',active:t>=ts&&t<nx,col,glowCol});
  else{const z=back((t-ts)/.5);word(oo,{a:A*clamp(z,0,1),mode:'pop',sc:.5+.5*z,blur:(1-clamp(z,0,1))*10,active:t>=ts&&t<nx,col,glowCol})}});
}

// ---- A: empty speech bubble waiting (احچي.. إذا عندك عذر)
function bubblePts(cx,cy,w,h,r){const p=[];const X=cx-w/2,Y=cy-h/2;
 const seg=(ox,oy,a0)=>{for(let i=0;i<=10;i++){const a=a0+i/10*Math.PI/2;p.push([ox+Math.cos(a)*r,oy+Math.sin(a)*r])}};
 p.push([cx,Y]);seg(X+w-r,Y+r,-Math.PI/2);seg(X+w-r,Y+h-r,0);
 p.push([cx+120,Y+h]);p.push([cx+150,Y+h+90]);p.push([cx+40,Y+h]); // tail
 seg(X+r,Y+h-r,Math.PI/2);seg(X+r,Y+r,Math.PI);p.push([cx,Y]);return p}
function sceneA(t){
 if(t>2.7)return;const A=clamp(1-(t-2.45)/.2,0,1);
 const cy=760,pts=bubblePts(540,cy,640,380,90);const d=easeIO(t/.9);
 const s=1+.02*Math.sin(t*3);
 x.save();x.translate(540,cy);x.scale(s*(1+.15*(1-A)),s*(1+.15*(1-A)));x.translate(-540,-cy);
 glow(()=>polyline(pts,d),BLUE,6,A);if(d<1)tipDot(ptAt(pts,d),BLUE,A);
 x.restore();
 // waiting dots (no reply)
 if(t>1.0){for(let i=0;i<3;i++){const b=Math.max(0,Math.sin(t*6-i*.9));x.save();x.globalAlpha=A*(.25+.75*b)*clamp((t-1)/.3,0,1);x.fillStyle=`rgb(${BLUE})`;x.shadowColor=`rgba(${BLUE},1)`;x.shadowBlur=20;
  x.beginPath();x.arc(480+i*60,cy+120-b*10,13,0,7);x.fill();x.restore()}}
 // "احچي.." inside the bubble
 const o=layout(['احچي..'],190,'Ruqaa',cy-30)[0];const z=back((t-.05)/.6);
 word(o,{a:A*clamp(z,0,1),mode:'pop',sc:.4+.6*z,active:t<1.28,glowCol:BLUE,blur:(1-clamp(z,0,1))*12});
 lyricLine([['إذا',1.28],['عندك',1.52],['عذر',2.14]],t,1230,120,{glowCol:BLUE,end:2.6,A});
}

// ---- B: ringing phone, no answer (گلتلك.. وبعد ما جاوبت)
function handset(cx,cy,S,col,a){
 const arc=[];for(let i=0;i<=40;i++){const ang=Math.PI*.8+i/40*Math.PI*.9;arc.push([cx+Math.cos(ang)*95*S,cy+Math.sin(ang)*95*S])}
 glow(()=>polyline(arc),col,24*S,a,30);
 const ends=[ptAt(arc,0),ptAt(arc,1)];
 ends.forEach(([ex,ey],i)=>{const ang=Math.atan2(ey-cy,ex-cx);x.save();x.translate(ex,ey);x.rotate(ang+Math.PI/2);
  glow(()=>{x.beginPath();x.roundRect(-46*S,-26*S,92*S,52*S,20*S)},col,8*S,a,30);x.restore()});
}
function sceneB(t){
 if(t<2.5||t>5.0)return;const A=clamp((t-2.55)/.2,0,1)*clamp(1-(t-4.35)/.45,0,1);
 const missed=ease((t-3.84)/.4);
 const ring=t<3.84;const cx=540,cy=740;
 const rot=ring?Math.sin(t*38)*.18*Math.max(0,Math.sin((t-2.4)*5)):0;
 const col=missed>0?`${lerp(138,RED.split(',')[0],missed)|0},${lerp(180,50,missed)|0},${lerp(255,70,missed)|0}`:BLUE;
 x.save();x.translate(cx,cy);x.rotate(-Math.PI/3+rot);x.translate(-cx,-cy);
 const pop=back((t-2.55)/.45);x.translate(cx,cy);x.scale(pop,pop);x.translate(-cx,-cy);
 handset(cx,cy,1.25,col,A);x.restore();
 // ring waves
 if(ring){for(let i=0;i<3;i++){const k=((t*1.6+i/3)%1);x.save();x.globalAlpha=A*(1-k)*clamp((t-2.5)/.3,0,1);x.strokeStyle=`rgba(${BLUE},1)`;x.shadowColor=`rgba(${BLUE},1)`;x.shadowBlur=20;x.lineWidth=5;x.lineCap='round';
  x.beginPath();x.arc(cx,cy,190+k*200,-Math.PI*.42,-Math.PI*.08);x.stroke();x.beginPath();x.arc(cx,cy,190+k*200,Math.PI*.58,Math.PI*.92);x.stroke();x.restore()}}
 // missed-call arrow + label
 if(missed>0){const ar=[[cx+260,cy-260],[cx+150,cy-150]];glow(()=>polyline(ar,missed),RED,5,A);
  if(missed>.6)glow(()=>{x.beginPath();x.moveTo(cx+150,cy-205);x.lineTo(cx+150,cy-150);x.lineTo(cx+205,cy-150)},RED,5,A*clamp((missed-.6)/.4,0,1));
  x.save();x.globalAlpha=A*missed;x.font='700 40px Cairo';x.textAlign='center';x.direction='rtl';x.fillStyle=`rgba(${RED},1)`;x.shadowColor=`rgba(${RED},1)`;x.shadowBlur=15;x.fillText('لم يتم الرد',cx,cy+300);x.restore()}
 lyricLine([['گلتلك..',2.68]],t,1200,140,{glowCol:BLUE,end:3.16,A});
 lyricLine([['وبعد',3.16],['ما',3.62],['جاوبت',3.84]],t,1370,120,{glowCol:missed>0?RED:BLUE,end:4.6,A});
}

// ---- C: blank stare (ظلّيت بالصفنة عليّ)
function sceneC(t){
 if(t<4.2||t>6.9)return;const A=clamp((t-4.35)/.3,0,1)*clamp(1-(t-6.3)/.35,0,1);
 const cx=540,cy=760,w=330;const d=easeIO((t-4.35)/.7);
 // blink at ~5.95
 const bl=t>5.85&&t<6.15?Math.sin((t-5.85)/.3*Math.PI):0;const open=1-bl*.95;
 const up=[],lo=[];for(let i=0;i<=60;i++){const u=i/60,X=cx-w+u*2*w,b=Math.sin(u*Math.PI);up.push([X,cy-b*170*open]);lo.push([X,cy+b*150*open])}
 glow(()=>polyline(up,d),VIOLET,6,A);glow(()=>polyline(lo,d),VIOLET,6,A);
 // lashes
 for(let i=1;i<8;i++){const u=i/8,p=ptAt(up,u),k=ease((t-4.9-i*.03)/.3);if(k<=0)continue;const ang=-Math.PI/2+(u-.5)*1.4;
  glow(()=>{x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+Math.cos(ang)*40*k,p[1]+Math.sin(ang)*40*k)},VIOLET,3,A)}
 // iris + pupil, staring (fixed, slight tremble)
 const ik=ease((t-4.8)/.5);if(ik>0&&open>.15){x.save();x.beginPath();x.moveTo(cx-w,cy);for(const p of up)x.lineTo(p[0],p[1]);for(let i=lo.length-1;i>=0;i--)x.lineTo(lo[i][0],lo[i][1]);x.clip();
  const ix=cx+Math.sin(t*23)*1.5,iy=cy+5;
  glow(()=>{x.beginPath();x.arc(ix,iy,110*ik,0,7)},VIOLET,5,A);
  const g=x.createRadialGradient(ix,iy,10,ix,iy,110);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.4,`rgba(${VIOLET},.35)`);g.addColorStop(1,`rgba(${VIOLET},.05)`);x.globalAlpha=A*ik;x.fillStyle=g;x.beginPath();x.arc(ix,iy,110*ik,0,7);x.fill();
  x.fillStyle='#050308';x.beginPath();x.arc(ix,iy,48*ik,0,7);x.fill();x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(ix+30,iy-34,14*ik,0,7);x.fill();x.restore()}
 lyricLine([['ظلّيت',4.74],['بالصفنة',5.48],['عليّ',6.30]],t,1230,124,{glowCol:VIOLET,end:6.5,A});
}

// ---- D: traitor — heart cracks & splits (خاين.. بس ما سأل فيني)
const tears=[];{const r=rng(77);for(let i=0;i<40;i++)tears.push({b:7.0+r()*2.6,dx:(r()-.5)*60,sp:200+r()*260,s:5+r()*7})}
function sceneD(t){
 if(t<6.2)return;const A=clamp((t-6.3)/.25,0,1);
 const cx=540,cy=760;const [Ls,Rs]=heartStrands(0,0,15).map(p=>shift(p,cx,cy));
 const d=ease((t-6.3)/.45);const hit=t>6.52&&t<7.0?Math.sin(t*95)*10*(1-(t-6.52)/.48):0;
 const sep=easeIO((t-7.34)/1.8);
 const col=`255,${lerp(77,40,sep)|0},${lerp(109,60,sep)|0}`;
 glow(()=>polyline(shift(Ls,-sep*120+hit,sep*70,-.3*sep,cx,cy+220),d),col,6,A*(1-.3*sep));
 glow(()=>polyline(shift(Rs,sep*120+hit,sep*90,.35*sep,cx,cy+220),d),col,6,A*(1-.3*sep));
 // crack
 const ck=ease((t-6.52)/.3);if(ck>0&&sep<.95){const top=[cx+hit,cy-5*15],bot=[cx+hit,cy+17*15];const cr=[top];const zr=rng(9);
  for(let i=1;i<8;i++)cr.push([cx+hit+(i%2?1:-1)*(12+zr()*24),lerp(top[1],bot[1],i/8)]);cr.push(bot);glow(()=>polyline(cr,ck),'255,255,255',3,A*(1-sep),20)}
 // tears falling from the break
 x.save();x.globalCompositeOperation='lighter';
 for(const tr of tears){const k=t-tr.b;if(k<0||k>2.2)continue;const yy=cy+40+k*tr.sp+k*k*120,xx=cx+tr.dx;
  x.globalAlpha=A*(1-k/2.2)*.8;x.fillStyle=`rgba(${BLUE},1)`;x.shadowColor=`rgba(${BLUE},1)`;x.shadowBlur=12;x.beginPath();
  x.moveTo(xx,yy-tr.s*2);x.quadraticCurveTo(xx+tr.s,yy,xx,yy+tr.s*.7);x.quadraticCurveTo(xx-tr.s,yy,xx,yy-tr.s*2);x.fill()}
 x.restore();
 // "خاين.." glitch hit
 const z=back((t-6.52)/.45);if(z>0){const o=layout(['خاين..'],210,'Ruqaa',cy-20)[0];const gl=t<7.3?1:Math.max(0,1-(t-7.3)/.5);
  const jx=(Math.sin(t*137)*14)*gl,jy=(Math.cos(t*91)*6)*gl;
  x.save();x.globalCompositeOperation='lighter';
  word(o,{a:A*clamp(z,0,1)*.7*gl,mode:'pop',sc:.6+.4*z,dx:jx-8,dy:jy,col:'255,0,60',glowCol:RED});
  word(o,{a:A*clamp(z,0,1)*.7*gl,mode:'pop',sc:.6+.4*z,dx:-jx+8,dy:-jy,col:'0,200,255',glowCol:BLUE});
  x.restore();
  word(o,{a:A*clamp(z,0,1)*(1-.35*sep),mode:'pop',sc:.6+.4*z,dx:jx*.3,col:'255,240,240',glowCol:RED,active:t<7.34})}
 lyricLine([['بس',7.34],['ما',7.88],['سأل',7.98],['فيني',8.5]],t,1240,124,{glowCol:RED,end:9.4,A,col:'235,225,230'});
}

function watermark(t){
 const a=clamp(t/1.2,0,1);x.save();x.globalAlpha=a*.6;x.direction='ltr';x.textAlign='center';x.textBaseline='middle';
 x.font='700 34px Cairo';x.fillStyle='#f3e9ee';x.shadowColor=`rgba(${ROSE},.9)`;x.shadowBlur=14;x.fillText(USER,540,1800);
 x.globalAlpha=a*.35;x.fillStyle=`rgb(${ROSE})`;x.shadowBlur=0;x.fillRect(540-40,1830,80,2);x.restore();
}
function vignette(){const g=x.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.8)');x.fillStyle=g;x.fillRect(0,0,W,H)}
window.render=function(t){
 const m=envAt(ENV.mix,t);
 x.save();x.filter='none';
 const zz=1.03+.01*Math.sin(t*.6)+.012*m;x.translate(W/2,H/2);x.scale(zz,zz);x.rotate(Math.sin(t*.4)*.004);x.translate(-W/2,-H/2);
 background(t,m);rainLayer(t,clamp((t-6.4)/.6,0,1)*.6);
 sceneA(t);sceneB(t);sceneC(t);sceneD(t);
 x.restore();vignette();watermark(t);
 x.save();x.globalCompositeOperation='overlay';x.fillStyle=x.createPattern(grain((t*FPS|0)+1),'repeat');x.fillRect(0,0,W,H);x.restore();
