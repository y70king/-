<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url(fonts/lalezar.ttf)}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo700.ttf)}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo900.ttf)}
@font-face{font-family:Lemonada;font-weight:700;src:url(fonts/lemonada.ttf)}
@page{size:90cm 15cm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1800px;height:300px;overflow:hidden;background:#7a0012}
:root{--red:#d1001f;--deep:#5c000e;--yel:#ffc400;--org:#ff6a00;--cream:#fff6e5}

.banner{position:relative;width:1800px;height:300px;display:flex;align-items:stretch;
  background:
   radial-gradient(ellipse 520px 260px at 62% 50%, rgba(255,90,0,.38), transparent 70%),
   radial-gradient(ellipse 420px 300px at 85% 40%, rgba(255,40,40,.35), transparent 70%),
   linear-gradient(100deg,#8e0016 0%,#c4001d 45%,#9a0018 100%);
  overflow:hidden}
/* dotted pattern */
.banner::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.09) 1.3px,transparent 1.6px);
  background-size:14px 14px}
/* top & bottom checker stripes */
.edge{position:absolute;left:0;right:0;height:10px;z-index:3;
  background:repeating-linear-gradient(90deg,var(--yel) 0 20px,var(--deep) 20px 40px)}
.edge.t{top:0}.edge.b{bottom:0}

/* ---------- BRAND ---------- */
.brand{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:18px;padding:0 34px 0 10px}
.emblem{width:180px;height:180px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.names{display:flex;flex-direction:column;align-items:center;line-height:1}
.tag{font:900 30px Cairo;color:var(--deep);background:var(--yel);padding:0 26px 4px;border-radius:40px;
  transform:rotate(-3deg);box-shadow:0 4px 0 var(--deep)}
.logo{font:104px/1.15 Lalezar;color:var(--yel);margin-top:2px;white-space:nowrap;
  background:linear-gradient(180deg,#fff3a6 0%,#ffd000 45%,#ff9500 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 5px 0 var(--deep)) drop-shadow(0 0 1px var(--deep))}
.logo .and{font-size:74px}
.sub{font:700 25px Lemonada;color:#fff;margin-top:-4px;letter-spacing:.5px;text-shadow:2px 2px 0 var(--deep)}

/* ---------- divider ---------- */
.div{position:relative;z-index:2;width:28px;flex:none;
  background:
    linear-gradient(135deg,transparent 50%,var(--yel) 50%) 0 0/28px 28px,
    linear-gradient(45deg,var(--yel) 50%,transparent 50%) 0 14px/28px 28px;
  -webkit-mask:linear-gradient(90deg,transparent 0 9px,#000 9px 19px,transparent 19px);
  opacity:.95}

/* ---------- MENU ---------- */
.menu{position:relative;z-index:2;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 18px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.head span{font:44px/1 Lalezar;color:#fff;text-shadow:3px 3px 0 var(--deep)}
.head i{display:block;width:90px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--yel))}
.head i:last-child{background:linear-gradient(270deg,transparent,var(--yel))}
.grid{display:grid;grid-template-columns:repeat(7,auto);gap:13px 10px;justify-content:center}
.chip{font:31px/1 Lalezar;padding:11px 15px 13px;border-radius:16px;text-align:center;white-space:nowrap;
  background:var(--cream);color:var(--red);box-shadow:0 5px 0 var(--deep),0 8px 14px rgba(0,0,0,.25);
  position:relative}
.chip:nth-child(odd){background:var(--yel);color:var(--deep)}
.chip::after{content:"";position:absolute;top:7px;left:8px;width:7px;height:7px;border-radius:50%;background:var(--org)}

/* ---------- CONTACT ---------- */
.contact{position:relative;z-index:2;width:450px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
  padding-right:66px;padding-left:10px;
  background:linear-gradient(160deg,#ffd31a,#ffb000 60%,#ff8a00);
  clip-path:polygon(0 0,100% 0,calc(100% - 70px) 100%,0 100%)}
.contact::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(-55deg,rgba(255,255,255,.14) 0 14px,transparent 14px 34px)}
.cinner{position:relative;display:flex;flex-direction:column;align-items:center}
.scooter{width:150px;height:96px;margin-bottom:-4px}
.deliv{font:46px/1.1 Lalezar;color:var(--red);text-shadow:2px 2px 0 #fff}
.phone{margin-top:8px;display:flex;align-items:center;gap:12px;direction:ltr;
  background:var(--deep);color:#fff;border-radius:60px;padding:6px 24px 9px 8px;box-shadow:0 6px 0 #2b0006}
.phone .ic{width:48px;height:48px;border-radius:50%;background:var(--red);display:grid;place-items:center;border:3px solid var(--yel)}
.phone b{font:900 40px/1 Cairo;letter-spacing:1px}
</style>
</head>
<body>
<div class="banner">
  <div class="edge t"></div><div class="edge b"></div>

  <!-- BRAND (right side) -->
  <div class="brand">
    <svg class="emblem" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="g1" cx="40%" cy="35%"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff9a00"/></radialGradient>
        <linearGradient id="alm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3a15b"/><stop offset="1" stop-color="#8a4a17"/></linearGradient>
      </defs>
      <circle cx="100" cy="100" r="96" fill="#5c000e"/>
      <circle cx="100" cy="100" r="88" fill="url(#g1)"/>
      <circle cx="100" cy="100" r="76" fill="none" stroke="#5c000e" stroke-width="3" stroke-dasharray="6 7"/>
      <!-- sugar cubes -->
      <g transform="translate(96 92) rotate(-12)">
        <path d="M0 0 l30 -12 l30 12 l-30 12z" fill="#ffffff"/>
        <path d="M0 0 v34 l30 12 v-34z" fill="#f1e6d6"/>
        <path d="M60 0 v34 l-30 12 v-34z" fill="#d9cbb6"/>
        <g fill="#c9b79c" opacity=".6"><circle cx="12" cy="18" r="1.6"/><circle cx="20" cy="30" r="1.4"/><circle cx="44" cy="20" r="1.5"/><circle cx="50" cy="32" r="1.3"/><circle cx="30" cy="-1" r="1.4"/></g>
      </g>
      <!-- almonds -->
      <g transform="translate(70 92) rotate(-30)">
        <path d="M0 -38 C22 -22 22 22 0 38 C-22 22 -22 -22 0 -38z" fill="url(#alm)" stroke="#5c000e" stroke-width="3"/>
        <path d="M0 -26 C8 -10 8 10 0 26" stroke="#f5c88a" stroke-width="2.5" fill="none" opacity=".7"/>
      </g>
      <g transform="translate(112 140) rotate(55) scale(.72)">
        <path d="M0 -38 C22 -22 22 22 0 38 C-22 22 -22 -22 0 -38z" fill="url(#alm)" stroke="#5c000e" stroke-width="3.5"/>
        <path d="M0 -26 C8 -10 8 10 0 26" stroke="#f5c88a" stroke-width="3" fill="none" opacity=".7"/>
      </g>
      <!-- sparkles -->
      <g fill="#fff"><path d="M150 52 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/><path d="M48 150 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/></g>
    </svg>
    <div class="names">
      <div class="tag">مأكولات</div>
      <div class="logo">لوز <span class="and">و</span> سكر</div>
      <div class="sub">للوجبات السريعة</div>
    </div>
  </div>

  <div class="div"></div>

  <!-- MENU -->
  <div class="menu">
    <div class="head"><i></i><span>أشهى الوجبات السريعة</span><i></i></div>
    <div class="grid">
      <div class="chip">شاورما</div><div class="chip">فنكر</div><div class="chip">بركر</div>
      <div class="chip">بيتزا</div><div class="chip">ستيك</div><div class="chip">ريزو</div>
      <div class="chip">زنكر</div>
      <div class="chip">سكالوب</div><div class="chip">كرسبي</div><div class="chip">صاج</div>
      <div class="chip">إيطالي</div><div class="chip">مناقيش</div><div class="chip">مقبلات</div>
      <div class="chip">مشروبات</div>
    </div>
  </div>

  <!-- CONTACT (left side) -->
  <div class="contact">
    <div class="cinner">
      <svg class="scooter" viewBox="0 0 150 96">
        <g stroke="#5c000e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <!-- speed lines -->
          <path d="M128 30h18M132 44h14M126 58h20" stroke="#d1001f" fill="none"/>
          <!-- delivery box -->
          <rect x="74" y="16" width="40" height="34" rx="5" fill="#d1001f"/>
          <path d="M80 30h28" stroke="#ffc400"/>
          <!-- body -->
          <path d="M20 64 C24 46 44 44 58 52 L92 52 C104 52 112 58 114 68 L58 70 Z" fill="#d1001f"/>
          <path d="M26 64 L16 26 h-10" fill="none"/>
          <path d="M10 22 h12" />
          <!-- wheels -->
          <circle cx="28" cy="74" r="14" fill="#fff6e5"/><circle cx="28" cy="74" r="5" fill="#5c000e"/>
          <circle cx="104" cy="74" r="14" fill="#fff6e5"/><circle cx="104" cy="74" r="5" fill="#5c000e"/>
        </g>
      </svg>
      <div class="deliv">للجلب والتوصيل</div>
      <div class="phone">
        <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div>
        <b>07849690565</b>
      </div>
    </div>
  </div>
</div>
</body>
</html>
