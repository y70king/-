<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المساعد المدرسي</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#1c2733; --muted:#5f6b7a; --line:#d9dee5;
  --brand:#1B4F72; --brand2:#2E86C1; --ok:#1e8449; --bad:#c0392b; --warn:#b9770e;
  --sel:#fff3b0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 10px;font-size:15px;min-width:220px}
header input::placeholder{color:#dfe8ef}
header .sp{flex:1}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;flex-wrap:wrap}
nav button{border:0;background:none;padding:12px 18px;font-size:15px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-family:inherit}
nav button.on{color:var(--brand);border-bottom-color:var(--brand2);font-weight:600}
main{padding:18px;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:17px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--brand2);background:var(--brand2);color:#fff;border-radius:7px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:var(--brand2)}
.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.big{padding:10px 22px;font-size:16px;background:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
input[type=number]{width:80px}
table.list{border-collapse:collapse;width:100%}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}
table.list th{background:#f7f9fb;font-weight:600;color:var(--muted);font-size:13px}
table.list tr.on td{background:#eaf7ee}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--bad)} .ok{color:var(--ok)} .wrn{color:var(--warn)}
.tag{display:inline-block;background:#eef3f8;border-radius:5px;padding:1px 7px;margin:2px;font-size:12px}
/* dialog */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.dlg{background:#fff;border-radius:12px;padding:18px;width:min(860px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 14px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
/* timetable */
.ttwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:72vh}
table.tt{border-collapse:collapse;font-size:12.5px}
table.tt th,table.tt td{border:1px solid #b8c2cc;padding:3px 4px;text-align:center;min-width:74px}
table.tt th{background:#e9eef3;position:sticky;top:0;z-index:2}
table.tt thead tr:nth-child(2) th{top:27px}
table.tt th.cl,table.tt td.cl{position:sticky;right:0;z-index:3;background:#f7f9fb;min-width:110px;font-weight:600}
table.tt td.cell{cursor:pointer;height:44px}
table.tt td.cell .s{font-weight:600}
table.tt td.cell .t{font-size:11px;color:#3b4652}
table.tt td.cell.picked{outline:3px solid #e67e22;outline-offset:-3px}
table.tt .dstart{border-right:3px solid #34495e}
table.tt td.empty{color:#aab}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263544;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;max-width:90vw}
.toast.bad{background:var(--bad)}
table.ab{border-collapse:collapse;font-size:13px}
table.ab th,table.ab td{border:1px solid #b8c2cc;padding:0;text-align:center;height:28px}
table.ab th{background:#e9eef3;position:sticky;top:0;z-index:2;font-size:12px;padding:2px}
table.ab td.nm,table.ab th.nm{position:sticky;right:0;background:#f7f9fb;z-index:3;text-align:right;padding:0 8px;min-width:190px;white-space:nowrap}
table.ab th.nm{z-index:4}
table.ab td.d{width:30px;min-width:30px;cursor:pointer;font-weight:700;user-select:none}
table.ab td.d:hover{outline:2px solid var(--brand2);outline-offset:-2px}
table.ab .we{background:#FAD7A0}
table.ab .hol{background:#F9E79F}
table.ab th.d{cursor:pointer;min-width:30px}
table.ab .g{color:#c0392b} table.ab .m{color:#1e8449} table.ab .l{color:#7d3c98}
table.ab td.sum{min-width:44px;padding:0 4px;background:#fbfcfd}
table.ab tr.alert1 td.nm{background:#FCF3CF} table.ab tr.alert2 td.nm{background:#FADBD8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🏫 المساعد المدرسي</h1>
  <input id="schoolName" type="text" placeholder="اسم المدرسة">
  <span class="sp"></span>
  <button class="btn sec" id="btnBackup" style="background:transparent;color:#fff;border-color:#fff">💾 حفظ نسخة احتياطية</button>
  <button class="btn sec" id="btnRestore" style="background:transparent;color:#fff;border-color:#fff">📂 استرجاع نسخة</button>
  <input type="file" id="fileRestore" accept=".json" hidden>
</header>
<nav id="nav">
  <button data-p="days" class="on">١. الأيام والحصص</button>
  <button data-p="teachers">٢. المدرسون</button>
  <button data-p="classes">٣. الصفوف والمواد</button>
  <button data-p="table">٤. الجدول</button>
  <button data-p="absence">٥. سجل الغياب</button>
</nav>
<main id="main"></main>

<script>
"use strict";
/* ================= البيانات ================= */
const KEY = "school_assistant_v1";
const LETTERS = ["أ","ب","ج","د","هـ","و","ز","ح","ط","ي","ك","ل"];
const DEFAULT_SUBJECTS = ["التربية الإسلامية","اللغة العربية","اللغة الإنكليزية","الرياضيات","العلوم","الكيمياء","الفيزياء","الأحياء","الاجتماعيات","التاريخ","الجغرافية","الاقتصاد","الحاسوب","التربية الفنية","التربية الرياضية"];
const COLORS = ["#D6EAF8","#D5F5E3","#FCF3CF","#FADBD8","#E8DAEF","#FDEBD0","#D1F2EB","#F2F3F4","#EBDEF0","#D4E6F1","#F9E79F","#ABEBC6"];

function defaultData(){
  return {
    school:"",
    days:[
      {name:"السبت",on:false,periods:6},{name:"الأحد",on:true,periods:6},{name:"الاثنين",on:true,periods:6},
      {name:"الثلاثاء",on:true,periods:6},{name:"الأربعاء",on:true,periods:6},{name:"الخميس",on:true,periods:6}
    ],
    subjects:DEFAULT_SUBJECTS.slice(),
    teachers:[], classes:[], schedule:null, nextId:1
  };
}
let D;
try{ D = JSON.parse(localStorage.getItem(KEY)) || defaultData(); }catch(e){ D = defaultData(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }
function uid(){ return D.nextId++; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
const teacherById = id => D.teachers.find(t => t.id === id);
const tName = id => (teacherById(id) || {}).name || "";
const className = c => c.grade + (c.section ? " - " + c.section : "");

function slots(){
  const out = [];
  D.days.forEach((d, di) => { if(d.on) for(let p = 0; p < d.periods; p++) out.push({d:di, p, key:di + ":" + p}); });
  return out;
}
function activeDays(){ return D.days.map((d,i)=>({...d,i})).filter(d => d.on); }
function gradeColor(grade){
  const grades = [...new Set(D.classes.map(c => c.grade))];
  return COLORS[Math.max(0, grades.indexOf(grade)) % COLORS.length];
}

function toast(msg, bad){
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2600);
}

/* ============ توزيع الحصص التلقائية ============ */
// يرجع لكل صف قائمة الحصص الفعلية [{subject, teacherId, n}]
function resolvePeriods(){
  const S = slots().length;
  const res = {};
  for(const c of D.classes){
    const fixed = c.items.filter(i => i.periods != null).reduce((a,i) => a + i.periods, 0);
    const autos = c.items.filter(i => i.periods == null);
    let rem = Math.max(0, S - fixed);
    res[c.id] = c.items.map(i => ({subject:i.subject, teacherId:i.teacherId, n:i.periods ?? 0, auto:i.periods == null}));
    if(autos.length){
      const base = Math.floor(rem / autos.length); let extra = rem % autos.length;
      for(const r of res[c.id]) if(r.auto){ r.n = base + (extra > 0 ? 1 : 0); if(extra > 0) extra--; }
    }
  }
  // لا يتجاوز نصاب أي مدرس عدد حصص الأسبوع: نقلل من الحصص التلقائية
  for(let guard = 0; guard < 100000; guard++){
    const load = {};
    for(const id in res) for(const r of res[id]) if(r.teacherId) load[r.teacherId] = (load[r.teacherId]||0) + r.n;
    const over = Object.keys(load).find(t => load[t] > S);
    if(!over) break;
    let best = null;
    for(const id in res) for(const r of res[id]) if(r.auto && r.teacherId == over && r.n > 0 && (!best || r.n > best.n)) best = r;
    if(!best) break;
    best.n--;
  }
  return res;
}

function analyze(){
  const S = slots().length, errs = [], warns = [], fixes = [];
  if(!S) errs.push("لم تحدد أي يوم دراسي.");
  if(!D.classes.length) errs.push("لم تضف أي صف بعد.");
  const res = resolvePeriods();
  const load = {}, fixedLoad = {};
  for(const c of D.classes){
    const fixed = c.items.filter(i => i.periods != null).reduce((a,i) => a + i.periods, 0);
    if(fixed > S) errs.push(`الصف «${className(c)}»: مجموع الحصص ${fixed} أكثر من حصص الأسبوع (${S}).`);
    const total = res[c.id].reduce((a,r) => a + r.n, 0);
    if(total < S && fixed <= S) warns.push(`الصف «${className(c)}»: ${total} حصة من ${S}، ستبقى ${S-total} حصة فارغة.`);
    if(!c.items.length) warns.push(`الصف «${className(c)}» ليس له مواد.`);
    for(const i of c.items){
      if(!i.teacherId) warns.push(`مادة «${i.subject}» في «${className(c)}» بدون مدرس.`);
      else if(i.periods != null){ fixedLoad[i.teacherId] = (fixedLoad[i.teacherId]||0) + i.periods; }
    }
    for(const r of res[c.id]) if(r.teacherId) load[r.teacherId] = (load[r.teacherId]||0) + r.n;
  }
  for(const t of D.teachers){
    const f = fixedLoad[t.id] || 0;
    if(f > S){
      errs.push(`المدرس «${t.name}» نصابه ${f} حصة وهو أكثر من حصص الأسبوع (${S})، فلا يمكن وضعه بدون تعارض.`);
      // اقتراح: توزيع النصاب المسموح على مواده بالتساوي
      const its = []; D.classes.forEach(c => c.items.forEach(i => { if(i.teacherId === t.id && i.periods != null) its.push({c, i}); }));
      const base = Math.floor(S / its.length); let extra = S % its.length;
      its.forEach(x => { const n = base + (extra-- > 0 ? 1 : 0); if(n !== x.i.periods) fixes.push({c:x.c, i:x.i, n}); });
    }
  }
  return {S, errs, warns, fixes, load};
}

/* ============ إنشاء الجدول بدون تعارض ============ */
// نموذج: كل حصة = ضلع بين الصف والمدرس، ولون الضلع = موقع الحصة في الأسبوع.
// بما أن نصاب كل صف وكل مدرس ≤ حصص الأسبوع، يمكن دائماً تلوين الأضلاع بدون تعارض (نظرية كونيغ).
function shuffle(a){ for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function generate(){
  const SL = slots(), S = SL.length, res = resolvePeriods();
  const edges = []; let dummy = 0;
  for(const c of D.classes) for(const r of res[c.id]) for(let k = 0; k < r.n; k++)
    edges.push({u:"c"+c.id, v: r.teacherId ? "t"+r.teacherId : "x"+(dummy++), cid:c.id, subject:r.subject, tid:r.teacherId || null, col:-1});
  const at = {};
  const node = n => at[n] || (at[n] = new Array(S).fill(-1));
  shuffle(edges);
  edges.forEach((e, ei) => {
    const U = node(e.u), V = node(e.v);
    let a = U.indexOf(-1), b = V.indexOf(-1);
    if(a < 0 || b < 0) throw new Error("نصاب أكبر من حصص الأسبوع");
    if(V[a] !== -1){
      // مسار متناوب a/b يبدأ من v ثم نبدل اللونين عليه
      const path = []; let cur = e.v, col = a;
      while(true){
        const x = node(cur)[col]; if(x === -1) break;
        path.push(x); const ed = edges[x]; cur = ed.u === cur ? ed.v : ed.u; col = col === a ? b : a;
      }
      for(const x of path){ const ed = edges[x]; node(ed.u)[ed.col] = -1; node(ed.v)[ed.col] = -1; }
      for(const x of path){ const ed = edges[x]; ed.col = ed.col === a ? b : a; node(ed.u)[ed.col] = x; node(ed.v)[ed.col] = x; }
    }
    e.col = a; U[a] = ei; V[a] = ei;
  });
  // جدول مبدئي
  const sch = {}; const tBusy = {};
  for(const c of D.classes) sch[c.id] = new Array(S).fill(null);
  for(const e of edges){ sch[e.cid][e.col] = {subject:e.subject, tid:e.tid}; if(e.tid){ (tBusy[e.tid] ||= new Array(S).fill(null))[e.col] = e.cid; } }
  improve(sch, tBusy, SL);
  const out = {};
  for(const cid in sch){ out[cid] = {}; sch[cid].forEach((v, s) => { if(v) out[cid][SL[s].key] = v; }); }
  return out;
}

// تحسين: توزيع المادة على أيام مختلفة قدر الإمكان، مع الحفاظ على عدم التعارض
function improve(sch, tBusy, SL){
  const S = SL.length, cids = Object.keys(sch);
  const dayCost = (cid, d) => {
    const cnt = {}; let c = 0;
    for(let s = 0; s < S; s++) if(SL[s].d === d && sch[cid][s]){ const k = sch[cid][s].subject; cnt[k] = (cnt[k]||0) + 1; if(cnt[k] > 1) c += cnt[k]*cnt[k]; }
    return c;
  };
  const canMove = (L, cid, from, to) => !L || !L.tid || tBusy[L.tid][to] === null || tBusy[L.tid][to] == cid || tBusy[L.tid][to] === undefined;
  const iters = Math.min(200000, 4000 * cids.length);
  for(let it = 0; it < iters; it++){
    const cid = cids[Math.floor(Math.random()*cids.length)];
    const s1 = Math.floor(Math.random()*S), s2 = Math.floor(Math.random()*S);
    if(s1 === s2 || SL[s1].d === SL[s2].d) continue;
    const A = sch[cid][s1], B = sch[cid][s2];
    if(!A && !B) continue;
    if(A && A.tid && tBusy[A.tid][s2] !== null && tBusy[A.tid][s2] != cid) continue;
    if(B && B.tid && tBusy[B.tid][s1] !== null && tBusy[B.tid][s1] != cid) continue;
    const before = dayCost(cid, SL[s1].d) + dayCost(cid, SL[s2].d);
    sch[cid][s1] = B; sch[cid][s2] = A;
    const after = dayCost(cid, SL[s1].d) + dayCost(cid, SL[s2].d);
    if(after <= before){
      if(A && A.tid){ tBusy[A.tid][s1] = null; }
      if(B && B.tid){ tBusy[B.tid][s2] = null; }
      if(A && A.tid) tBusy[A.tid][s2] = cid;
      if(B && B.tid) tBusy[B.tid][s1] = cid;
    } else { sch[cid][s1] = A; sch[cid][s2] = B; }
  }
}

function countConflicts(schedule){
  let n = 0;
  for(const s of slots()){
    const seen = {};
    for(const c of D.classes){ const L = schedule[c.id]?.[s.key]; if(L && L.tid){ if(seen[L.tid]) n++; seen[L.tid] = 1; } }
  }
  return n;
}

/* ================= الواجهة ================= */
let page = "days";
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  page = b.dataset.p; document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b)); render();
});
$("#schoolName").value = D.school;
$("#schoolName").addEventListener("input", e => { D.school = e.target.value; save(); });

function render(){
  const m = $("#main");
  ({days:renderDays, teachers:renderTeachers, classes:renderClasses, table:renderTable, absence:renderAbsence})[page](m);
}

/* ---- الأيام ---- */
function renderDays(m){
  const total = slots().length;
  m.innerHTML = `<div class="panel"><h2>الأيام الدراسية وعدد الحصص</h2>
    <table class="list" style="max-width:560px"><tr><th>اليوم</th><th>دوام</th><th>عدد الحصص</th></tr>
    ${D.days.map((d,i) => `<tr><td>${d.name}</td><td><input type="checkbox" data-on="${i}" ${d.on?"checked":""}></td>
      <td><input type="number" min="1" max="10" data-p="${i}" value="${d.periods}" ${d.on?"":"disabled"}></td></tr>`).join("")}
    </table>
    <div class="row" style="margin-top:12px">نفس العدد لكل الأيام: <input type="number" id="allP" min="1" max="10" value="6"> <button class="btn sec" id="applyAll">تطبيق</button></div>
    <p>مجموع حصص الأسبوع: <b>${total}</b> حصة</p>
    <p class="muted">إذا غيّرت الأيام أو الحصص بعد إنشاء الجدول، أعد إنشاء الجدول.</p></div>`;
  m.querySelectorAll("[data-on]").forEach(x => x.onchange = () => { D.days[x.dataset.on].on = x.checked; save(); render(); });
  m.querySelectorAll("[data-p]").forEach(x => x.onchange = () => { D.days[x.dataset.p].periods = Math.max(1, Math.min(10, +x.value || 1)); save(); render(); });
  $("#applyAll").onclick = () => { const v = Math.max(1, Math.min(10, +$("#allP").value || 6)); D.days.forEach(d => d.periods = v); save(); render(); };
}

/* ---- المدرسون ---- */
function teacherLoads(){ const r = resolvePeriods(), L = {}, det = {};
  for(const c of D.classes) for(const x of r[c.id]) if(x.teacherId){ L[x.teacherId] = (L[x.teacherId]||0) + x.n; (det[x.teacherId] ||= []).push(`${x.subject} (${className(c)})`); }
  return {L, det};
}
function renderTeachers(m){
  const S = slots().length, {L, det} = teacherLoads();
  m.innerHTML = `<div class="panel"><div class="row" style="justify-content:space-between"><h2>المدرسون (${D.teachers.length})</h2>
    <button class="btn" id="addT">➕ إضافة مدرسين</button></div>
    ${D.teachers.length ? `<table class="list"><tr><th>#</th><th>الاسم</th><th>الاختصاص</th><th>النصاب الأسبوعي</th><th>يدرّس</th><th></th></tr>
    ${D.teachers.map((t,i) => `<tr><td>${i+1}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.spec||"")}</td>
      <td class="${(L[t.id]||0) > S ? "err" : ""}">${L[t.id]||0} / ${S}</td>
      <td>${(det[t.id]||[]).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</td>
      <td style="white-space:nowrap"><button class="btn sec" data-ed="${t.id}">تعديل</button> <button class="btn bad" data-del="${t.id}">حذف</button></td></tr>`).join("")}</table>`
    : `<p class="muted">لا يوجد مدرسون بعد. اضغط «إضافة مدرسين».</p>`}</div>`;
  $("#addT").onclick = addTeachersDialog;
  m.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => editTeacherDialog(+b.dataset.ed));
  m.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const t = teacherById(+b.dataset.del);
    if(!confirm(`حذف المدرس «${t.name}»؟ ستبقى مواده في الصفوف بدون مدرس.`)) return;
    D.teachers = D.teachers.filter(x => x !== t);
    D.classes.forEach(c => c.items.forEach(i => { if(i.teacherId === t.id) i.teacherId = null; }));
    D.schedule = null; save(); render();
  });
}

function classDialog(cls){
  const editing = !!cls;
  const cur = {}; (cls ? cls.items : []).forEach(i => cur[i.subject] = i);
  const teacherOpts = (subject, sel) => {
    const sorted = D.teachers.slice().sort((a,b) => ((b.spec && subject.includes(b.spec)) || (b.spec && b.spec.includes(subject)) ? 1:0) - ((a.spec && subject.includes(a.spec)) || (a.spec && a.spec.includes(subject)) ? 1:0));
    return `<option value="">— بدون مدرس —</option>` + sorted.map(t => `<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.name)}${t.spec?" ("+esc(t.spec)+")":""}</option>`).join("") + `<option value="new">+ مدرس جديد...</option>`;
  };
  const subjRow = s => { const it = cur[s]; return `<tr data-s="${esc(s)}" class="${it?"on":""}">
    <td><input type="checkbox" class="ck" ${it?"checked":""}></td><td>${esc(s)}</td>
    <td><select class="tc">${teacherOpts(s, it ? it.teacherId : null)}</select></td>
    <td><select class="pc"><option value="">تلقائي</option>${Array.from({length:12},(_,k)=>`<option ${it && it.periods===k+1?"selected":""}>${k+1}</option>`).join("")}</select></td></tr>`; };
  const others = D.classes.filter(c => c !== cls);
  const dim = dialog(`<h3>${editing ? "تعديل الصف ومواده" : "إضافة صف"}</h3>
    <div class="row">الصف: <input type="text" id="cg" value="${esc(cls?.grade||"")}" placeholder="مثلاً: الأول المتوسط" list="gl" style="min-width:200px">
      <datalist id="gl">${[...new Set(D.classes.map(c=>c.grade))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
      ${editing ? "" : `عدد الشعب: <input type="number" id="cn" min="1" max="12" value="1">`}
      <span id="secBox">الشعبة: <input type="text" id="cs" value="${esc(cls?.section ?? "أ")}" style="width:80px"></span>
      <span id="secAuto" class="muted"></span></div>
    <div class="row" style="margin:12px 0">
      <button class="btn sec" id="all">تحديد الكل</button><button class="btn sec" id="none">إلغاء التحديد</button>
      <button class="btn sec" id="newS">➕ مادة جديدة</button>
      ${others.length ? `نسخ المواد من: <select id="cp"><option value="">—</option>${others.map(c=>`<option value="${c.id}">${esc(className(c))}</option>`).join("")}</select>` : ""}
    </div>
    <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px">
    <table class="list" id="st"><tr><th style="width:40px"></th><th>المادة</th><th>المدرس</th><th>الحصص بالأسبوع</th></tr>
      ${D.subjects.map(subjRow).join("")}${Object.keys(cur).filter(s=>!D.subjects.includes(s)).map(subjRow).join("")}</table></div>
    <p class="muted" id="sum"></p>
    <div class="foot"><button class="btn" id="ok">حفظ</button><button class="btn sec" id="no">إلغاء</button></div>`);
  const S = slots().length;
  const upd = () => {
    let fixed = 0, n = 0, auto = 0;
    dim.querySelectorAll("#st tr[data-s]").forEach(tr => { const on = tr.querySelector(".ck").checked; tr.classList.toggle("on", on);
      if(on){ n++; const p = tr.querySelector(".pc").value; if(p) fixed += +p; else auto++; } });
    $("#sum", dim).innerHTML = `${n} مادة – الحصص المحددة ${fixed} من ${S}${auto ? ` – ${auto} مادة تلقائية تأخذ ${Math.max(0,S-fixed)} حصة` : ""}` + (fixed > S ? ` <b class="err">أكثر من حصص الأسبوع!</b>` : "");
    if(!editing){ const k = +$("#cn", dim).value || 1;
      $("#secBox", dim).style.display = k > 1 ? "none" : "";
      $("#secAuto", dim).textContent = k > 1 ? "الشعب: " + LETTERS.slice(0, Math.min(k,12)).join("، ") : ""; }
  };
  const wireRow = tr => {
    tr.querySelector(".ck").onchange = upd; tr.querySelector(".pc").onchange = () => { tr.querySelector(".ck").checked = true; upd(); };
    tr.querySelector(".tc").onchange = e => {
      if(e.target.value === "new"){
        const name = (prompt("اسم المدرس الجديد:") || "").trim();
        if(name){ let t = D.teachers.find(x => x.name === name); if(!t){ t = {id:uid(), name, spec:tr.dataset.s}; D.teachers.push(t); save(); }
          dim.querySelectorAll("#st tr[data-s]").forEach(r => { const v = r.querySelector(".tc").value; r.querySelector(".tc").innerHTML = teacherOpts(r.dataset.s, v === "new" ? null : +v || null); });
          e.target.value = t.id; } else e.target.value = "";
      }
      tr.querySelector(".ck").checked = true; upd();
    };
  };
  dim.querySelectorAll("#st tr[data-s]").forEach(wireRow);
  if(!editing) $("#cn", dim).oninput = upd;
  $("#all", dim).onclick = () => { dim.querySelectorAll(".ck").forEach(c => c.checked = true); upd(); };
  $("#none", dim).onclick = () => { dim.querySelectorAll(".ck").forEach(c => c.checked = false); upd(); };
  $("#newS", dim).onclick = () => {
    const s = (prompt("اسم المادة الجديدة:") || "").trim(); if(!s || dim.querySelector(`#st tr[data-s="${CSS.escape(s)}"]`)) return;
    if(!D.subjects.includes(s)){ D.subjects.push(s); save(); }
    $("#st", dim).insertAdjacentHTML("beforeend", subjRow(s)); const tr = dim.querySelector("#st tr:last-child");
    tr.querySelector(".ck").checked = true; wireRow(tr); upd();
  };
  if($("#cp", dim)) $("#cp", dim).onchange = e => {
    const src = D.classes.find(c => c.id === +e.target.value); if(!src) return;
    dim.querySelectorAll("#st tr[data-s]").forEach(tr => { const it = src.items.find(i => i.subject === tr.dataset.s);
      tr.querySelector(".ck").checked = !!it; if(it){ tr.querySelector(".tc").value = it.teacherId || ""; tr.querySelector(".pc").value = it.periods || ""; } });
    upd();
  };
  upd();
  $("#no", dim).onclick = () => dim.remove();
  $("#ok", dim).onclick = () => {
    const grade = $("#cg", dim).value.trim(); if(!grade){ toast("اكتب اسم الصف", true); return; }
    const items = [];
    dim.querySelectorAll("#st tr[data-s]").forEach(tr => { if(!tr.querySelector(".ck").checked) return;
      const tv = tr.querySelector(".tc").value, pv = tr.querySelector(".pc").value;
      items.push({subject:tr.dataset.s, teacherId: tv && tv !== "new" ? +tv : null, periods: pv ? +pv : null}); });
    if(editing){ cls.grade = grade; cls.section = $("#cs", dim).value.trim(); cls.items = items; }
    else{
      const k = Math.min(12, +$("#cn", dim).value || 1);
      const secs = k > 1 ? LETTERS.slice(0, k) : [$("#cs", dim).value.trim()];
      for(const sec of secs){
        if(D.classes.some(c => c.grade === grade && c.section === sec)){ toast(`«${grade} - ${sec}» موجود مسبقاً، تم تجاوزه`, true); continue; }
        D.classes.push({id:uid(), grade, section:sec, items:items.map(i => ({...i}))});
      }
    }
    D.schedule = null; save(); dim.remove(); render();
  };
}

function cellHTML(L, showClass){
  if(!L) return `<span class="empty">—</span>`;
  return `<div class="s">${esc(L.subject)}</div><div class="t">${esc(showClass ? L.cls : tName(L.tid))}</div>`;
}
function drawTT(){
  const area = $("#ttArea"), days = activeDays(), sch = D.schedule;
  const head = `<thead><tr><th class="cl" rowspan="2">${view.mode === "teacher" ? "المدرس" : "الصف / الشعبة"}</th>${days.map(d => `<th colspan="${d.periods}" class="dstart">${d.name}</th>`).join("")}</tr>
    <tr>${days.map(d => Array.from({length:d.periods}, (_,p) => `<th class="${p===0?"dstart":""}">${p+1}</th>`).join("")).join("")}</tr></thead>`;
  let rows = "";
  if(view.mode === "teacher"){
    const t = teacherById(view.tch); if(!t){ area.innerHTML = ""; return; }
    let n = 0;
    rows = `<tr><td class="cl">${esc(t.name)}</td>${days.map(d => Array.from({length:d.periods}, (_,p) => {
      const key = d.i + ":" + p; const c = D.classes.find(c => sch[c.id]?.[key]?.tid === t.id);
      if(c) n++;
      return `<td class="${p===0?"dstart":""}" style="${c?`background:${gradeColor(c.grade)}`:""}">${c ? cellHTML({subject:sch[c.id][key].subject, cls:className(c)}, true) : `<span class="empty">—</span>`}</td>`;
    }).join("")).join("")}</tr>`;
    area.innerHTML = `<div class="panel"><b>جدول المدرس: ${esc(t.name)}</b> – النصاب: ${n} حصة</div><div class="ttwrap"><table class="tt">${head}<tbody>${rows}</tbody></table></div>`;
    return;
  }
  const list = view.mode === "class" ? D.classes.filter(c => c.id === view.cls) : D.classes;
  rows = list.map(c => `<tr><td class="cl" style="background:${gradeColor(c.grade)}">${esc(className(c))}</td>${days.map(d => Array.from({length:d.periods}, (_,p) => {
    const key = d.i + ":" + p, L = sch[c.id]?.[key];
    const pk = picked && picked.cid === c.id && picked.key === key;
    return `<td class="cell ${p===0?"dstart":""} ${pk?"picked":""}" data-c="${c.id}" data-k="${key}" style="background:${gradeColor(c.grade)}">${cellHTML(L)}</td>`;
  }).join("")).join("")}</tr>`).join("");
  area.innerHTML = `<div class="ttwrap"><table class="tt">${head}<tbody>${rows}</tbody></table></div>`;
  area.querySelectorAll("td.cell").forEach(td => td.onclick = () => clickCell(+td.dataset.c, td.dataset.k));
}
function busyElsewhere(tid, key, cid){
  return D.classes.find(c => c.id !== cid && D.schedule[c.id]?.[key]?.tid === tid);
}
function slotLabel(key){ const [d,p] = key.split(":").map(Number); return `يوم ${D.days[d].name} الحصة ${p+1}`; }
function clickCell(cid, key){
  if(!picked || picked.cid !== cid){ picked = {cid, key}; drawTT(); return; }
  if(picked.key === key){ picked = null; drawTT(); return; }
  const sch = D.schedule[cid], A = sch[picked.key] || null, B = sch[key] || null;
  for(const [L, to] of [[A, key], [B, picked.key]]){
    if(L && L.tid){ const o = busyElsewhere(L.tid, to, cid);
      if(o){ toast(`لا يمكن التبديل: المدرس ${tName(L.tid)} عنده حصة في ${className(o)} ${slotLabel(to)}`, true); picked = null; drawTT(); return; } }
  }
  if(B) sch[picked.key] = B; else delete sch[picked.key];
  if(A) sch[key] = A; else delete sch[key];
  picked = null; save(); drawTT(); toast("تم التبديل");
}

function exportDialog(kind){
  const title = {xls:"تصدير Excel", doc:"تصدير Word", print:"طباعة / حفظ PDF"}[kind];
  const dim = dialog(`<h3>${title}</h3>
    <label><input type="radio" name="w" value="full" checked> الجدول الكامل (ورقة A3 بالعرض)</label><br>
    <label><input type="radio" name="w" value="class"> جدول صف / شعبة معينة (ورقة A4)</label>
      <select id="ec">${D.classes.map(c=>`<option value="${c.id}">${esc(className(c))}</option>`).join("")}</select><br>
    <label><input type="radio" name="w" value="teacher"> جدول مدرس معين (ورقة A4)</label>
      <select id="et">${D.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><br>
    <label><input type="radio" name="w" value="all"> كل الجداول: الكامل على A3، ثم كل صف وكل مدرس على A4</label>
    ${kind === "print" ? `<p class="muted">في نافذة الطباعة اختر «حفظ كـ PDF» إذا تريد ملف PDF.</p>` : ""}
    <div class="foot"><button class="btn" id="go">${kind === "print" ? "طباعة" : "تصدير"}</button><button class="btn sec" id="no">إلغاء</button></div>`);
  $("#no", dim).onclick = () => dim.remove();
  $("#go", dim).onclick = () => {
    const w = dim.querySelector("input[name=w]:checked").value;
    const sheets = [];
    if(w === "full" || w === "all") sheets.push({type:"full"});
    if(w === "class") sheets.push({type:"class", id:+$("#ec", dim).value});
    if(w === "teacher") sheets.push({type:"teacher", id:+$("#et", dim).value});
    if(w === "all"){ D.classes.forEach(c => sheets.push({type:"class", id:c.id})); D.teachers.forEach(t => sheets.push({type:"teacher", id:t.id})); }
    dim.remove();
    if(kind === "xls") exportExcel(sheets); else if(kind === "doc") exportWord(sheets); else printSheets(sheets);
  };
}

// يبني بيانات جدول واحد: عنوان + صفوف من الخلايا
function buildSheet(sh){
  const days = activeDays(), sch = D.schedule;
  const school = D.school || "المدرسة";
  if(sh.type === "teacher"){
    const t = teacherById(sh.id); let n = 0;
    const cells = days.map(d => Array.from({length:d.periods}, (_,p) => { const key = d.i+":"+p;
      const c = D.classes.find(c => sch[c.id]?.[key]?.tid === t.id); if(c) n++;
      return c ? {a:sch[c.id][key].subject, b:className(c), color:gradeColor(c.grade)} : null; }));
    return {name:"مدرس - " + t.name, a3:false, title:`${school} – جدول المدرس: ${t.name} (النصاب ${n} حصة)`, rowsLabel:"المدرس", days, rows:[{label:t.name, color:"#F2F3F4", cells}]};
  }
  const list = sh.type === "full" ? D.classes : D.classes.filter(c => c.id === sh.id);
  const rows = list.map(c => ({label:className(c), color:gradeColor(c.grade), cells: days.map(d => Array.from({length:d.periods}, (_,p) => {
    const L = sch[c.id]?.[d.i+":"+p]; return L ? {a:L.subject, b:tName(L.tid), color:gradeColor(c.grade)} : null; }))}));
  return sh.type === "full"
    ? {name:"الجدول الكامل", a3:true, title:`${school} – الجدول الكامل`, rowsLabel:"الصف / الشعبة", days, rows}
    : {name:"صف - " + className(list[0]), a3:false, title:`${school} – جدول ${className(list[0])}`, rowsLabel:"الصف / الشعبة", days, rows};
}

// جدول صف/مدرس على A4: الأيام صفوف والحصص أعمدة (أوضح على ورقة صغيرة)
function sheetToHTMLTable(S){
  const td = (x, cls, extra="") => `<td class="${cls}" ${extra}>${x}</td>`;
  const cell = c => c ? `<b>${esc(c.a)}</b><br><span style="font-size:${S.a3?8:10}pt">${esc(c.b)}</span>` : "";
  if(!S.a3){
    const R = S.rows[0], maxP = Math.max(...S.days.map(d => d.periods));
    let h = `<table class="x" style="width:100%"><tr><th class="h">اليوم</th>${Array.from({length:maxP},(_,p)=>`<th class="h">الحصة ${p+1}</th>`).join("")}</tr>`;
    S.days.forEach((d, di) => { h += `<tr><th class="h">${d.name}</th>${Array.from({length:maxP},(_,p)=>{ const c = R.cells[di][p];
      return td(cell(c), "c", `style="background:${c ? c.color : "#fff"};height:48pt"`); }).join("")}</tr>`; });
    return h + "</table>";
  }
  let h = `<table class="x"><tr><th class="h" rowspan="2">${S.rowsLabel}</th>${S.days.map(d=>`<th class="h dd" colspan="${d.periods}">${d.name}</th>`).join("")}</tr>
    <tr>${S.days.map(d => Array.from({length:d.periods},(_,p)=>`<th class="h ${p===0?"dd":""}">${p+1}</th>`).join("")).join("")}</tr>`;
  for(const R of S.rows){
    h += `<tr><th class="h" style="background:${R.color}">${esc(R.label)}</th>${S.days.map((d,di) => Array.from({length:d.periods},(_,p)=>{ const c = R.cells[di][p];
      return td(cell(c), "c" + (p===0?" dd":""), `style="background:${R.color}"`); }).join("")).join("")}</tr>`;
  }
  return h + "</table>";
}

// Excel (xlsx حقيقي): ألوان وحدود وحجم الورق (A3 للكامل و A4 للبقية) وكل جدول بورقة
function colName(n){ let s = ""; n++; while(n){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; }
function exportExcel(sheets){
  const fonts = [], fills = [], xfs = [], fk = {}, flk = {}, xk = {};
  const font = (b, sz) => { const k = b + "|" + sz; if(fk[k] == null){ fk[k] = fonts.length; fonts.push(`<font>${b ? "<b/>" : ""}<sz val="${sz}"/><name val="Arial"/><family val="2"/></font>`); } return fk[k]; };
  const fill = bg => { if(!bg || bg === "#FFFFFF") return 0; if(flk[bg] == null){ flk[bg] = fills.length + 2; fills.push(`<fill><patternFill patternType="solid"><fgColor rgb="FF${bg.slice(1).toUpperCase()}"/><bgColor indexed="64"/></patternFill></fill>`); } return flk[bg]; };
  const xf = (bg, bold, thick, size, noBorder) => { const k = [bg,bold,thick,size,noBorder].join("|");
    if(xk[k] == null){ xk[k] = xfs.length + 1; xfs.push(`<xf numFmtId="0" fontId="${font(bold, size)}" fillId="${fill(bg)}" borderId="${noBorder ? 0 : thick ? 2 : 1}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1" readingOrder="2"/></xf>`); }
    return xk[k]; };
  font(false, 10);
  const used = new Set();
  const sheetName = n => { let b = n.replace(/[\[\]:*?\/\\]/g, "").slice(0, 28) || "ورقة", s = b, i = 2; while(used.has(s)) s = b.slice(0,25) + " " + i++; used.add(s); return s; };
  const wsXml = [], names = [];
  for(const sh of sheets){
    const S = buildSheet(sh), rows = [], merges = []; let widths;
    const C = (v, st, num) => ({v, st, num});
    if(S.a3){
      const tot = S.days.reduce((a,d) => a + d.periods, 0); widths = [16, ...Array(tot).fill(10.5)];
      rows.push({h:26, cells:[C(S.title, xf("#FFFFFF", true, false, 14, true))]}); merges.push(`A1:${colName(tot)}1`);
      const r2 = [C(S.rowsLabel, xf("#D5DBDB", true, false, 10))], r3 = [C("", xf("#D5DBDB", true, false, 10))]; let col = 1;
      S.days.forEach(d => { r2.push(C(d.name, xf("#D5DBDB", true, true, 10))); for(let k = 1; k < d.periods; k++) r2.push(C("", xf("#D5DBDB", true, false, 10)));
        merges.push(`${colName(col)}2:${colName(col + d.periods - 1)}2`);
        for(let p = 0; p < d.periods; p++) r3.push(C(p+1, xf("#D5DBDB", true, p === 0, 10), true)); col += d.periods; });
      merges.push("A2:A3"); rows.push({cells:r2}, {cells:r3});
      for(const R of S.rows) rows.push({h:46, cells:[C(R.label, xf(R.color, true, false, 10)), ...S.days.flatMap((d,di) => Array.from({length:d.periods}, (_,p) => { const c = R.cells[di][p];
        return C(c ? c.a + "\n" + c.b : "", xf(R.color, false, p === 0, 8)); }))]});
    } else {
      const maxP = Math.max(...S.days.map(d => d.periods)); widths = [12, ...Array(maxP).fill(18)];
      rows.push({h:26, cells:[C(S.title, xf("#FFFFFF", true, false, 14, true))]}); merges.push(`A1:${colName(maxP)}1`);
      rows.push({h:20, cells:[C("اليوم", xf("#D5DBDB", true, false, 11)), ...Array.from({length:maxP}, (_,p) => C("الحصة " + (p+1), xf("#D5DBDB", true, false, 11)))]});
      S.days.forEach((d, di) => rows.push({h:48, cells:[C(d.name, xf("#D5DBDB", true, false, 11)), ...Array.from({length:maxP}, (_,p) => { const c = S.rows[0].cells[di][p];
        return C(c ? c.a + "\n" + c.b : "", xf(c ? c.color : "#FFFFFF", false, false, 11)); })]}));
    }
    const sd = rows.map((r, ri) => `<row r="${ri+1}"${r.h ? ` ht="${r.h}" customHeight="1"` : ""}>${r.cells.map((c, ci) => { const ref = colName(ci) + (ri+1);
      return c.num ? `<c r="${ref}" s="${c.st}"><v>${c.v}</v></c>` : `<c r="${ref}" s="${c.st}" t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`; }).join("")}</row>`).join("");
    names.push(sheetName(S.name));
    wsXml.push(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>
<cols>${widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>
<sheetData>${sd}</sheetData><mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join("")}</mergeCells>
<printOptions horizontalCentered="1"/><pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0" footer="0"/>
<pageSetup paperSize="${S.a3 ? 8 : 9}" orientation="landscape" fitToWidth="1" fitToHeight="1"/></worksheet>`);
  }
  const bThin = `<left style="thin"><color rgb="FF555555"/></left><right style="thin"><color rgb="FF555555"/></right><top style="thin"><color rgb="FF555555"/></top><bottom style="thin"><color rgb="FF555555"/></bottom><diagonal/>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="${fonts.length}">${fonts.join("")}</fonts>
<fills count="${fills.length + 2}"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fills.join("")}</fills>
<borders count="3"><border><left/><right/><top/><bottom/><diagonal/></border><border>${bThin}</border><border>${bThin.replace('<right style="thin"><color rgb="FF555555"/></right>', '<right style="thick"><color rgb="FF000000"/></right>')}</border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length + 1}"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xfs.join("")}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${wsXml.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${names.map((n, i) => `<sheet name="${xe(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${names.map((_, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${names.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", styles],
    ...wsXml.map((x, i) => [`xl/worksheets/sheet${i+1}.xml`, x])
  ];
  saveBlob(zip(files, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"), fileBase() + ".xlsx");
  toast("تم التصدير إلى Excel");
}

function stuStats(cid, sid, filter){
  const mk = marksOf(cid, sid); let g = 0, m = 0, l = 0;

}

function drawAbsence(){

  for(let d = 1; d <= mo.days; d++){ const k = dkey(mo.y, mo.m, d), we = isWeekend(mo.y, mo.m, d), ho = D.att.holidays[k];
    h += `<th class="d ${we?"we":""} ${ho?"hol":""}" data-h="${k}" title="${WDAYS[new Date(mo.y,mo.m,d).getDay()]}${ho?" – عطلة":""}">${d}<br><span style="font-weight:400;font-size:10px">${WSHORT[new Date(mo.y,mo.m,d).getDay()]}</span></th>`; }

  st.forEach((s, i) => {

    h += `<tr class="${stt.lvl ? "alert"+stt.lvl : ""}"><td>${i+1}</td><td class="nm">${esc(s.name)}</td>`;

    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
