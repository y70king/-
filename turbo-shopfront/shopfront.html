<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>واجهة محل تيربو</title>
<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000;}
@font-face{font-family:Reem;src:url(fonts/ReemKufi.ttf);font-weight:400 700;}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =====================================================================
//  «مطبعة ألوان» — deterministic motion-graphics engine.
//  render(t) draws the frame at time t (seconds). Logical canvas 1080x1920,
//  rendered at S× (S=2 → 2160x3840 / 4K UHD vertical).
// =====================================================================
const W = 1920, H = 1080;
const S = +(new URLSearchParams(location.search).get('s') || 2);
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
cv.style.width = (W * S) + 'px'; cv.style.height = (H * S) + 'px';
const ctx = cv.getContext('2d');
const DURATION = 89.5;

// ---------- palette ----------
const C = '#00AEEF', M = '#EC008C', Y = '#FFE11A', K = '#1a1c24';
const VIO = '#6C4DFF', NAVY = '#060814', INK = '#0b0e1c', PAPER = '#f5f4f0';
const CMYK = [C, M, Y, K];

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo3 = t => 1 - Math.pow(1 - t, 3);
const ei3 = t => t * t * t;
const eo5 = t => 1 - Math.pow(1 - t, 5);
const eoE = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eiE = t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
const eioE = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const eoB = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const eoEl = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1;
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hx(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgba(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixc(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// CA = colour amount for products (0 = grey mock-up, 1 = full colour)
let CA = 1;
function col(h, a = 1) {
  const c = hx(h); const l = .3 * c[0] + .59 * c[1] + .11 * c[2];
  const g = 62 + l * .44;
  return `rgba(${lerp(g, c[0], CA) | 0},${lerp(g, c[1], CA) | 0},${lerp(g, c[2], CA) | 0},${a})`;
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(x, y, r, c, a) {
  r = Math.max(r, .01);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  const cc = typeof c === 'string' ? hx(c) : c;
  g.addColorStop(0, rgba(cc, a)); g.addColorStop(.4, rgba(cc, a * .35)); g.addColorStop(1, rgba(cc, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function softShadow(x, y, rx, ry, a = .45) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore();
}
function font(size, weight = 800, fam = 'Cairo') { return `${weight} ${size}px ${fam}`; }
function txt(s, x, y, size, weight, fill, align = 'center', fam = 'Cairo') {
  ctx.font = font(size, weight, fam); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.direction = 'rtl'; ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function bars(x, y, ws, gap, h, c) { ctx.fillStyle = c; ws.forEach((w, i) => { rr(x - w, y + i * gap, w, h, h / 2); ctx.fill(); }); }

// Ink-drop brand mark (four CMYK quadrants)
function dropPath(r) {
  ctx.beginPath();
  ctx.moveTo(0, -1.55 * r);
  ctx.bezierCurveTo(.48 * r, -.95 * r, r, -.42 * r, r, .15 * r);
  ctx.arc(0, .15 * r, r, 0, Math.PI, false);
  ctx.bezierCurveTo(-r, -.42 * r, -.48 * r, -.95 * r, 0, -1.55 * r);
  ctx.closePath();
}
function drawMark(r, rot = 0, opts = {}) {
  ctx.save();
  dropPath(r); ctx.save(); ctx.clip();
  const cg = ctx.createConicGradient(-Math.PI / 2 + rot, 0, .15 * r);
  const cs = [col(C), col(M), col(Y), col('#23252f')];
  for (let i = 0; i < 4; i++) { cg.addColorStop(i / 4, cs[i]); cg.addColorStop((i + 1) / 4 - .0001, cs[i]); }
  ctx.fillStyle = cg; ctx.fillRect(-2 * r, -2 * r, 4 * r, 4 * r);
  // separators
  ctx.strokeStyle = opts.sep || 'rgba(255,255,255,.95)'; ctx.lineWidth = r * .07;
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + rot + i * TAU / 4;
    ctx.beginPath(); ctx.moveTo(0, .15 * r); ctx.lineTo(Math.cos(a) * 3 * r, .15 * r + Math.sin(a) * 3 * r); ctx.stroke();
  }
  // gloss
  const gg = ctx.createLinearGradient(-r, -1.5 * r, r, r);
  gg.addColorStop(0, 'rgba(255,255,255,.45)'); gg.addColorStop(.45, 'rgba(255,255,255,0)');
  gg.addColorStop(1, 'rgba(0,0,0,.25)');
  ctx.fillStyle = gg; ctx.fillRect(-2 * r, -2 * r, 4 * r, 4 * r);
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(-.42 * r, -.25 * r, .13 * r, .3 * r, .5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

let grainCv, halftoneCv;
function buildGrain() {
  grainCv = document.createElement('canvas'); grainCv.width = 540; grainCv.height = 960;
  const g = grainCv.getContext('2d'); const id = g.createImageData(540, 960); const r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
function buildHalftone() {
  halftoneCv = document.createElement('canvas'); halftoneCv.width = W * S; halftoneCv.height = H * S;
  const g = halftoneCv.getContext('2d'); g.scale(S, S);
  const step = 22; g.fillStyle = '#fff';
  for (let y = 0; y < H + step; y += step) for (let x = 0; x < W + step; x += step) {
    const ox = (Math.floor(y / step) % 2) * step / 2;
    const d = Math.hypot(x + ox - W * .5, y - H * .45) / 1100;
    const r = clamp(1 - d) * 4.2 + .6;
    g.beginPath(); g.arc(x + ox, y, r, 0, TAU); g.fill();
  }
}
function halftoneOverlay(a, ox = 0, oy = 0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.setTransform(1, 0, 0, 1, ox * S, oy * S); ctx.drawImage(halftoneCv, 0, 0); ctx.restore(); }
function overlays(t) {
  // paper grain
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  const f = Math.floor(t * 24), ox = (f * 137) % 400, oy = (f * 251) % 700;
  ctx.drawImage(grainCv, ox / 2, oy / 2, 540 - ox / 2, 960 - oy / 2, 0, 0, cv.width * (1 - ox / 1080), cv.height * (1 - oy / 1920));
  ctx.drawImage(grainCv, 0, 0, 540, 960, 0, 0, cv.width, cv.height);
  ctx.restore();
  // vignette
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  const g = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function flash(a, c = '#ffffff') { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); ctx.restore(); }

function speedLines(a, seed = 77) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; const r = rng(seed);
  for (let i = 0; i < 60; i++) { const an = r() * TAU, r0 = 200 + r() * 300; ctx.strokeStyle = rgba(hx(CMYK[i % 3]), .6); ctx.lineWidth = 2 + r() * 4; ctx.beginPath(); ctx.moveTo(540 + Math.cos(an) * r0, 960 + Math.sin(an) * r0); ctx.lineTo(540 + Math.cos(an) * (r0 + 900 * a), 960 + Math.sin(an) * (r0 + 900 * a)); ctx.stroke(); }
  ctx.restore();
}

function icon(kind, s = 1, col1 = '#ffffff', col2 = '#ffd23f') {
  ctx.save(); ctx.scale(s, s); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const F = c => { ctx.fillStyle = c; ctx.fill(); };
  switch (kind) {
    case 'food':
      ctx.beginPath(); ctx.moveTo(-80, -10); ctx.quadraticCurveTo(-80, -80, 0, -80); ctx.quadraticCurveTo(80, -80, 80, -10); ctx.closePath(); F('#f4a442');
      ctx.fillStyle = '#fff3d6'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(-45 + i * 18, -50 + (i % 2) * 10, 4, 2.5, .3, 0, TAU); ctx.fill(); }
      ctx.beginPath(); for (let i = 0; i <= 8; i++) ctx.lineTo(-86 + i * 21.5, -6 + (i % 2) * 12); ctx.lineTo(86, 8); ctx.lineTo(-86, 8); F('#4cd964');
      rr(-82, 6, 164, 30, 14); F('#6b3a22');
      ctx.beginPath(); ctx.moveTo(-82, 8); ctx.lineTo(82, 8); ctx.lineTo(60, 24); ctx.lineTo(-60, 24); F('#ffd23f');
      rr(-80, 36, 160, 34, 16); F('#f4a442'); break;
    case 'phone':
      rr(-55, -95, 110, 190, 20); F('#1b1f2e'); rr(-47, -82, 94, 160, 10);
      { const g = ctx.createLinearGradient(0, -82, 0, 78); g.addColorStop(0, col1); g.addColorStop(1, col2); ctx.fillStyle = g; ctx.fill(); }
      rr(-14, -91, 28, 6, 3); F('#000'); ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); F('rgba(255,255,255,.85)');
      ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(10, 0); ctx.lineTo(-6, 9); F(col2); break;
    case 'shirt':
      ctx.beginPath(); ctx.moveTo(-30, -80); ctx.quadraticCurveTo(0, -60, 30, -80); ctx.lineTo(90, -50); ctx.lineTo(70, -10); ctx.lineTo(50, -20); ctx.lineTo(50, 80); ctx.lineTo(-50, 80); ctx.lineTo(-50, -20); ctx.lineTo(-70, -10); ctx.lineTo(-90, -50); ctx.closePath(); F(col1);
      ctx.beginPath(); ctx.moveTo(-30, -80); ctx.quadraticCurveTo(0, -50, 30, -80); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke(); break;
    case 'scissors':
      ctx.lineWidth = 12; ctx.strokeStyle = col1;
      ctx.beginPath(); ctx.arc(-34, 50, 24, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(34, 50, 24, 0, TAU); ctx.stroke();
      ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(-20, 30); ctx.lineTo(40, -85); ctx.moveTo(20, 30); ctx.lineTo(-40, -85); ctx.strokeStyle = '#e9edf5'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -6, 7, 0, TAU); F(col2); break;
    case 'bread':
      ctx.beginPath(); ctx.ellipse(0, 10, 95, 55, 0, 0, TAU); F('#d98b3a'); ctx.beginPath(); ctx.ellipse(0, -2, 88, 46, 0, 0, TAU); F('#f2b45c');
      ctx.strokeStyle = '#c2702a'; ctx.lineWidth = 7; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 38 - 14, -26); ctx.quadraticCurveTo(i * 38, -6, i * 38 + 14, 16); ctx.stroke(); } break;
    case 'building':
      rr(-60, -95, 120, 190, 6); F(col1); ctx.fillStyle = 'rgba(10,14,30,.55)';
      for (let r = 0; r < 6; r++) for (let c = 0; c < 3; c++) { rr(-44 + c * 32, -80 + r * 26, 22, 16, 3); ctx.fill(); }
      rr(-16, 60, 32, 35, 4); F(col2); break;
    case 'home':
      ctx.beginPath(); ctx.moveTo(-85, -5); ctx.lineTo(0, -85); ctx.lineTo(85, -5); ctx.lineTo(65, -5); ctx.lineTo(65, 80); ctx.lineTo(-65, 80); ctx.lineTo(-65, -5); ctx.closePath(); F(col1);
      ctx.beginPath(); ctx.moveTo(0, 50); ctx.bezierCurveTo(-40, 20, -30, -15, 0, 5); ctx.bezierCurveTo(30, -15, 40, 20, 0, 50); F(col2); break;
    case 'cart':
      ctx.lineWidth = 12; ctx.strokeStyle = col1; ctx.beginPath(); ctx.moveTo(-95, -70); ctx.lineTo(-70, -70); ctx.lineTo(-45, 40); ctx.lineTo(70, 40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-62, -40); ctx.lineTo(90, -40); ctx.lineTo(75, 15); ctx.lineTo(-50, 15); ctx.closePath(); F(col2);
      ctx.beginPath(); ctx.arc(-30, 70, 14, 0, TAU); ctx.arc(55, 70, 14, 0, TAU); F(col1); break;
    case 'bulb':
      ctx.beginPath(); ctx.arc(0, -25, 62, Math.PI * .8, Math.PI * .2); ctx.lineTo(24, 45); ctx.lineTo(-24, 45); ctx.closePath(); F(col2);
      rr(-26, 48, 52, 14, 5); F('#a9b0c2'); rr(-22, 64, 44, 12, 5); F('#8a91a6');
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(-6, -30, 34, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke(); break;
    case 'note':
      ctx.fillStyle = col1; ctx.beginPath(); ctx.ellipse(-40, 50, 26, 19, -.3, 0, TAU); ctx.ellipse(45, 30, 26, 19, -.3, 0, TAU); ctx.fill();
      ctx.fillRect(-18, -70, 10, 120); ctx.fillRect(67, -90, 10, 120); ctx.beginPath(); ctx.moveTo(-18, -70); ctx.lineTo(77, -90); ctx.lineTo(77, -60); ctx.lineTo(-18, -40); ctx.fill(); break;
    case 'eye':
      ctx.beginPath(); ctx.moveTo(-90, 0); ctx.quadraticCurveTo(0, -80, 90, 0); ctx.quadraticCurveTo(0, 80, -90, 0); F(col1);
      ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); F(col2); ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); F(DARK); break;
    case 'heart':
      ctx.beginPath(); ctx.moveTo(0, 70); ctx.bezierCurveTo(-110, 0, -60, -90, 0, -35); ctx.bezierCurveTo(60, -90, 110, 0, 0, 70); F(col1); break;
    case 'share':
      ctx.beginPath(); ctx.moveTo(10, -70); ctx.lineTo(90, 0); ctx.lineTo(10, 70); ctx.lineTo(10, 30); ctx.quadraticCurveTo(-60, 30, -90, 75); ctx.quadraticCurveTo(-80, -25, 10, -30); ctx.closePath(); F(col1); break;
    case 'comment':
      ctx.beginPath(); ctx.ellipse(0, -10, 90, 65, 0, 0, TAU); ctx.moveTo(-40, 40); ctx.lineTo(-60, 85); ctx.lineTo(0, 50); F(col1);
      ctx.fillStyle = DARK; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 32, -10, 9, 0, TAU); ctx.fill(); } break;
    case 'magnet':
      ctx.lineWidth = 46; ctx.strokeStyle = '#ff3b5c'; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.arc(0, -10, 55, Math.PI, 0, true); ctx.stroke();
      ctx.fillStyle = '#e9edf5'; ctx.fillRect(-78, -12, 46, 36); ctx.fillRect(32, -12, 46, 36);
      ctx.fillStyle = '#ff3b5c'; ctx.fillRect(-78, -60, 46, 50); ctx.fillRect(32, -60, 46, 50); break;
    case 'lens':
      ctx.lineWidth = 16; ctx.strokeStyle = col1; ctx.beginPath(); ctx.arc(-15, -15, 55, 0, TAU); ctx.stroke();
      ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(25, 25); ctx.lineTo(80, 80); ctx.stroke();
      ctx.beginPath(); ctx.arc(-15, -15, 40, 0, TAU); F('rgba(0,174,239,.35)'); break;
    case 'bookmark':
      ctx.beginPath(); ctx.moveTo(-55, -85); ctx.lineTo(55, -85); ctx.lineTo(55, 85); ctx.lineTo(0, 45); ctx.lineTo(-55, 85); ctx.closePath(); F(col1);
      ctx.fillStyle = col2; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * TAU / 10 - Math.PI / 2, r = i % 2 ? 12 : 28; ctx.lineTo(Math.cos(a) * r, -25 + Math.sin(a) * r); } ctx.fill(); break;
    case 'coin':
      ctx.beginPath(); ctx.arc(0, 0, 70, 0, TAU); F('#d9a520'); ctx.beginPath(); ctx.arc(-4, -4, 64, 0, TAU); F('#ffd23f');
      ctx.lineWidth = 6; ctx.strokeStyle = '#d9a520'; ctx.beginPath(); ctx.arc(-4, -4, 46, 0, TAU); ctx.stroke(); break;
    case 'star':
      ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * TAU / 10 - Math.PI / 2, r = i % 2 ? 38 : 85; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); F(col2); break;
    case 'play':
      ctx.beginPath(); ctx.arc(0, 0, 80, 0, TAU); F(col1); ctx.beginPath(); ctx.moveTo(-22, -38); ctx.lineTo(42, 0); ctx.lineTo(-22, 38); ctx.closePath(); F(col2); break;
    case 'call':
      ctx.beginPath(); ctx.arc(0, 0, 85, 0, TAU); F('#25c766');
      ctx.save(); ctx.rotate(-.7); ctx.fillStyle = '#ffffff'; rr(-14, -48, 28, 96, 12); ctx.fill(); rr(-30, -54, 60, 26, 12); ctx.fill(); rr(-30, 28, 60, 26, 12); ctx.fill(); ctx.restore(); break;
    case 'bag':
      rr(-70, -40, 140, 120, 14); F(col2); ctx.lineWidth = 10; ctx.strokeStyle = col1; ctx.beginPath(); ctx.arc(0, -40, 36, Math.PI, 0); ctx.stroke(); break;
    case 'moneybag':
      ctx.beginPath(); ctx.moveTo(-30, -70); ctx.lineTo(30, -70); ctx.lineTo(18, -45); ctx.bezierCurveTo(110, -10, 110, 90, 0, 90); ctx.bezierCurveTo(-110, 90, -110, -10, -18, -45); ctx.closePath(); F('#b8862f');
      ctx.fillStyle = '#7a5518'; ctx.fillRect(-24, -52, 48, 10); txt('$', 0, 26, 80, 900, '#ffe08a'); break;
  }
  ctx.restore();
}

function drawPhone(x, y, s, screenFn, o = {}) {
  if (s <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(s * (o.sx ?? 1), s);
  ctx.globalAlpha *= o.alpha ?? 1;
  softShadow(0, 450, 260, 40, .5);
  if (o.glow) { ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(0, 0, 640, o.glowC || '#7b5cff', .35 * o.glow); ctx.restore(); }
  const bg = ctx.createLinearGradient(-210, -430, 210, 430); bg.addColorStop(0, '#5a6070'); bg.addColorStop(.5, '#1b1e28'); bg.addColorStop(1, '#3e4352');
  rr(-212, -432, 424, 864, 58); ctx.fillStyle = bg; ctx.fill();
  rr(-204, -424, 408, 848, 52); ctx.fillStyle = '#07080d'; ctx.fill();
  ctx.save(); rr(-192, -412, 384, 824, 42); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(-192, -412, 384, 824);
  if (screenFn) screenFn();
  // glass reflection
  const rg = ctx.createLinearGradient(-192, -412, 192, 412); rg.addColorStop(0, 'rgba(255,255,255,.10)'); rg.addColorStop(.35, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(255,255,255,.03)');
  ctx.fillStyle = rg; ctx.fillRect(-192, -412, 384, 824);
  ctx.restore();
  rr(-52, -400, 104, 28, 14); ctx.fillStyle = '#000'; ctx.fill();
  ctx.fillStyle = '#2a2e3a'; ctx.fillRect(210, -260, 5, 70); ctx.fillRect(-215, -300, 5, 50); ctx.fillRect(-215, -230, 5, 50);
  ctx.restore();
}
function chip(label, x, y, size, a, iconK, iconC) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(a); const s = lerp(.7, 1, eoB(clamp(a)));
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.font = font(size, 800); const tw = ctx.measureText(label).width, iw = iconK ? size * 1.4 : 0, w = tw + size * 1.6 + iw, h = size * 1.9;
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = 'rgba(10,12,28,.72)'; ctx.fill();
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, C); g.addColorStop(.5, M); g.addColorStop(1, Y);
  ctx.lineWidth = 3; ctx.strokeStyle = g; ctx.stroke();
  txt(label, -iw / 2, 3, size, 800, '#ffffff');
  if (iconK) { ctx.save(); ctx.translate(w / 2 - size * 1.05, 0); icon(iconK, size / 190, iconC || '#ffffff', Y); ctx.restore(); }
  ctx.restore();
}
function headline(s, y, size, a, col = '#ffffff', fam = 'Cairo') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(540, y + (1 - eo5(clamp(a))) * 40);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20 * S; txt(s, 0, 0, size, fam === 'Reem' ? 700 : 900, col, 'center', fam); ctx.restore();
}

// =====================================================================

    ctx.beginPath(); ctx.arc(1830, y, 18, 0, TAU); ctx.fillStyle = '#1b1f3e'; ctx.fill();
    ctx.font = font(20, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr'; ctx.fillText(String(i + 1), 1830, y + 1);
    txt(s, 1798, y + 2, 20, 700, '#2a2a2a', 'right');
  });
  // colour swatches
  [['#1b1f3e', 'كحلي'], [BR, 'أحمر'], [YL, 'أصفر'], ['#121317', 'أسود']].forEach(([c, n], i) => {
    const x = 1800 - i * 120; ctx.fillStyle = c; rr(x - 40, 880, 80, 60, 10); ctx.fill(); ctx.strokeStyle = '#ccc'; ctx.stroke(); txt(n, x, 965, 22, 800, '#333');
  });
}
window.facade = facade; window.spec = spec;
