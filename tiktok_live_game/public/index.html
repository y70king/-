<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساحة البث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0d1a; --card: #161a3a; --line: #2c3270; --text: #fff; --muted: #9fb0ff; --pink: #ff3d7f; --gold: #ffd84d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Cairo", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body.transparent { background: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, calc(100dvh * 9 / 16)); height: min(100dvh, calc(100vw * 16 / 9)); touch-action: manipulation; }

  .sheet { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(5,6,16,.92); padding: 16px; box-sizing: border-box; }
  .sheet.on { display: flex; }
  .box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; max-height: 100%; overflow-y: auto; }
  h1 { margin: 0; text-align: center; font-size: 30px; }
  h2 { margin: 6px 0 0; font-size: 17px; color: var(--muted); font-weight: 600; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; text-align: center; }
  input[type=text] { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: #0d1030; color: var(--text); direction: ltr; text-align: left; width: 100%; box-sizing: border-box; }
  button { font: inherit; font-size: 17px; font-weight: 800; padding: 13px; border: 0; border-radius: 14px; cursor: pointer;
    background: #2b2f66; color: var(--text); }
  button.main { background: var(--pink); }
  button:active { transform: scale(.98); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  label.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 16px; }
  input[type=range] { flex: 1; max-width: 55%; accent-color: var(--pink); }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--pink); }
  #status { font-size: 14px; text-align: center; color: var(--gold); min-height: 1.4em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .grid button { font-size: 11px; padding: 6px 2px; font-weight: 600; border-radius: 10px; line-height: 1.4; }
  #test { padding: 6px; }
  #test .box { max-width: 520px; }

  /* زر الإعدادات يظهر بس لما الماوس يكون فوقه، حتى ما يبين بالبث */
  #gear { position: fixed; z-index: 6; bottom: 10px; left: 10px; width: 44px; height: 44px;
    padding: 0; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 20px; opacity: 0; transition: opacity .2s; }
  #gear:hover, #gear:focus-visible { opacity: 1; }
  .keys { font-size: 13px; color: var(--muted); text-align: center; }
  kbd { background: #0d1030; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-family: inherit; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<button id="gear" title="الإعدادات">⚙️</button>

<!-- شاشة البداية / الإعدادات -->
<div class="sheet on" id="setup">
  <div class="box">
    <h1>⚔️ ساحة البث</h1>
    <p>لعبة تفاعلية لبثك المباشر: اللايكات والهدايا تدخّل أسماء المشاهدين للساحة، والصوت يعلّق على كل شي يصير.</p>
    <h2>يوزرك بتيك توك</h2>
    <input type="text" id="user" placeholder="مثال: myname" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="main" id="go">▶ ابدأ (لازم تكون لايف)</button>
    <button id="demo">🧪 تجربة بدون بث</button>
    <div id="status"></div>

    <h2>الصوت</h2>
    <label class="opt">🔊 التعليق الصوتي <input type="checkbox" id="voiceOn" checked></label>
    <label class="opt">مستوى الصوت <input type="range" id="vol" min="0" max="1" step="0.1" value="1"></label>
    <label class="opt">سرعة الكلام <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1"></label>
    <label class="opt">📣 يعلّق على دخول اللاعبين <input type="checkbox" id="sayJoins" checked></label>
    <button id="testVoice">🔈 جرّب الصوت</button>

    <h2>الشاشة</h2>
    <label class="opt">🧪 أزرار التجربة <input type="checkbox" id="testOn"></label>
    <div class="keys">اختصارات: <kbd>S</kbd> الإعدادات · <kbd>T</kbd> أزرار التجربة</div>
    <button id="close">✔ رجوع للعبة</button>
  </div>
</div>

<!-- أزرار التجربة -->
<div class="sheet" id="test" style="background: transparent; pointer-events: none; align-items: flex-end;">
  <div class="box" style="pointer-events: auto; background: rgba(15,18,45,.85); padding: 8px; gap: 6px; border-radius: 14px;">
    <input type="text" id="tname" placeholder="اسم المشاهد (اختياري)" style="direction: rtl; text-align: right; font-size: 13px; padding: 5px 10px; border-radius: 10px;">
    <div class="grid">
      <button data-k="like" data-c="1">❤️ لايك</button>
      <button data-k="like" data-c="20">❤️ 20</button>
      <button data-k="join">💬 دخول</button>
      <button data-k="gift" data-d="1" data-g="Rose">🌹 درع</button>
      <button data-k="gift" data-d="30" data-g="Perfume">🎁 عملاق</button>
      <button data-k="gift" data-d="199" data-g="Sunglasses">💣 قنبلة</button>
      <button data-k="gift" data-d="1000" data-g="Galaxy">👑 ملك</button>
      <button data-k="follow">➕ متابعة</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
