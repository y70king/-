name: Build Debt Reader APK

on:
  push:
    paths:
      - "debt-app/**"
      - ".github/workflows/debt_app_apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debt-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DebtReader-apk
          path: debt-app/app/build/outputs/apk/release/app-release.apk
